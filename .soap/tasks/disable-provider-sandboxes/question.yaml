feature: disable-provider-sandboxes
created: "2026-05-21"
approved: true
questions:
  - id: Q1
    text: Codex CLI 要如何關閉 sandbox 與 approval？
    type: codebase-investigation
    completed: true
    answer: |
      OpenAI Codex CLI 官方文件列出 `--sandbox` 可選 `read-only | workspace-write | danger-full-access`，
      並在 safety tips 中說明 `--dangerously-bypass-approvals-and-sandbox` 會避免 sandbox，
      適合在 dedicated sandbox VM 內使用。本專案目前 Codex fresh session 傳
      `--sandbox workspace-write`，resume session 傳 `-c sandbox_mode=workspace-write`，
      因此要改成完整權限時，fresh/resume 都應改用
      `--dangerously-bypass-approvals-and-sandbox`，並移除 workspace-write 專用的
      `sandbox_workspace_write.network_access=true`。

  - id: Q2
    text: Claude Agent SDK 要如何關閉 sandbox？
    type: codebase-investigation
    completed: true
    answer: |
      Claude Agent SDK 官方文件顯示 sandbox 設定有 `enabled` 欄位，Python reference 標示
      `enabled` 預設為 false；也有 `allowUnsandboxedCommands` 可讓模型要求單次跳出 sandbox。
      本專案不是使用預設值，而是在 `runClaudeQuery` 內主動組 `defaultSandbox` 並傳入
      `sandbox: options.sandbox ?? defaultSandbox`，其中 `enabled: true`。要完整拔掉 sandbox，
      後端應停止傳入這個 default sandbox，或明確傳 `sandbox: { enabled: false }`，同時保留
      `permissionMode: "bypassPermissions"` 與既有 allowedTools。

  - id: Q3
    text: OpenCode 要如何讓工具權限全開？
    type: codebase-investigation
    completed: true
    answer: |
      OpenCode 官方 permissions 文件說明可在 `opencode.json` 設 `permission: "allow"` 一次允許所有
      permissions，也可針對 `bash`、`edit`、`external_directory` 等工具設 allow。本專案的
      `buildOpencodeTransientServerConfig` 已在有 MCP entries、走 transient server 時設定
      `edit/bash/webfetch/doom_loop/external_directory: "allow"`。但沒有 transient server 時，
      provider 會使用全域 opencode server，註解也指出由使用者的
      `~/.config/opencode/opencode.json` 決定。因此若要 product-level 全開，需讓所有 opencode
      run 都走後端注入的 `permission: "allow"` config，或在全域 server 啟動時也注入同等 config，
      避免依賴使用者本機設定。

  - id: Q4
    text: 這次變更是否需要前端設定入口或使用者可切換選項？
    type: user-input
    completed: true
    answer: |
      使用者已明確收斂為「拔掉 sandbox」，產品只有 run mode，AI 需要完整權限才有意義。
      本計畫不做前端切換選項，直接調整 provider 預設行為。

  - id: Q5
    text: 現有 run workspace 隔離是否已足夠支撐 provider 全權限？
    type: codebase-investigation
    completed: true
    answer: |
      現有 Run 建立流程會對有 repositoryId 且有 origin/commit 的 repo 建立
      `repositoriesRoot/<repositoryId>-run-<runId>` local clone，並把該路徑傳給 provider 作為
      `workspacePath`。這代表核心隔離邊界已是 run 專用 clone，而非 provider sandbox。
      本計畫會保留 `workspacePath` 解析、安全 root 驗證、provider env 白名單與 run-scoped
      resource lifecycle，不把 git 操作移到 backend。
