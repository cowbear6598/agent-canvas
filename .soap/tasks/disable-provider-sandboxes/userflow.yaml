feature: disable-provider-sandboxes
approved: true
scenarios:
  - id: F1
    scenario: 使用者啟動 Codex Run 並讓 AI 自行操作 git
    given:
      - 使用者已建立包含 repository 的 Run
      - Run 使用專用 local clone 作為工作目錄
      - Pod 使用 Codex provider
    when:
      - 使用者要求 AI 切換分支
      - 使用者要求 AI 讀寫檔案
      - 使用者要求 AI 執行 shell 指令
    then:
      - AI 可以在 run clone 內建立 git lock file
      - AI 可以完成 branch checkout
      - AI 不會因 Codex sandbox 權限被阻擋

  - id: F2
    scenario: 使用者啟動 Claude Run 並讓 AI 自行操作工作目錄
    given:
      - 使用者已建立 Run
      - Run 使用專用工作目錄
      - Pod 使用 Claude provider
    when:
      - 使用者要求 AI 修改程式碼
      - 使用者要求 AI 執行 shell 指令
      - 使用者要求 AI 操作 git metadata
    then:
      - AI 使用完整工具權限執行任務
      - AI 不會被 Claude SDK sandbox 攔截
      - 既有 Claude tool permission bypass 行為維持可用

  - id: F3
    scenario: 使用者啟動 OpenCode Run 並讓 AI 自行操作工作目錄
    given:
      - 使用者已建立 Run
      - Run 使用專用工作目錄
      - Pod 使用 OpenCode provider
    when:
      - 使用者要求 AI 修改檔案
      - 使用者要求 AI 執行 shell 指令
      - 使用者要求 AI 存取 run 所需路徑
    then:
      - OpenCode 不會發出需要人工批准的 permission prompt
      - AI 可以完成 edit 與 bash 工具呼叫
      - OpenCode 行為不依賴使用者全域 opencode 設定

  - id: F4
    scenario: 使用者依賴 Run clone 作為唯一執行隔離邊界
    given:
      - 使用者接受 provider 內建 sandbox 被停用
      - Run 使用專用 local clone
      - 後端仍負責解析 provider 的工作目錄
    when:
      - AI 在 Run 中執行完整權限工具
    then:
      - AI 的預設工作位置仍是 run workspace
      - 後端仍保留 workspace root 驗證
      - 後端仍保留 provider 環境變數白名單

  - id: F5
    scenario: 使用者檢查 provider sandbox 已完整移除
    given:
      - 使用者已決定 Run provider 權限全開
      - 系統支援 Claude provider
      - 系統支援 Codex provider
      - 系統支援 OpenCode provider
    when:
      - 使用者檢查 provider 執行設定
      - 使用者檢查相關測試預期
      - 使用者檢查文件註解與錯誤訊息
    then:
      - Codex 不再傳入 workspace-write sandbox 設定
      - Claude 不再建立或傳入 SDK sandbox 設定
      - OpenCode 不再依賴使用者全域 permission 設定
      - 測試不再期待 sandbox 或 writable root 行為
      - 文件註解不再描述已移除的 sandbox 行為
