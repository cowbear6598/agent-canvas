feature: disable-provider-sandboxes
side: backend
approved: true
phases:
  - id: P1
    title: Codex provider 拔除 sandbox
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P1.A
        title: Codex CLI 參數改為完整權限
        tasks:
          - id: P1.A.t1
            text: 調整 `backend/src/services/provider/codexProvider.ts` 的 fresh session 參數，移除 `--sandbox workspace-write` 與 `sandbox_workspace_write.network_access=true`，改用 `--dangerously-bypass-approvals-and-sandbox`
            completed: true
            last_files_changed:
              - backend/src/services/provider/codexProvider.ts
          - id: P1.A.t2
            text: 調整 `backend/src/services/provider/codexProvider.ts` 的 resume session 參數，移除 `sandbox_mode=workspace-write` 與 `sandbox_workspace_write.network_access=true`，改用 `--dangerously-bypass-approvals-and-sandbox`
            completed: true
            last_files_changed:
              - backend/src/services/provider/codexProvider.ts
          - id: P1.A.t3
            text: 清理 `codexProvider.ts` 內描述 workspace-write sandbox、sandbox boundary、network_access 的註解，改成描述 run clone 與 Codex bypass 權限模型
            completed: true
            last_files_changed:
              - backend/src/services/provider/codexProvider.ts
      - id: P1.B
        title: Codex 測試與文件同步
        tasks:
          - id: P1.B.t1
            text: 更新 `backend/tests/provider/codexProvider.test.ts` 的 fresh session spawn 斷言，改為期待 bypass flag 並確認不含 workspace-write sandbox 設定
            completed: true
            last_files_changed:
              - backend/tests/provider/codexProvider.test.ts
          - id: P1.B.t2
            text: 更新 `backend/tests/provider/codexProvider.test.ts` 的 resume session spawn 斷言，改為期待 bypass flag 並確認不含 workspace-write sandbox 設定
            completed: true
            last_files_changed:
              - backend/tests/provider/codexProvider.test.ts
          - id: P1.B.t3
            text: 移除或改寫 `backend/tests/provider/codexProvider.test.ts` 中保證不傳 writable_roots 的舊測試，改成保證不殘留 workspace-write 相關 config
            completed: true
            last_files_changed:
              - backend/tests/provider/codexProvider.test.ts
          - id: P1.B.t4
            text: 更新 `backend/src/services/provider/codexProvider.md`，移除 `--yolo`、workspace-write、sandbox network 等過期描述，改寫為目前 Codex Run 使用完整權限
            completed: true
            last_files_changed:
              - backend/src/services/provider/codexProvider.md

  - id: P2
