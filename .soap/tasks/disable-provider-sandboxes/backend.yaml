    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P2.A
        title: Claude SDK options 不再注入 sandbox
        tasks:
          - id: P2.A.t1
            text: 調整 `backend/src/services/provider/claude/runClaudeQuery.ts`，移除 default sandbox 建構與 `sandbox: options.sandbox ?? defaultSandbox` 的預設注入，讓 Claude SDK 使用非 sandbox 執行
            completed: true
            last_files_changed:
              - backend/src/services/provider/claude/runClaudeQuery.ts
          - id: P2.A.t2
            text: 清理 `runClaudeQuery.ts` 對 `buildClaudeSandboxAllowWrite`、`buildClaudeSandboxDenyWrite`、`buildClaudeSandboxNetwork` 的 import 與相關註解，避免殘留已移除的 sandbox 路徑
            completed: true
            last_files_changed:
              - backend/src/services/provider/claude/runClaudeQuery.ts
              - backend/src/services/claude/claudeSandboxPaths.ts
          - id: P2.A.t3
            text: 調整 `backend/src/services/claude/claudeService.ts` 的 disposable Claude 查詢基礎 options，移除 SDK sandbox 設定與 sandbox path helper import，避免 summary/disposable 路徑殘留 Claude sandbox
            completed: true
            last_files_changed:
              - backend/src/services/claude/claudeService.ts
          - id: P2.A.t4
            text: 檢查 `backend/src/services/provider/claude/buildClaudeOptions.ts` 的 `ClaudeOptions.sandbox` 欄位註解，改成只描述呼叫端若明確提供才會傳入，不再描述預設會動態組裝 sandbox
            completed: true
            last_files_changed:
              - backend/src/services/provider/claude/buildClaudeOptions.ts
      - id: P2.B
        title: Claude 測試同步
        tasks:
          - id: P2.B.t1
            text: 更新 `backend/tests/unit/runClaudeQuery.test.ts` 的 sandbox 配置斷言，改為確認預設 query options 不含 sandbox 或 sandbox 未啟用
            completed: true
            last_files_changed:
              - backend/tests/unit/runClaudeQuery.test.ts
          - id: P2.B.t2
            text: 移除 `backend/tests/unit/runClaudeQuery.test.ts` 中對 allowWrite、denyWrite、network.allowedDomains 的預設 sandbox 期待，保留呼叫端明確傳入 `options.sandbox` 時原樣轉交 SDK 的測試
            completed: true
            last_files_changed:
              - backend/tests/unit/runClaudeQuery.test.ts
          - id: P2.B.t3
            text: 更新 `backend/tests/unit/claudeService.test.ts`，確認 disposable Claude 查詢不再傳入 SDK sandbox 設定
            completed: true
            last_files_changed:
              - backend/tests/unit/claudeService.test.ts
          - id: P2.B.t4
            text: 檢查 `backend/tests/unit/claudeSandboxPaths.test.ts` 是否仍只覆蓋未被使用的 helper；若 helper 不再被 production path 引用，刪除 helper 與對應測試，避免 sandbox dead code 殘留
            completed: true
            last_files_changed:
              - backend/src/services/claude/claudeSandboxPaths.ts
              - backend/tests/unit/claudeSandboxPaths.test.ts

  - id: P3
