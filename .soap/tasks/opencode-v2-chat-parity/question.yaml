feature: opencode-v2-chat-parity
created: "2026-05-19"
approved: true
questions:
  - id: Q1
    text: 目前 opencode 對話為什麼會把文字與工具資訊集中在同一個 bubble？
    type: codebase-investigation
    completed: true
    answer: |
      現行 `backend/src/services/provider/opencodeProvider.ts` 主要依賴 v1
      streaming 路徑。串流期間多數只拿到 `message.part.delta` 的文字增量，
      tool 資訊通常要等 `session.idle` 後再呼叫 `session.messages()` 補查，
      然後回補成 `tool_call_start` / `tool_call_result`。因此無法像 Claude /
      Codex 一樣在同一輪過程中自然切出 text / tool 邊界，最後容易落成同一個
      assistant message。

  - id: Q2
    text: 前端目前是如何把 assistant 串流內容切成多個 bubble，哪一段邏輯會讓 opencode 更容易被合併？
    type: codebase-investigation
    completed: true
    answer: |
      前端 chat 與 run modal 都共用 `subMessages` 模型：`text` 事件會追加到目前
      sub-message，`tool_call_start` 會先 flush 現有文字再建立新的 tool segment。
      但 `frontend/src/stores/chat/subMessageHelpers.ts` 的
      `mergeEmptySubMessages()` 會把「只有 tool、沒有文字」的 sub-message 併回前一個
      bubble。對 opencode 來說，因為 tool 事件常在文字全部結束後才回補，這個規則會讓
      tool tag 更容易被視覺上黏回同一個 bubble。

  - id: Q3
    text: 這次 opencode 規劃要採用哪一條技術主線？
    type: user-input
    completed: true
    answer: |
      採用 SDK v2 作為主線，不做只修前端 merge 或 v1/v2 混合的短期方案。

  - id: Q4
    text: 這次 SDK v2 遷移要保留舊 v1 路徑當 fallback，還是直接取代？
    type: user-input
    completed: true
    answer: |
      直接以 v2 取代現有 v1 opencode provider 主線，不保留長期雙軌 fallback，也不加
      feature flag。

  - id: Q5
    text: SDK v2 是否真的提供足夠的事件粒度，讓 opencode 能接近 Claude / Codex 的串流語義？
    type: codebase-investigation
    completed: true
    answer: |
      是。repo 內安裝的 `@opencode-ai/sdk` v2 型別顯示 event stream 提供
      `session.next.text.delta`、`session.next.reasoning.delta`、
      `session.next.tool.called`、`session.next.tool.success`、
      `session.next.tool.failed` 等高階事件；同時仍保有 `v2.session.messages`
      可在回合完成後讀取 projection。這代表 provider 層可以直接把 v2 映射到既有
      `NormalizedEvent` 契約，而不再依賴 `session.idle` 後補查 tool parts。

  - id: Q6
    text: 這次規劃的影響範圍只包含一般 chat，還是也包含 run modal / run transcript？
    type: codebase-investigation
    completed: true
    answer: |
      兩邊都包含。一般 chat 與 run 模式最終都依賴同一套 `NormalizedEvent` ->
      `subMessages` -> `ChatMessages` 流程；若 opencode provider 改成 v2 並正確產生
      text / tool 事件，chat store 與 run store 都會一起受益，因此規劃應同時涵蓋 chat
      與 run transcript，而不是只修單一路徑。
