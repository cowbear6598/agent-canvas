          - id: P1.A.t1
            text: |
              修改 `backend/src/database/schema.ts` 的 `createBaseTables`：
              將 pods 表 DDL 中的 `multi_instance INTEGER NOT NULL DEFAULT 0,` 整行移除；
              移除 messages 表 DDL（含對應的 `idx_messages_pod_id` index 建立指令）。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed: ["backend/src/database/schema.ts"]
          - id: P1.A.t2
            text: |
              在 `backend/src/database/schema.ts` 新增 migration 函式 `migratePodsDropMultiInstance(db)`，
              邏輯：用字串拼接（避免 dead code 殘留檢查命中）檢查 pods 表是否仍有 `multi_instance` 欄位，
              若有則執行 `ALTER TABLE pods DROP COLUMN multi_instance`；
              並在同檔內新增 `migrateDropMessagesTable(db)` 執行 `DROP TABLE IF EXISTS messages`
              與 `DROP INDEX IF EXISTS idx_messages_pod_id`。
              將這兩個新函式加入 `createTables(db)` 的呼叫序列（接在現有 migrate 函式後面）。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed: ["backend/src/database/schema.ts"]
          - id: P1.A.t3
            text: |
              修改 `backend/src/database/statements.ts`：
              （a）從 `pod` 區塊與 buildStatements 回傳型別宣告中移除 `updateMultiInstance` 欄位與對應 prepare；
              （b）`pod.insert` 與 `pod.update` 兩支 SQL 移除 `multi_instance` 欄位（含 INSERT 欄位列與 VALUES 佔位符 `$multiInstance`、UPDATE SET 句中的 `multi_instance = $multiInstance`）；
              （c）整個 `message: { ... }` 區塊與其在型別宣告中的對應 key 全部移除。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed: ["backend/src/database/statements.ts"]
          - id: P1.A.t4
            text: |
              修改 `backend/src/services/podStore.ts`：
              （a）`PodRow` interface 移除 `multi_instance: number` 欄位；
              （b）插入 / 更新 pod 時的 bind params 物件移除 `multiInstance` 對應 key（搜尋 `multi_instance` 與 `multiInstance` 命中的 binding 程式碼）；
