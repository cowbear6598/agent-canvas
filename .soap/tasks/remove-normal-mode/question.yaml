  - id: Q10
    text: |
      `PodActions.vue` 中「短按橡皮擦＝clear chat」「長按橡皮擦＝toggle multi-instance」目前的
      互動細節（含 long-press 偵測時間、視覺 feedback、disabled state 等），以利評估拿掉 toggle
      後，短按 clear 行為與視覺是否需要調整。
    type: codebase-investigation
    completed: true
    answer: |
      PodActions long-press 互動細節：

      - 短按：mouseup → emit `clear-workflow` → 由 CanvasPod 接收（handleEraserMouseUp,
        PodActions.vue:127-132）
      - 長按 threshold: 500ms（LONG_PRESS_DURATION_MS, PodActions.vue:64）
      - 長按觸發 → emit `toggle-multi-instance` → 進入 5000ms debounce
        (TOGGLE_DEBOUNCE_GUARD_MS, PodActions.vue:59, 115-124)
      - 視覺 feedback：Teleport SVG 長按進度圈（PodActions.vue:311-364, overlay.css:8-21）
      - 圖標切換：multiInstance=true 時 Eraser icon → "M" 字母（PodActions.vue:224-227）
      - CSS class：`multi-instance-icon-m`（pod.css:292-298, monospace 16px bold 灰）;
        `multi-instance-enabled`（pod.css:301-307, 淺青藍背景）
      - 短按 clear 行為無 multiInstance 特殊處理（mouseup handler 無檢查
        isMultiInstanceEnabled, isEraserDisabled computed 也無 multiInstance 項）
      - 短按 clear 邏輯與長按 toggle 邏輯完全獨立，移除長按後保留短按完全 OK

      要刪除的部分：
      - LONG_PRESS_DURATION_MS, TOGGLE_DEBOUNCE_GUARD_MS 常數
      - longPressTimer / isLongPress / isLongPressing / longPressProgress /
        progressAnimationFrame / longPressStartTime / cleanupLongPress 等 ref / 函式
      - handleEraserMouseDown 內的進度計算與 timeout（簡化為 stopPropagation only）
      - handleEraserMouseUp 內的 `if (!isLongPress)` 判定（直接 emit clear-workflow）
      - handleEraserMouseLeave
      - Teleport SVG 進度圈 template 區塊（PodActions.vue:311-364）
      - `multi-instance-icon-m` 與 `multi-instance-enabled` CSS rules（pod.css:292-307）
      - long-press-indicator / long-press-ring CSS（overlay.css:8-21）
      - `toggle-multi-instance` emit 定義（PodActions.vue:45）
      - CanvasPod.vue 端 handleToggleMultiInstance（CanvasPod.vue:425-430）與
        `@toggle-multi-instance` listener（CanvasPod.vue:594）
