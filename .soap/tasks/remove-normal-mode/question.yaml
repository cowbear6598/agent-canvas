  - id: Q8
    text: |
      `messageStore` 服務與 `messages` 表的所有 callers 完整盤點（含 read 與 write），確認是否
      有任何 run 模式流程仍會讀寫此表，以及是否有純粹「展示歷史訊息」的入口會因此失效。
    type: codebase-investigation
    completed: true
    answer: |
      messageStore caller 盤點 + 結論：

      Read callers:
        - backend/src/utils/messageHelper.ts:4（getLastAssistantMessage）
        - backend/src/handlers/chatHandlers.ts:483（POD_CHAT_HISTORY handler）
        - backend/src/services/summaryService.ts:115（runContext 不存在時的 fallback）
        - backend/src/services/workflow/workflowAutoTriggerService.ts:55
        - backend/src/services/workflow/branchDecisionService.ts:66

      Write callers:
        - backend/src/utils/chatHelpers.ts:32, 41（injectUserMessage）
        - backend/src/services/normalExecutionStrategy.ts:40（upsertMessage）

      Clear callers:
        - backend/src/handlers/repositoryHandlers.ts:108
        - backend/src/handlers/repository/repositoryBindHelpers.ts:16
        - backend/src/services/workflowClearService.ts:119

      DB statements（statements.ts:473-492）: insert / selectByPodId / selectById /
      upsert / deleteByPodId / deleteByCanvasId

      關鍵結論：
      1. Run mode 完全與 messages 表脫鉤 — Run mode 使用 runStore + run_messages 表
      2. summaryService, workflowAutoTriggerService, branchDecisionService 三個服務在
         runContext 不存在時會 fallback 到 messageStore；移除一般模式後這些 fallback
         分支可一併移除（或改為「只有 run mode」的單一路徑）
      3. POD_CHAT_HISTORY WebSocket event 與其 result event 可整組刪除
      4. messageStore 整個服務檔案可刪除
      5. messages 表可 drop（已在 Q1 確認）
      6. 附件對齊機制：用 message id 作為目錄名稱（chatHelpers.ts:30-39），改 run mode
         需確認 run_messages 是否有同樣 id 對齊機制（實作時要驗證）

