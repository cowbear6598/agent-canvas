feature: remove-normal-mode
created: "2026-05-16"
approved: true

questions:
  - id: Q1
    text: |
      資料策略決定 — DB 層的 `pods.multi_instance` 欄位、`messages` 表（一般模式訊息儲存）
      以及相關附件表，要完全刪除（含 migration drop）還是保留 schema 但程式碼不再讀寫？
      影響：完全刪除＝乾淨但不可逆且既有訊息會消失；保留＝可向後查詢但 codebase 留死欄位。
    type: user-input
    completed: true
    answer: |
      完全刪除（drop migration）。寫一支 migration drop 掉 `pods.multi_instance` 欄位與
      `messages` 表（含相關 prepared statements）；code 一併清乾淨。

  - id: Q2
    text: |
      既有 `multiInstance=false` 的 pod 與其歷史訊息（messages 表）要如何處理？
      候選方案：
      (a) 直接刪除歷史訊息，但 pod 本身保留並視為 multi-run pod
      (b) 寫 migration 把舊 messages 搬到 run_messages（建立一筆對應的 historical run）
      (c) 完全清除（含 pod 一起刪）
      (d) 只清訊息，視為「過去歷史就沒了，從這之後都是 run」
    type: user-input
    completed: true
    answer: |
      只刪訊息，pod 保留視為 multi-run pod。messages 表整個 drop，舊歷史訊息直接消失；
      既有 pod 不刪，未來都走 run 邏輯。

  - id: Q3
    text: |
      UI 層的「橡皮擦長按切換 multi-instance」入口、`multi-instance-icon-m` 視覺指示
      （PodActions.vue 中的 toggle-multi-instance 行為與顯示），要全部拿掉嗎？
      預期：移除後一般模式沒了，pod 一律 multi-run，所以這些 toggle 與 icon 應該都失去意義。
    type: user-input
    completed: true
    answer: |
      全部拿掉。橡皮擦 long-press toggle 邏輯、`multi-instance-icon-m`、`multi-instance-enabled`
      class、相關 i18n 文案、長按進度圈 SVG 全部移除。短按 clear chat 行為保留（已確認獨立性）。
    text: |
      `multiInstance` 這個屬性與相關 helper（multiInstanceGuard.ts、isMultiInstanceSourcePod、
      isMultiInstanceChainPod、launchMultiInstanceRun、POD_SET_MULTI_INSTANCE 事件等）要不要趁
      這次一併改名 / 重構？例如：因為 multi 變預設行為，這些 helper 可能直接內聯掉 / 改成 run 相關命名。
      影響：一起改＝乾淨但 diff 大；分階段＝先移除一般模式邏輯，命名留下次。
    type: user-input
    completed: true
    answer: |
      趁這次一併重構命名。具體方向（rename target）由 Q11 進一步釐清。

  - id: Q5
    text: |
      README.md、README.en.md、README.ja.md、CHANGELOG.md、tutorials/、prds/ 中關於「一般模式 vs
      Multi-Instance 模式」的說明（README 行 134-148 等）要在這次一起更新嗎？或這次只動 code，
      文件留下一個獨立 task？
    type: user-input
    completed: true
    answer: |
      只動 code，所有文件留下個 task。本次只處理 code 與測試；README zh/en/ja、CHANGELOG、
      tutorials/、prds/ 一律另開 task 處理。注意：README 說明與實際行為會有一段時間不一致。

  - id: Q6
    text: |
      `scheduleService` 在「一般模式忙碌時跳過」、`integrationEventPipeline` 在「normalPods busy
      check」上有特殊處理（pipeline 行 98-113、161-174；schedule 行 245-294）。移除一般模式後，
      schedule 與 integration 事件就只剩 multi-run 路徑：multi-run 預設不受 busy 影響、直接建立
      新 Run。請確認這個行為變更是否可接受？（影響：schedule cron 觸發若使用者連續觸發會建立多個
      Run；integration webhook 也一樣。）
    type: user-input
    completed: true
    answer: |
      可接受。schedule 與 integration 都直接走 multi-run 邏輯，連續觸發會建立多個 Run。
      原本「busy 時跳過」的程式碼一併移除（integrationEventPipeline 行 98-113, 161-174、
      scheduleService 行 245-294 一般模式分支）。

