feature: goal-modal-redesign
approved: true

scenarios:
  - id: F1
    scenario: 使用者開啟 Goal 設定 Modal 看到既有 todos
    given:
      - 使用者位於 Pod 卡片
      - 該 Pod 已設定 Goal
      - Goal 內有若干個 todo
    when:
      - 觸發開啟 Goal 設定 Modal 的入口（點右下角設定 / context menu「編輯 Goal」）
    then:
      - 顯示 Goal 設定 Modal
      - 每一個 todo 以一張 Card 的形式列出
      - Card 上顯示 todo 文字的第一行
      - 超出 Card 寬度的文字以 ... 截斷顯示
      - 左側有拖曳把手 icon
      - 右側有刪除按鈕
      - 不再看到上下箭頭按鈕
      - 不再看到 todo 前面的數字編號

  - id: F2
    scenario: 使用者新增一個 todo
    given:
      - 使用者已開啟 Goal 設定 Modal
    when:
      - 點擊「+ 新增」按鈕
      - 在彈出的子 Modal 內填寫 todo 內容
      - 點擊子 Modal 的「存檔」按鈕
    then:
      - 子 Modal 關閉
      - 主 Modal 的 todos 清單末端出現一張新 Card
      - 新 Card 顯示剛輸入內容的第一行
      - 此時尚未送出到後端

  - id: F3
    scenario: 使用者新增 todo 中途取消
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 已點擊「+ 新增」按鈕進入子 Modal
    when:
      - 在子 Modal 內輸入了一些文字
      - 點擊子 Modal 的「取消」按鈕
    then:
      - 子 Modal 關閉
      - 主 Modal 的 todos 清單沒有任何新增的 Card
      - 主 Modal 內既有 todos 維持不變

  - id: F4
    scenario: 使用者編輯既有 todo
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 主 Modal 內已有若干個 todo Card
    when:
      - 點擊其中一張 Card
      - 在彈出的子 Modal 看到該 todo 的完整內容已預先填入 TextArea
      - 修改 TextArea 內容
      - 點擊子 Modal 的「存檔」按鈕
    then:
      - 子 Modal 關閉
      - 該張 Card 的預覽文字更新為新內容的第一行
      - todo 在 todos 清單中的位置不變
      - 此時尚未送出到後端

  - id: F5
    scenario: 使用者編輯既有 todo 但取消
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 已點開一張 Card 的子 Modal 進入編輯
    when:
      - 在 TextArea 內修改了內容
      - 點擊子 Modal 的「取消」按鈕
    then:
      - 子 Modal 關閉
      - 該張 Card 的預覽文字維持原本內容不變
      - 主 Modal 內 todos 清單沒有任何變動

  - id: F6
    scenario: 使用者拖曳重新排序 todos
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 主 Modal 內有多張 todo Card
    when:
      - 在某張 Card 的左側拖曳把手上按住
      - 拖動到另一個位置
      - 釋放
    then:
      - 該張 Card 在新位置出現
      - 其他 Card 順勢讓出原本位置
      - 拖曳期間有清楚的視覺回饋
      - 此時尚未送出到後端

  - id: F7
    scenario: 使用者刪除 todo
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 主 Modal 內有至少一張 todo Card
    when:
      - 點擊某張 Card 右側的刪除按鈕
    then:
      - 該張 Card 從清單中消失
      - 其餘 todo Card 順位填補空缺
      - 不需要先點開子 Modal
      - 此時尚未送出到後端

  - id: F8
    scenario: 使用者在 todos 過多時瀏覽清單
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 主 Modal 內 todo Card 數量超過畫面可容納
    when:
      - 在 todos 清單區塊內滾動
    then:
      - todos 清單區塊內部可上下滾動
      - Modal 本身的高度維持固定
      - Modal 的 Header 維持可見
      - 「+ 新增」按鈕維持可見
      - Modal 的 Cancel / Save Footer 維持可見

  - id: F9
    scenario: 使用者儲存 Goal 設定
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 已完成新增 / 編輯 / 排序 / 刪除等暫存操作
    when:
      - 點擊主 Modal 的「Save」按鈕
    then:
      - Goal 變更送出到後端
      - 主 Modal 關閉
      - Pod 上的 Goal 顯示更新為新的內容與順序

  - id: F10
    scenario: 使用者清空整個 Goal
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 該 Pod 已有 Goal 與 todos
    when:
      - 逐一點擊每張 Card 右側的刪除按鈕直到清單為空
      - 點擊主 Modal 的「Save」按鈕
    then:
      - 後端 Goal 被清空
      - Pod 回到未設定 Goal 的狀態
      - 主 Modal 關閉
      - 看不到「清空 Goal」這個獨立按鈕

  - id: F11
    scenario: 使用者放棄主 Modal 編輯
    given:
      - 使用者已開啟 Goal 設定 Modal
      - 已完成一些新增 / 編輯 / 排序 / 刪除等暫存操作
    when:
      - 點擊主 Modal 的「Cancel」按鈕或關閉 Modal
    then:
      - 主 Modal 關閉
      - 後端 Goal 維持原樣
      - 暫存的所有變更全部丟棄
