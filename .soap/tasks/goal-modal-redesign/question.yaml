feature: goal-modal-redesign
created: "2026-05-17"
approved: true

questions:
  - id: Q1
    text: 目前 GoalEditorModal 內 Todo 清單區塊是否已有 scroll / max-height 限制？若無，Modal 在大量 Todo 時的版面行為是什麼？
    type: codebase-investigation
    completed: true
    answer: |
      目前**完全沒有 scroll / max-height 處理**。
      - `GoalEditorModal.vue` 的 `DialogContent` 只設 `max-w-2xl`，沒有 `max-h-` 或 `overflow` 樣式
      - 包住 todos 的 `<div class="space-y-3">`（L73）也沒有任何高度限制
      - 共用 `DialogContent.vue` 預設樣式使用 `top-1/2 -translate-y-1/2` 垂直置中，無內建 max-height 或 overflow
      - 後果：todos 過多時 Modal 會直接撐高超出 viewport，底部 footer（Cancel / Save 按鈕）可能被推到視窗外導致無法操作
      需要新增 max-height + overflow-y:auto 機制。

  - id: Q2
    text: 前端是否已安裝任何可用於拖曳排序的套件（vuedraggable、vue-draggable-plus、sortablejs、@dnd-kit、@vueuse/integrations 之 useSortable 等）？
    type: codebase-investigation
    completed: true
    answer: |
      **完全沒有安裝任何拖曳排序套件**。`frontend/package.json` dependencies 確認：
      - 無 vuedraggable / vue-draggable-plus / sortablejs / @dnd-kit
      - 有 `@vueuse/core` 14.1.0，但 `useSortable` 屬於 `@vueuse/integrations`（需搭配 sortablejs，未安裝）
      - 有 `reka-ui` 2.7.0 / `radix-vue` 1.9.17，皆無拖曳 primitive
      需要新增一個拖曳套件。候選與考量：
      - **vue-draggable-plus**：Vue3 友善 wrapper，主動維護中，API 簡潔
      - **vuedraggable@next**：Vue3 版本，相對成熟，底層仍是 sortablejs
      - **手刻 HTML5 drag-and-drop**：無依賴但要自己處理 cross-browser、touch、accessibility，工作量大
      建議選 `vue-draggable-plus`（或維持 `vuedraggable@next`），實際選哪個交由使用者決定。

  - id: Q3
    text: 後端的 Goal API（pod:set-goal）是否需要任何改動以支援新的排序方式？目前 todos 的順序是由 array index 還是獨立 order 欄位決定？
    type: codebase-investigation
    completed: true
    answer: |
      **後端完全不需要改動**。
      - 後端型別 `PodGoal = { todos: GoalTodoItem[] }`、`GoalTodoItem = { id: string, text: string }`，**無 order 欄位**
      - 順序純粹由 `todos` array index 決定
      - 儲存：SQLite `pods` 表的 `goal_json` 欄位（JSON 字串）
      - WebSocket: `pod:set-goal` request 接收完整 goal payload，後端整包覆寫
      前端只要在拖曳結束後把重新排序的 array 透過 `setGoalWithBackend` 送出即可，協定完全相容。

  - id: Q4
    text: 目前 i18n 中要移除的 keys（pod.goal.editor.description、moveUp、moveDown、clearGoal）是否還有其他元件 / 檔案在使用？刪除是否安全？
    type: codebase-investigation
    completed: true
    answer: |
      **全部只在 `GoalEditorModal.vue` 一個檔案使用，刪除安全**：
      - `pod.goal.editor.description` → 僅 GoalEditorModal.vue:69
      - `pod.goal.editor.moveUp` → 僅 GoalEditorModal.vue:93
      - `pod.goal.editor.moveDown` → 僅 GoalEditorModal.vue:102
      - `pod.goal.editor.clearGoal` → 僅 GoalEditorModal.vue:144
      i18n 檔案位置：`frontend/src/locales/zh-TW.json`（推測也含英文 / 日文版，需一併清理）。

  - id: Q5
    text: 目前 GoalEditorModal 的測試（unit / e2e / playwright）有哪些？data-testid 有哪些會因這次重構失效（goal-editor-clear、goal-editor-input 等）？
    type: codebase-investigation
    completed: true
    answer: |
      **單元測試檔**：`frontend/tests/components/pod/GoalEditorModal.test.ts`，共 4 個 test case：
      1. 「可新增多條 todo 並儲存到 Pod goal」— 使用 goal-editor-input / add / save，**保留可用**
      2. 「完全空白時儲存應 emit submit(null)」— 使用 save / validation，**保留可用**
      3. 「存在空白 row 時儲存應顯示驗證且不 emit submit」— 使用 input / add / save / validation，**保留可用**
      4. 「可清空既有 Goal」— 使用 `goal-editor-clear`，**整個 test case 隨清空按鈕一起移除**
      無發現額外的 playwright / e2e 測試針對此 Modal。`PodContextMenu.test.ts` 只測 emit `open-goal-editor`，與本次重構無關。
      其他 testid（goal-editor-input / add / save / validation）會在新版繼續保留，現有 3 個 test case 可不修改通過。
      重構新增的拖曳行為**可選擇**加上對應測試（例如：mock 拖曳事件 → 驗證 emit submit 的 todos 順序），由規劃階段決定範圍。

  - id: Q6
    text: 拖曳的觸發位置希望是哪一種？(A) 整個 row 都可拖曳；(B) 在 row 左側放一個專屬 drag handle icon（如 ≡ / GripVertical），只能從 handle 拖；(C) 其他偏好
    type: user-input
    completed: true
    answer: row 左側專屬 drag handle icon（GripVertical / ≡），使用者必須從 icon 上按住才能拖曳，input 區仍可正常選字。

  - id: Q7
    text: 移除上下箭頭與編號後，是否仍要保留某種「鍵盤可操作」的排序替代方案（例如 focus 在 row 上時用 Cmd/Alt + ↑/↓ 移動）？還是純拖曳即可？
    type: user-input
    completed: true
    answer: 純拖曳即可，本次不額外做鍵盤排序替代方案。

  - id: Q8
    text: Todo 數量過多時 scroll 的範圍偏好？(A) 只讓 todos 清單區塊內部 scroll，Modal 本體高度固定；(B) 整個 Modal body scroll；(C) 其他偏好。若 (A) 希望 todos 區塊的 max-height 用哪種基準（固定 px / viewport 比例）？
    type: user-input
    completed: true
    answer: 只 scroll todos 清單區塊，Modal 本體高度固定；max-height 採 viewport 比例（例：60vh）讓不同螢幕都能適配；Header / Add 按鈕 / Footer 永遠可見。

  - id: Q9
    text: 拖曳進行中的視覺回饋有偏好嗎？(A) 被拖曳列降低透明度 + 出現 drop indicator 線；(B) 被拖曳列保持原樣 + 其他列即時讓位；(C) 不講究，交給實作者選一個跟現有 doodle / sand 風格一致的方案
    type: user-input
    completed: true
    answer: 交給實作者，挑一個符合現有 doodle / sand 配色（--doodle-ink / --doodle-sand）的一致方案。

  - id: Q10
    text: 「不需要清空 Goal 按鈕」是指完全移除這個動作（使用者無法再透過 Modal 一鍵清掉整個 Goal），還是另有其他入口可達成同樣效果？若是前者，使用者要清空 Goal 時改走哪條路徑（例：把 todos 全刪 + Save，或在其他地方有刪除 Pod Goal 入口）？
    type: user-input
    completed: true
    answer: 完全移除「清空 Goal」按鈕。使用者想清空 Goal 時，逐條刪除 todos 至全空再 Save 即可（buildSubmitGoal 既有邏輯會 emit submit(null)）。

  - id: Q11
    text: 是否需要為新的拖曳排序新增 unit test？(A) 必要，覆蓋拖曳後 emit 的 todos 順序正確；(B) 不需要，純 UI 互動由手動驗收即可；(C) 新增但僅最小煙霧測試
    type: user-input
    completed: true
    answer: 不需要，純 UI 互動由手動驗收即可。現有 4 個 test case 中第 4 個（goal-editor-clear）刪除，其餘 3 個保留。

  - id: Q12
    text: 拖曳套件選擇？vue-draggable-plus / vuedraggable@next / 手刻 HTML5 drag-and-drop
    type: user-input
    completed: true
    answer: vue-draggable-plus（推薦）。Vue3 友善、主動維護、API 簡潔，支援 touch + mouse。

  - id: Q13
    text: 想把 todo 撰寫方式改成哪種互動？（單行 input / 自動增高 textarea / Card + 子 Modal / 一個大 textarea）
    type: user-input
    completed: true
    answer: |
      每個 todo 在主 Modal 中是一張 Card（不再是 input），點 Card 會打開**另一個**子 Modal，子 Modal 內含 TextArea 可填寫完整內容。Card 在主 Modal 上只顯示精簡預覽（不再是可編輯 input）。

  - id: Q14
    text: TextArea 內容如何在 Card 上顯示？
    type: user-input
    completed: true
    answer: 取第一行內容，超出 Card 寬度時用 ... 截斷（CSS：text-overflow:ellipsis + white-space:nowrap）。多行文字只看得到第一行的省略形式。

  - id: Q15
    text: 「+ 新增 todo」按鈕按下去的行為？
    type: user-input
    completed: true
    answer: |
      直接開子 Modal（以空 TextArea 進入編輯模式），不立刻在主 Modal 增加 Card。使用者在子 Modal「存檔」後才把新 todo 加進主 Modal 的 todos 清單；「取消」則不建立任何 Card。使用者不會看到空 Card。

  - id: Q16
    text: 子 Modal 的存檔模式？
    type: user-input
    completed: true
    answer: |
      子 Modal 有「存檔 / 取消」按鈕。
      - 「存檔」= 把 TextArea 內容寫進主 Modal 的 todos array（新增情境就 push 一筆，編輯情境就 update 對應 todo 的 text）。**不直接打後端 API**。
      - 「取消」= 丟棄子 Modal 內的編輯、關閉、主 Modal 的 todos 不變。
      - 真正送 pod:set-goal 到後端，仍只在使用者按主 Modal 的「Save」時才發生。
      三段式：子 Modal 編輯 → 暫存於主 Modal → 主 Modal Save 才送後端。

  - id: Q17
    text: Card 上的刪除按鈕位置？
    type: user-input
    completed: true
    answer: |
      刪除按鈕保留在 Card 右側，主 Modal 中可直接點刪除一張 Card（不需要先點開子 Modal）。
      Card 版面：[≡ drag handle] [預覽文字（單行 + ...）] [🗑 delete]。
