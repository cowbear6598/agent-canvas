feature: remove-direct-connection-merge
side: frontend
approved: true
phases:
  - id: P1
    title: 移除 Direct waiting 前端事件處理
    parallel: false
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P1.A
        title: WebSocket event map 與型別
        tasks:
          - id: P1.A.t1
            text: 從 `frontend/src/types/websocket/events.ts` 移除 `WORKFLOW_DIRECT_WAITING`，讓前端事件常數不再暴露 Direct 等待事件
            completed: true
            last_files_changed:
              - frontend/src/types/websocket/events.ts
          - id: P1.A.t2
            text: 從 `frontend/src/types/websocket/responses.ts` 移除 `WorkflowDirectWaitingPayload`，讓 response payload 型別與後端 Direct 不等待契約一致
            completed: true
            last_files_changed:
              - frontend/src/types/websocket/responses.ts
          - id: P1.A.t3
            text: 調整 `frontend/src/stores/workflowEventHandlers.ts`，移除 `handleWorkflowDirectWaiting` 與相關型別 import，保留 Direct triggered 將單條 connection 設為 active 的行為
            completed: true
            last_files_changed:
              - frontend/src/stores/workflowEventHandlers.ts
          - id: P1.A.t4
            text: 調整 `frontend/src/stores/connectionStore.ts` 的 workflow event map，取消訂閱 `workflow:direct-waiting`，確認 cleanup 使用同一份 event map 仍可移除所有剩餘 listener
            completed: true
            last_files_changed:
              - frontend/src/stores/connectionStore.ts

      - id: P1.B
        title: 前端測試對齊
        tasks:
          - id: P1.B.t1
            text: 更新 `frontend/tests/business-logic/stores/connectionStore.test.ts`，移除 `handleWorkflowDirectWaiting` 會把 connection 設為 waiting 的測試與 payload import
            completed: true
            last_files_changed:
              - frontend/tests/business-logic/stores/connectionStore.test.ts
          - id: P1.B.t2
            text: 檢查 `frontend/tests/business-logic/stores/connectionStore.test.ts` 中剩餘的 `waiting` 狀態測試，只移除 Direct waiting event 專用案例，保留 queue、graph 或 run 狀態仍需要的 waiting coverage
            completed: true
            last_files_changed: []

  - id: P2
    title: 使用者文件與樣式註解對齊
    parallel: false
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P2.A
        title: Connection Line 規則文件
        tasks:
          - id: P2.A.t1
            text: 更新 `README.md` 的多條觸發規則，把 Direct + Direct 描述改為每條 Direct 完成後各自觸發，不再提到 10 秒等待或 Direct 合併總結
            completed: true
            last_files_changed:
              - README.md
              - frontend/MAINTAINABILITY_AUDIT.md
          - id: P2.A.t2
            text: 更新 `README.en.md` 的 Multi-Connection Trigger Rules，把 Direct + Direct 與 Auto + Auto + Direct + Direct 描述改為 Direct lines each trigger independently while Auto/AI lines keep their existing group behavior
            completed: true
            last_files_changed:
              - README.en.md

      - id: P2.B
        title: 樣式註解清理
        tasks:
          - id: P2.B.t1
            text: 更新 `frontend/src/assets/styles/doodle/connections.css` 中 waiting 狀態註解，移除 multi-direct 10 秒等待說法，改成通用 waiting status 樣式說明
            completed: true
            last_files_changed:
              - frontend/src/assets/styles/doodle/connections.css
