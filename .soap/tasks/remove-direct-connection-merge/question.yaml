feature: remove-direct-connection-merge
created: "2026-05-25"
approved: true
questions:
  - id: Q1
    text: 現有 direct connection 是否仍有 10 秒 merge 等待邏輯？
    type: codebase-investigation
    completed: true
    answer: |
      主要 runtime 已沒有 10 秒 merge 等待。`backend/src/services/workflow/workflowDirectTriggerService.ts`
      的 `collectSources()` 會立即回傳 ready，且 `participatingConnectionIds`
      只包含目前 connection；`cancelPendingResolver()` 目前是相容用 no-op。
      `backend/tests/business-logic/workflowDirectTriggerFlow.test.ts` 已有測試覆蓋
      多條 Direct 各自形成獨立項目，不會發送 direct waiting / merged 事件。
  - id: Q2
    text: 哪些地方仍保留 direct merge / 10 秒等待的殘留概念？
    type: codebase-investigation
    completed: true
    answer: |
      殘留集中在文件、事件定義與命名。`README.md` 與 `README.en.md`
      仍描述 Direct + Direct 會等待 10 秒後合併；`frontend/src/assets/styles/doodle/connections.css`
      的 waiting 註解仍寫 multi-direct 10 秒等待；`backend/src/schemas/events.ts`、
      `backend/src/services/workflow/workflowEventEmitter.ts`、`frontend/src/types/websocket/events.ts`
      與 `frontend/src/stores/connectionStore.ts` 仍保留 direct waiting / countdown /
      merged 事件與監聽。`workflowStateService.getDirectConnectionCount()` 的測試名稱也仍寫
      direct merge decisions。
  - id: Q3
    text: 移除後 Direct + Direct 與 Auto + Auto + Direct + Direct 的預期行為是什麼？
    type: codebase-investigation
    completed: true
    answer: |
      Direct + Direct 應不再等待彼此，也不再合併成單一 Direct group；
      每條 Direct connection 依自身來源完成時各自摘要、各自觸發 target。
      若同一 target 忙碌，既有 per-run target queue 會負責排隊。Auto / Branch
      multi-input 仍維持同一 auto-triggerable group 的等待與合併，不受 Direct 變更影響。
      Auto + Auto + Direct + Direct 因此只剩 Auto/Branch group 會等待合併；
      Direct 兩條各自作為獨立 group/項目進入觸發或 queue。
