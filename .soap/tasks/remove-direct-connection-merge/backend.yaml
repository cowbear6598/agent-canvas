feature: remove-direct-connection-merge
side: backend
approved: true
phases:
  - id: P1
    title: 移除 Direct merge 後端契約殘留
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P1.A
        title: WebSocket 事件與 payload 清理
        tasks:
          - id: P1.A.t1
            text: 從 `backend/src/schemas/events.ts` 移除 `WORKFLOW_DIRECT_WAITING`、`WORKFLOW_DIRECT_COUNTDOWN`、`WORKFLOW_DIRECT_MERGED` 三個 Direct merge 專用 response event，保留 `WORKFLOW_DIRECT_TRIGGERED` 與通用 queue event
            completed: true
            last_files_changed:
              - backend/src/schemas/events.ts
          - id: P1.A.t2
            text: 從 `backend/src/types/responses/workflow.ts` 移除 `WorkflowDirectWaitingPayload` 與 `WorkflowDirectMergedPayload`，讓後端型別契約不再暴露 Direct 等待或合併 payload
            completed: true
            last_files_changed:
              - backend/src/types/responses/workflow.ts
          - id: P1.A.t3
            text: 調整 `backend/src/services/workflow/workflowEventEmitter.ts`，刪除 `emitDirectWaiting`、`emitDirectCountdown`、`emitDirectMerged` 與對應 import，確認只留下 Direct 立即觸發、complete、queued、queue processed 事件
            completed: true
            last_files_changed:
              - backend/src/services/workflow/workflowEventEmitter.ts

      - id: P1.B
        title: Direct resolver 與計數 helper 清理
        tasks:
          - id: P1.B.t1
            text: 從 `backend/src/services/workflow/workflowDirectTriggerService.ts` 移除相容用的 `cancelPendingResolver()` no-op，保留 `collectSources()` 每條 Direct 立即 ready 且只回傳目前 connection 的行為
            completed: true
            last_files_changed:
              - backend/src/services/workflow/workflowDirectTriggerService.ts
              - backend/tests/business-logic/workflowDirectTriggerFlow.test.ts
          - id: P1.B.t2
            text: 調整 `backend/src/services/workflow/workflowStateService.ts` 的 Direct connection deletion 路徑，移除 direct resolver 取消呼叫，讓 Direct 刪除不再宣稱存在 pending resolver
            completed: true
            last_files_changed:
              - backend/src/services/workflow/workflowStateService.ts
              - backend/tests/business-logic/workflowStateService.test.ts
          - id: P1.B.t3
            text: 刪除 `workflowStateService.getDirectConnectionCount()` 與對應測試，因為 Direct 不再有 merge decision 需要計算同 target 的 Direct 來源數
            completed: true
            last_files_changed:
              - backend/src/services/workflow/workflowStateService.ts
              - backend/tests/business-logic/workflowStateService.test.ts

  - id: P2
    title: 後端測試對齊 Direct 各自觸發
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P2.A
        title: Direct trigger flow 測試
        tasks:
          - id: P2.A.t1
            text: 更新 `backend/tests/business-logic/workflowDirectTriggerFlow.test.ts`，移除 direct waiting / merged emitter spy 與斷言，保留多條 Direct 各自 `ready: true` 且 `participatingConnectionIds` 只包含自身 connection 的 business-logic 測試
            completed: true
            last_files_changed:
              - backend/tests/business-logic/workflowDirectTriggerFlow.test.ts
          - id: P2.A.t2
            text: 移除 `workflowDirectTriggerService.cancelPendingResolver()` 相關測試，改以 Direct deletion 不觸碰 auto multi-input pending state 的測試覆蓋 Direct 不使用等待 resolver 的行為
            completed: true
            last_files_changed:
              - backend/tests/business-logic/workflowDirectTriggerFlow.test.ts

      - id: P2.B
        title: Workflow state 測試命名與期待
        tasks:
          - id: P2.B.t1
            text: 更新 `backend/tests/business-logic/workflowStateService.test.ts`，刪除 direct merge decision count 測試區塊，並把 Direct deletion 測試改成不呼叫 resolver、不更新 pendingTargetStore
            completed: true
            last_files_changed:
              - backend/tests/business-logic/workflowStateService.test.ts
          - id: P2.B.t2
            text: 檢查並更新 `backend/tests/business-logic/workflowMultiInputService.test.ts` 或既有 multi-input 測試名稱，確認 Auto/Branch 多來源仍以同一組等待與合併，不受 Direct 事件清理影響
            completed: true
            last_files_changed: []
          - id: P2.B.t3
            text: 檢查 backend 測試清單或 inventory 中與 Direct merge store / pending resolver 有關的描述，將殘留用語改為 Direct 各自觸發或移除過時項目
            completed: true
            last_files_changed: []
