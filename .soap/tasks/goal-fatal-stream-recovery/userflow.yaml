feature: goal-fatal-stream-recovery
approved: true
scenarios:
  - id: F1
    scenario: 使用者執行帶有多個 goal 項目的 Pod
    given:
      - 使用者已為 Pod 設定多個 goal 項目
      - 使用者送出一則會啟動 run 的訊息
      - 系統已開始執行第一個 goal 項目
    when:
      - 執行過程中發生可恢復的 provider 串流中斷
    then:
      - 系統會保留目前 goal 進度
      - 系統會自動續跑尚未完成的 goal 項目
      - 系統不會把整個 run 誤判為已完成

  - id: F2
    scenario: 使用者查看可恢復錯誤後的執行結果
    given:
      - 使用者的 Pod 在執行途中發生 provider 錯誤
      - 該錯誤屬於系統可自動補救的情境
    when:
      - 使用者等待 run 繼續執行
    then:
      - 已完成的 goal 項目維持完成
      - 尚未完成的 goal 項目會接續執行
      - 對話紀錄不會只停在中途錯誤訊息

  - id: F3
    scenario: 使用者遇到無法恢復的 provider 錯誤
    given:
      - 使用者已為 Pod 設定多個 goal 項目
      - 系統無法自動恢復目前的 provider 錯誤
    when:
      - 本輪執行停止
    then:
      - 系統不會把剩餘的 goal 項目當成已完成
      - 系統會保留可追蹤的未完成狀態
      - 使用者可以明確看出這次 run 沒有完整完成所有 goal 項目
