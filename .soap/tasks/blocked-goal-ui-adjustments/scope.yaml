feature: blocked-goal-ui-adjustments
created: "2026-06-04"
approved: true
frontend:
  required: true
  reason: 需求直接要求調整 Chat Modal 的 blocked 卡片外觀與文字顯示，並讓 Pod 清單顯示獨立 blocked 圖示。
  evidence:
    - userflow.yaml F1 描述使用者需要在 Chat Modal 直接看見偏方形 blocked 卡片與完整原因內容。
    - userflow.yaml F2 描述使用者需要在 Pod 清單直接辨識 blocked 與一般 error 的差異。
    - question.yaml Q1 確認 blocked 卡片目前由 `frontend/src/components/chat/GoalRoundDivider.vue` 控制，且前端主動做了裁切與單行截斷。
    - question.yaml Q2 確認 Pod 清單圖示目前由 `frontend/src/components/run/RunStatusIcon.vue` 控制。
backend:
  required: true
  reason: 目前 blocked goal 會在後端流程中轉成 pod instance 的 error 狀態，若不調整資料流，前端無法穩定取得獨立 blocked 狀態來顯示專屬圖示。
  evidence:
    - question.yaml Q2 確認 `backend/src/services/claude/streamingChatExecutor.ts` 遇到 goal blocked 時會走 `callbacks.onError(...)`。
    - question.yaml Q2 確認 `backend/src/utils/runChatHelpers.ts` 與 `backend/src/services/workflow/runExecutionService.ts` 最終把 pod instance 狀態寫成 `error` 並推送 `RUN_POD_STATUS_CHANGED`。
