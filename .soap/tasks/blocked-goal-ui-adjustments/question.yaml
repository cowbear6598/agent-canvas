feature: blocked-goal-ui-adjustments
created: "2026-06-03"
approved: true
impact_classification:
  frontend:
    status: required
    evidence:
      - 需求明確要求調整 Chat Modal 內 blocked 狀態框的外觀與文字顯示方式。
      - 需求明確要求調整 Pod 清單中 blocked 狀態的圖示表現。
  backend:
    status: required
    evidence:
      - codebase 顯示 blocked goal 目前在後端流程中會透過 onError 路徑轉成 pod instance 的 error 狀態，前端無法直接辨識為獨立 blocked 狀態。
      - 若要讓 Pod 清單用獨立 blocked icon 呈現語意，而不是以錯誤訊息字串做脆弱判斷，需要後端提供獨立 blocked 訊號或狀態。
questions:
  - id: Q1
    text: Chat Modal 內顯示 blocked goal 狀態卡片的元件與樣式邏輯位於哪些檔案，現行為何會出現截斷？
    type: codebase-investigation
    completed: true
    answer: |
      顯示 blocked goal 狀態卡片的元件在 `frontend/src/components/chat/GoalRoundDivider.vue`。
      現行外觀在 template 內使用 `rounded-full`，所以會渲染成膠囊狀而非偏方形卡片。
      blocked 原因被截斷有兩層原因：
      1. script 內 `blockedReasonSummary` 會先把文字壓成單行，超過 96 字就手動裁切並加上 `...`
      2. template 額外套了 Tailwind `truncate`，即使保留完整字串也只會顯示單行省略
      因此要完整顯示原因，需要同時移除字數裁切與單行截斷樣式。
  - id: Q2
    text: Pod 清單中的狀態 icon 映射邏輯位於哪些檔案，blocked goal 目前為何共用 error icon？
    type: codebase-investigation
    completed: true
    answer: |
      Pod 清單項目元件在 `frontend/src/components/run/RunPodInstanceItem.vue`，它把 `instance.status`
      傳給 `frontend/src/components/run/RunStatusIcon.vue`。
      `RunStatusIcon.vue` 目前只處理 `completed / running / pending / error / skipped / summarizing / deciding / queued / waiting`，
      沒有 `blocked` case；前端型別 `frontend/src/types/run.ts` 的 `RunPodStatus` 也沒有 `blocked`。
      更上游的原因在後端：`backend/src/services/claude/streamingChatExecutor.ts` 遇到 goal blocked 時，
      會呼叫 `callbacks.onError(createGoalBlockedStopWorkflowError(...))`；
      `backend/src/utils/runChatHelpers.ts` 的 onError 會再走 `runExecutionService.errorPodInstance(...)`，
      最終把 pod instance 狀態寫成 `error` 並推送 `RUN_POD_STATUS_CHANGED`。
      所以前端目前收到的不是 blocked，而是 error，自然會共用 `XCircle` 錯誤 icon。
