feature: remove-migrations
created: "2026-05-22"
approved: true

questions:
  - id: Q1
    text: schema.ts 內 createTables 呼叫的所有 migrate 函式具體有哪些？各自負責什麼 schema 變更？
    type: codebase-investigation
    completed: true
    answer: |
      `createTables` (schema.ts:655) 依序呼叫 17 個函式：第 1 個 `createBaseTables` (line 13) 為純 DDL，其餘 16 個為 migration：
        1. migratePodPluginIdsTruncate (line 319) — data-fix：首次升級時清空 pod_plugin_ids 表
        2. migrateCanvasPasswordColumns (line 333) — schema-change：新增 canvases.password_hash / password_version
        3. migratePodsGoalColumn (line 349) — schema-change：新增 pods.goal_json
        4. migratePodsGeminiProviderToClaude (line 355) — data-fix：pods.provider 'gemini' → 'claude'
        5. migrateConnectionsGeminiSummaryToClaude (line 369) — data-fix：connections summary gemini → claude
        6. migratePodsDropCommandColumn (line 392) — schema-change：DROP pods.command_id
        7. migrateDeleteCommandNotes (line 420) — data-fix：DELETE notes WHERE type='command'
        8. migratePodManifestCommandFiles (line 428) — data-fix：過濾 pod_manifests 移除 .claude/commands/ 路徑
        9. migrateConnectionBranchColumns (line 476) — schema-change：新增 connections.label/description/branch_provider/branch_model
        10. cleanupLegacyAiDecideRows (line 500) — data-fix：DELETE connections WHERE trigger_mode='ai-decide'
        11. migrateConnectionStatusAiValues (line 515) — data-fix：UPDATE connections status ai-* → idle
        12. migrateRunPodInstancesRunRepoPathColumn (line 566) — schema-change：RENAME run_pod_instances.worktree_path → run_repo_path
        13. migrateRepositoryMetadataDropWorktreeColumns (line 535) — schema-change：DROP repository_metadata.parent_repo_id / branch_name
        14. migratePodsDropMultiInstance (line 585) — schema-change：DROP pods.multi_instance
        15. migrateDropMessagesTable (line 599) — schema-change：DROP messages 表與索引
        16. migratePodsDropStatus (line 608) — schema-change：DROP pods.status
        17. migrateManagedPluginsSortIndex (line 619) — mixed：新增 managed_plugins.sort_index + 索引，依安裝時間賦值排序

  - id: Q2
    text: createBaseTables 內的 CREATE TABLE IF NOT EXISTS 是否已涵蓋所有 migrate 後的最終 schema（新環境從零建 DB 不需依賴 ALTER TABLE 補欄位 / 也不會多出已被 drop 的欄位）？
    type: codebase-investigation
    completed: true
    answer: |
      全部已收斂。已比對 16 個 migrate 函式與 createBaseTables：
        - 所有 ALTER TABLE ADD COLUMN 新增的欄位（password_hash / password_version / goal_json / label / description / branch_provider / branch_model / sort_index）均已在 createBaseTables 的對應 CREATE TABLE 內列出
        - 所有 DROP 操作對應的欄位（command_id / multi_instance / status / parent_repo_id / branch_name）及表（messages）均不在 createBaseTables 內
        - RENAME（worktree_path → run_repo_path）對應 createBaseTables line 224 直接以最終名 run_repo_path 定義
        - 所有 CREATE INDEX IF NOT EXISTS 已在 createBaseTables 內定義
      結論：新 DB 從零建立 → 跳過所有 migrate 函式直接走 createBaseTables 即可得到正確最終形態，無遺留 / 缺漏。

  - id: Q3
    text: backend/tests 下哪些測試檔直接或間接依賴 migrate 函式？schema-migration.test.ts 測試的具體目標為何？
    type: codebase-investigation
    completed: true
    answer: |
      共三份測試檔涉及：
        1. `backend/tests/business-logic/schema-migration.test.ts` — 直接針對 migrate 函式
           - migratePodsDropMultiInstance（3 個 it）
           - migratePodsGoalColumn（1 個 it）
           - replace-command-with-goal Phase 1 migration：清空舊 command 綁定、遷移 gemini/summary 設定到 Claude Sonnet（1 個 it）
           - migrateDropMessagesTable（3 個 it）
           - 完整舊 schema 場景（1 個 it）
           測試策略：以 in-memory DB 建立舊 schema → 呼叫 createTables → 驗證欄位 / 表已遷移到新形態
        2. `backend/tests/database/schema.test.ts` — 不直接測 migrate，測 createTables 最終結果
           - 初始化（4 個 it：表、journal_mode、外鍵、索引）
           - resetDb（1 個 it）
           - CASCADE 刪除（2 個 it）
           - Prepared Statements CRUD（6 個 it）
        3. `backend/tests/business-logic/dbStartupCleanup.test.ts` — 直接 import `cleanupLegacyAiDecideRows`
           - 測試刪除 trigger_mode = 'ai-decide' 的舊版 connection（5 個 it）

  - id: Q4
    text: schema.ts 內除了 createTables 入口外，是否還有其他模組（route / service / statements）import 任何 migrate 函式或 tableExists 等內部 helper？
    type: codebase-investigation
    completed: true
    answer: |
      沒有。production 端唯一引用點：
        - backend/src/database/index.ts:22（getDb() 內呼叫 createTables）
        - backend/src/database/index.ts:73（initTestDb() 內呼叫 createTables）
      測試端唯一額外引用點：
        - backend/tests/business-logic/dbStartupCleanup.test.ts 直接 import `cleanupLegacyAiDecideRows`（其餘測試僅 import createTables）
      沒有 route / service / WebSocket handler / script 直接呼叫 migrate 函式或 tableExists、也沒有 production 程式碼自己跑 ALTER TABLE。

  - id: Q5
    text: 砍 migration 的前提是「所有現存 DB 都已執行過完整 migration」。請確認此前提成立——也就是已不需要支援「升級舊 DB」這條路徑（包含本機開發環境、自己使用、釋出版本的使用者環境）。
    type: user-input
    completed: true
    answer: |
      確認，可砍。所有現存 DB 都已完成 migration，新版本不再支援自動升級舊 DB 路徑；新環境直接走 createBaseTables 即可。

  - id: Q6
    text: 16 個 migrate 函式是「全部一次砍光」還是有保留條件？例如 cleanupLegacyAiDecideRows 這類「資料清理」是否要視為一次性 migration 一併移除，還是要保留為常駐資料清理？
    type: user-input
    completed: true
    answer: |
      全部 16 個一起砍（含 schema-change 與 data-fix 兩類，例如 cleanupLegacyAiDecideRows、migratePodsGeminiProviderToClaude、migrateDeleteCommandNotes 等 data-fix 也一併移除）。createTables 之後只保留 createBaseTables 一次呼叫。

  - id: Q7
    text: 既有的 schema-migration.test.ts、schema.test.ts、dbStartupCleanup.test.ts 的處理方式？
    type: user-input
    completed: true
    answer: |
      三份合理刪改：
        - schema-migration.test.ts → 完全刪除（整檔測 migrate 函式行為，已無對象）
        - dbStartupCleanup.test.ts → 完全刪除（測 cleanupLegacyAiDecideRows，函式被砍後失效）
        - schema.test.ts → 保留並調整：移除任何引用已被砍 migrate 函式的測試案例；保留「初始化 / resetDb / CASCADE / prepared statements」這些非 migration 性質的測試。

  - id: Q8
    text: 這項改動是否需要在 CHANGELOG 註記為破壞性變更？（舊 DB 直接升新版會缺欄位 / 多舊欄位，無法自動修復。）
    type: user-input
    completed: true
    answer: |
      不註記。視為內部清理，不寫入 CHANGELOG。
