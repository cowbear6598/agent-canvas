feature: replace-command-with-goal-and-remove-gemini
approved: true
scenarios:
  - id: F1
    scenario: 使用者為 Pod 建立 Goal
    given:
      - 使用者在畫布上看到一個 Pod
      - 該 Pod 尚未設定 Goal
    when:
      - 打開 Goal editor
      - 新增多條待完成項目
      - 儲存設定
    then:
      - Pod 顯示已設定 Goal
      - Goal 內容會保留在該 Pod 上
      - 使用者之後可以再次打開編輯

  - id: F2
    scenario: 使用者嘗試執行沒有 Goal 的 Pod
    given:
      - 使用者在畫布上看到一個 Pod
      - 該 Pod 尚未設定 Goal
    when:
      - 觸發該 Pod 執行
    then:
      - 系統阻止執行
      - 提示使用者先設定 Goal

  - id: F3
    scenario: 使用者執行已設定 Goal 的 Pod
    given:
      - 該 Pod 已設定多條 Goal 項目
      - 該 Pod 已啟用需要的工具
    when:
      - 觸發該 Pod 執行
    then:
      - 系統會依序完成整份 Goal
      - 同一次執行不需要使用者手動重複觸發
      - 該 Pod 已啟用的工具仍可使用

  - id: F4
    scenario: 工作流把結果交給下一個 Pod
    given:
      - 上游 Pod 已完成執行
      - 下游 Pod 已設定 Goal
      - 兩個 Pod 之間有連線
    when:
      - 工作流把上游結果傳給下游 Pod
    then:
      - 傳遞內容會聚焦在下游 Goal 需要的資訊
      - 下游 Pod 可以接著執行自己的 Goal

  - id: F5
    scenario: 使用者在升級後重新打開舊畫布
    given:
      - 使用者有一個既有畫布
      - 畫布內有曾使用 Command 的 Pod
      - 畫布內有曾使用 Gemini 的 Pod 或摘要設定
    when:
      - 使用者在升級後重新打開畫布
    then:
      - 舊的 Command 設定不再保留
      - 原本使用 Gemini 的設定會改成 Claude Sonnet
      - 沒有 Goal 的 Pod 在重新執行前需要先補設定
