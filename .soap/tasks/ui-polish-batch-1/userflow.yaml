feature: ui-polish-batch-1
approved: true
scenarios:
  - id: F1
    scenario: 使用者開啟整合管理 hub modal
    given:
      - 使用者在主畫面
      - header 上原本的 MCP / Plugin / LLM Provider 三顆獨立 icon 已被收掉
    when:
      - 點 header 上的 Boxes icon
    then:
      - 中央彈出一個 hub modal
      - hub modal 內列出三張卡片（MCP 管理 / Plugin 管理 / LLM Provider）

  - id: F2
    scenario: 使用者從 hub modal 進入對應的子設定 modal
    given:
      - hub modal 已開啟
    when:
      - 點 hub modal 內任一張卡片
    then:
      - hub modal 關閉
      - 對應的子 modal 開啟（例：點 LLM Provider 卡片就開 LlmProviderModal）

  - id: F3
    scenario: 使用者從子設定 modal 回到 hub modal
    given:
      - 使用者在子設定 modal 內（透過 hub 進入）
    when:
      - 關閉子設定 modal
    then:
      - 回到主畫面
      - hub modal 不會被自動重新開啟

  - id: F4
    scenario: 使用者在全域設定切換語系
    given:
      - 使用者打開全域設定 modal
    when:
      - 找到「語言 / Language」區段
      - 選擇另一個語系（zh-TW / en / ja 任一）
    then:
      - 介面語系即時切換
      - 選擇被持久化（下次重開 app 仍是同一語系）

  - id: F5
    scenario: 使用者打開全域設定時不再看到工作區安全紅色警告
    given:
      - 使用者打開全域設定 modal
      - 工作區尚未設定密碼
    when:
      - 滑到「工作區安全」區段
    then:
      - 不顯示紅色 transportRiskWarning 警告框
      - 「設定密碼」相關按鈕與輸入框仍保留
      - 密碼設定失敗時的操作回饋紅字仍保留

  - id: F6
    scenario: 使用者在 header 不再看到語系切換 icon
    given:
      - 使用者在主畫面
    when:
      - 觀察 header 區域
    then:
      - header 上不再出現 Globe icon
      - 語系切換改到全域設定 modal 內進行

  - id: F7
    scenario: 使用者可以框選 chat 訊息的文字
    given:
      - 使用者在 canvas 上有 pod
      - pod 內有 chat 訊息內容
    when:
      - 用滑鼠拖曳框選 chat 訊息文字
    then:
      - 文字被選取
      - 可以用 Cmd+C / 右鍵複製到剪貼簿
      - pod 標題、model 名稱等 pod chrome 元素仍不可框選
      - doodle 連線 / SVG 拖曳區仍不可框選

  - id: F8
    scenario: 使用者查看 LLM Provider 列表不再看到未登入提示文字
    given:
      - 使用者打開 LLM Provider modal
      - 進入 opencode 設定的 provider 列表
    when:
      - 觀看每一張 provider 卡片
    then:
      - 未登入的 provider 卡片只顯示名稱與 opacity-50 視覺
      - 已登入的 provider 卡片顯示名稱與綠色「已連線」徽記
      - 卡片右側不再有「請在 terminal 執行 xxx auth login 後重新整理」提示文字

  - id: F9
    scenario: 開發者執行測試時不再有 coverage 相關工具
    given:
      - 開發者 clone 本專案
      - 開發者跑 bun install
    when:
      - 查看 package.json scripts 區段
      - 查看 devDependencies 區段
      - 查看 vitest.config.ts
      - 查看 .gitignore
    then:
      - package.json 不再有 test:coverage script
      - devDependencies 不再有 @vitest/coverage-v8
      - vitest.config.ts 不再有 coverage 區塊
      - .gitignore 不再有 coverage/ 條目
      - bun run test:run 仍能正常執行
