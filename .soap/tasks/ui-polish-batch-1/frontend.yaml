              `IntegrationsHubModal.vue` 樣式參考既有 doodle 風格（`border-doodle-ink` / `rounded-md` / `hover:bg-accent` 等）,卡片上下排版用 `flex flex-col items-center gap-2 p-4` 之類維持點擊區夠大；註解用 zh-TW 註明三個 emit 對應的子 modal 用途。
