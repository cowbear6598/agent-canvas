            text: |
              在 `frontend/src/locales/zh-TW.json` 的 `settings` 區段（line 883 起）內新增 `language` 子物件,含 `title`（值：「語言」）、`description`（值：「介面顯示的語言」）。請放在 `timezone` / `timezonePlaceholder` 之後、`backup` 之前,維持區段視覺順序。
