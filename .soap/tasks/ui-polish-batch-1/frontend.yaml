            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue
          - id: P3.B.t2
            text: |
              在 AppHeader.vue template 底部（與其他 modal 平行）新增 `<IntegrationsHubModal v-model:open="showIntegrationsHubModal" @select-mcp="openMcpFromHub" @select-plugin="openPluginFromHub" @select-llm-provider="openLlmProviderFromHub" />`。保留原 `ManagedMcpModal` / `ManagedPluginModal` / `LlmProviderModal` 三個 modal 元件本身（仍由各自 v-model:open 控制）。
            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue
          - id: P3.B.t3
            text: |
              在 AppHeader.vue script setup 中：(1) 從 `lucide-vue-next` 的 import 移除 `Bot`、`Puzzle`、`Globe`、`Cpu`,新增 `Boxes`；(2) 移除「語言切換相關」整段（line 180-223 範圍：`type SupportedLocale`、`LOCALE_OPTIONS` 常數、`showLocaleMenu` ref、`localeMenuRef` ref、`currentLocale` computed、`currentLocaleLabel` computed、`handleSelectLocale`、`handleOutsideMouseDown`、`onMounted` / `onUnmounted` 註冊 listener、`i18n` 與 `setLocale` 兩個 import）；(3) 新增 `IntegrationsHubModal` import 與 `showIntegrationsHubModal` ref（初值 false）。如果移除後 `onMounted` / `onUnmounted` / `computed` 等 Vue API 已無其他使用點,請一併從 vue import 中清掉。
            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue
          - id: P3.B.t4
            text: |
              在 AppHeader.vue script setup 新增三個 handler：`openMcpFromHub` 設 `showManagedMcpModal.value = true`；`openPluginFromHub` 設 `showManagedPluginModal.value = true`；`openLlmProviderFromHub` 設 `showLlmProviderModal.value = true`。註解用 zh-TW 註明這些 handler 是給 hub modal 卡片 emit 的 entry point,且 hub modal 在 emit 前已自行 close,因此這裡只負責開子 modal、不處理重開 hub。
            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue

