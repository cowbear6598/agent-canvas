              新增 `frontend/src/components/settings/IntegrationsHubModal.vue`：使用 shadcn `Dialog` / `DialogContent` / `DialogHeader` / `DialogTitle` / `DialogDescription` 組成中央彈出 modal。props 為 `open: boolean`,emit `update:open` 與三個語意化事件 `select-mcp` / `select-plugin` / `select-llm-provider`。template 內以 grid 列出三張卡片（圖示用 lucide-vue-next `Bot` / `Puzzle` / `Cpu`、配標題從 `integrationsHub.cards.*` 取得）,每張卡片是 `<button>`,點擊先 emit `update:open(false)` 再 emit 對應 `select-*` 事件。
            completed: true
            last_files_changed:
