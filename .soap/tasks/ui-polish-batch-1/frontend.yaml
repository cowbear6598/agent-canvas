feature: ui-polish-batch-1
side: frontend
approved: true
phases:
  - id: P1
    title: 共用常數 / locale 字串調整
    parallel: true
    verification:
      - bun run style
    done: true
    items:
      - id: P1.A
        title: 抽出 LOCALE_OPTIONS 共用模組
        tasks:
          - id: P1.A.t1
            text: |
              新增 `frontend/src/constants/locale.ts`：匯出 `SupportedLocale` 型別、`LOCALE_OPTIONS` 常數（value / label / abbr 三欄，依序 zh-TW / en / ja,內容與 AppHeader.vue:183-191 既有定義一致）。註解使用 zh-TW。此檔目的是讓 AppHeader 與 GlobalSettingsModal 共用同一份語系清單,避免兩處重複維護。
            completed: true
            last_files_changed:
              - frontend/src/constants/locale.ts
          - id: P1.A.t2
            text: |
              在 `frontend/src/i18n.ts` 將原本 module 內的 `SupportedLocale` 型別改為從 `@/constants/locale` 重新匯出（或內部仍保留型別、但確保與共用模組的 union 完全相同）。`setLocale` 與 `getInitialLocale` 內的白名單檢查仍維持以 `SUPPORTED_LOCALES` 陣列比對,但比對來源改為從 `LOCALE_OPTIONS` 萃取 `value`,避免兩份白名單漂移。
            completed: true
            last_files_changed:
              - frontend/src/i18n.ts
