  - id: P2
    title: 全域設定 modal 調整（移除紅色警告 + 新增語言區段）
    parallel: false
    verification:
      - bun run style
    done: true
    items:
      - id: P2.A
        title: 刪除常駐 transportRiskWarning 區塊
        tasks:
          - id: P2.A.t1
            text: |
              在 `frontend/src/components/settings/GlobalSettingsModal.vue` 第 459-463 行整段刪除 `<WarningBox v-if="securityStore.showTransportRiskWarning" ... />`。注意：`CanvasSecurityModal.vue:170` 仍有此 store 屬性使用點,因此 `securityStore.showTransportRiskWarning` 本體與 `connectionSecurity.ts` 的判斷邏輯一律保留,**不**清理 store 定義。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/GlobalSettingsModal.vue
          - id: P2.A.t2
            text: |
              `GlobalSettingsModal.vue` 的 `<script setup>` 區塊（line 1-298 範圍）檢查 `WarningBox` import（line 33）：若整檔內已無其他使用點,移除此 import 行；若有其他位置仍用 `WarningBox` 則保留。同樣檢查 `useSecurityStore` import 與 `securityStore` 變數,若整檔內已無其他使用點則一併移除,否則保留。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/GlobalSettingsModal.vue
      - id: P2.B
        title: 新增「語言 / Language」獨立區段
        tasks:
          - id: P2.B.t1
            text: |
              在 `GlobalSettingsModal.vue` template 的 ScrollArea 內,於現有「時區」區段（line 315-333）之後、第一個 `<div class="border-t border-border" />` 分隔線之後、「備份設定」之前,插入一個 `<div class="space-y-2">` 新區段：含 `<Label>` 顯示 `$t("settings.language.title")`、`<Select>` 元件以 `LOCALE_OPTIONS` 為來源逐一渲染 `SelectItem`（value 為 locale code,內容為 label）。Select 的 v-model 綁定一個新的 `currentLocale` ref,初始值取自 `i18n.global.locale.value`。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/GlobalSettingsModal.vue
          - id: P2.B.t2
            text: |
              在 `GlobalSettingsModal.vue` script setup 區塊新增：(1) `import { LOCALE_OPTIONS } from "@/constants/locale";`；(2) `import { i18n, setLocale } from "@/i18n";`；(3) 用 `ref` 宣告 `currentLocale`,初值取 `i18n.global.locale.value`；(4) `watch(currentLocale, (next) => setLocale(next));` — 切換即時生效並寫入 localStorage（重用 i18n.ts 既有邏輯,**不**新增任何 try-catch / fallback）。註解使用 zh-TW,說明此區段重用 setLocale 統一持久化。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/GlobalSettingsModal.vue
          - id: P2.B.t3
            text: |
              在新區段下方插入 `<div class="border-t border-border" />` 分隔線,與既有「備份設定」區段之間維持與其他區段一致的視覺分隔。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/GlobalSettingsModal.vue

  - id: P3
