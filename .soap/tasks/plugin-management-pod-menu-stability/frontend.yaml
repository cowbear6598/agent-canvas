feature: plugin-management-pod-menu-stability
side: frontend
approved: true
phases:
  - id: P1
    title: Plugin 排序合約與 store
    parallel: false
    verification:
      - cd frontend && bun run style
    done: true
    items:
      - id: P1.A
        title: Plugin 型別與 API
        tasks:
          - id: P1.A.t1
            text: 更新 `frontend/src/types/plugin.ts`，讓 installed plugin 型別包含後端回傳的排序欄位
            completed: true
            last_files_changed:
              - frontend/src/types/plugin.ts
          - id: P1.A.t2
            text: 更新 `frontend/src/types/websocket/events.ts`、`frontend/src/types/websocket/requests.ts` 與 `frontend/src/types/websocket/responses.ts`，加入 plugin reorder 的 request/response 型別
            completed: true
            last_files_changed:
              - frontend/src/types/websocket/events.ts
              - frontend/src/types/websocket/requests.ts
              - frontend/src/types/websocket/responses.ts
          - id: P1.A.t3
            text: 更新 `frontend/src/services/pluginApi.ts`，新增 reorder API 函式並回傳後端確認後的 plugin 清單
            completed: true
            last_files_changed:
              - frontend/src/services/pluginApi.ts
      - id: P1.B
        title: Managed plugin store
        tasks:
          - id: P1.B.t1
            text: 更新 `frontend/src/stores/managedPluginStore.ts`，移除以安裝時間排序的前端排序邏輯，改以後端回傳順序作為唯一顯示順序
            completed: true
            last_files_changed:
              - frontend/src/stores/managedPluginStore.ts
          - id: P1.B.t2
            text: 在 `managedPluginStore` 增加 reorder action，先更新本地清單順序，再呼叫 reorder API 取得後端確認後的清單
            completed: true
            last_files_changed:
              - frontend/src/stores/managedPluginStore.ts
          - id: P1.B.t3
            text: 調整 `managedPluginStore.refresh()`，在已有快取資料時支援背景更新，不讓 Pod Plugins popover 每次開啟都進入阻塞 loading
            completed: true
            last_files_changed:
              - frontend/src/stores/managedPluginStore.ts

  - id: P2
    title: Plugin 管理區 Drag 排序
    parallel: false
    verification:
      - cd frontend && bun run style
    done: true
    items:
      - id: P2.A
        title: 管理區拖曳互動
        tasks:
          - id: P2.A.t1
            text: 在 `frontend/src/components/settings/ManagedPluginModal.vue` 導入既有 `vue-draggable-plus`，讓 plugin 列表可透過拖曳調整順序
            completed: true
            last_files_changed:
              - frontend/src/components/settings/ManagedPluginModal.vue
          - id: P2.A.t2
            text: 將 `ManagedPluginModal` 的拖曳完成事件串接到 `managedPluginStore.reorder()`，拖曳後立即保存新順序
            completed: true
            last_files_changed:
              - frontend/src/components/settings/ManagedPluginModal.vue
          - id: P2.A.t3
            text: 調整 `ManagedPluginModal` 的 loading、install、update、delete 按鈕狀態，避免排序保存中同時觸發會改變同一份 plugin 清單的操作
            completed: true
            last_files_changed:
              - frontend/src/components/settings/ManagedPluginModal.vue

  - id: P3
    title: Pod Plugins popover 穩定性
    parallel: false
    verification:
      - cd frontend && bun run style
    done: true
    items:
      - id: P3.A
        title: Popover 載入與定位
        tasks:
          - id: P3.A.t1
            text: 更新 `frontend/src/components/pod/PluginPopover.vue`，開啟時若 store 已有快取 plugin 清單就立即顯示，不等待 refresh 完成
            completed: true
            last_files_changed:
              - frontend/src/components/pod/PluginPopover.vue
          - id: P3.A.t2
            text: 更新 `PluginPopover` 的背景刷新流程，讓刷新中的清單更新不覆蓋使用者正在切換的 Pod plugin 本地狀態
            completed: true
            last_files_changed:
              - frontend/src/components/pod/PluginPopover.vue
          - id: P3.A.t3
            text: 調整 `frontend/src/components/pod/CanvasPod.vue` 與 `frontend/src/composables/pod/usePodPopovers.ts` 的 popover 開關資料，讓 Pod 拖動或畫布視角改變時關閉已開啟的 Plugins popover
            completed: true
            last_files_changed:
              - frontend/src/components/pod/CanvasPod.vue
              - frontend/src/composables/pod/usePodPopovers.ts

  - id: P4
    title: Pod 右鍵選單移除 Goal 入口
    parallel: false
    verification:
      - cd frontend && bun run style
    done: true
    items:
      - id: P4.A
        title: Pod context menu 清理
        tasks:
          - id: P4.A.t1
            text: 從 `frontend/src/components/canvas/PodContextMenu.vue` 移除設定 Goal 與編輯 Goal 的 menu item，保留下載與 integration 操作
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/PodContextMenu.vue
          - id: P4.A.t2
            text: 清理 `PodContextMenu.vue`、`frontend/src/components/canvas/CanvasContainer.vue` 與 locale 檔中只供右鍵 Goal 入口使用的 emit、handler 與翻譯鍵
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/PodContextMenu.vue
              - frontend/src/components/canvas/CanvasContainer.vue
              - frontend/src/locales/en.json
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/ja.json
          - id: P4.A.t3
            text: 確認 `frontend/src/components/pod/CanvasPod.vue` 的 Pod Goal slot 仍可開啟既有 Goal editor
            completed: true
            last_files_changed: []
