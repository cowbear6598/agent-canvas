feature: plugin-management-pod-menu-stability
approved: true
scenarios:
  - id: F1
    scenario: 使用者在 Plugin 管理區調整 plugin 顯示順序
    given:
      - 使用者已開啟 Plugin 管理區
      - Plugin 管理區已有多個 plugin
    when:
      - 使用者拖曳某個 plugin 到新的位置
      - 使用者放開拖曳
    then:
      - Plugin 清單立即呈現新的順序
      - 新順序會被保存
      - 使用者重新開啟 Plugin 管理區時仍看到相同順序

  - id: F2
    scenario: 使用者在 Pod 上開啟 Plugins 時不被 loading 阻斷
    given:
      - 使用者已開啟畫布
      - 使用者曾經載入過 plugin 清單
    when:
      - 使用者點擊 Pod 上的 Plugins
    then:
      - Plugins 清單立即顯示已知資料
      - 系統可在背景更新 plugin 清單
      - 使用者可以穩定切換 Pod 的 plugin 啟用狀態

  - id: F3
    scenario: 使用者在 Plugins 載入期間移動畫布或 Pod
    given:
      - 使用者已開啟畫布
      - 使用者正在打開 Pod 上的 Plugins
    when:
      - 使用者拖動 Pod
      - 使用者平移畫布
      - 使用者縮放畫布
    then:
      - Plugins 彈出區不會停留在錯誤位置
      - Plugins 彈出區不會對錯誤的 Pod 執行操作
      - 使用者再次點擊 Plugins 時看到正確位置與正確資料

  - id: F4
    scenario: 使用者從 Pod 右鍵選單操作 Pod
    given:
      - 使用者已開啟畫布
      - 畫布上已有 Pod
    when:
      - 使用者在 Pod 上按右鍵
    then:
      - 右鍵選單不顯示設定 Goal 或編輯 Goal 的項目
      - 使用者仍可使用右鍵選單的其他 Pod 操作
      - 使用者仍可從 Pod 上的 Goal 入口管理 Goal
