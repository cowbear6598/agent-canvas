feature: managed-mcp-registry
side: frontend
approved: true
phases:
  - id: P1
    title: Managed MCP 前端資料契約與快取層
    parallel: false
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P1.A
        title: 建立 registry 與 availability 的型別與 API wrapper
        tasks:
          - id: P1.A.t1
            text: 擴充 `frontend/src/types/mcp.ts`、`frontend/src/types/websocket/events.ts`、`frontend/src/types/websocket/requests.ts` 與 `frontend/src/types/websocket/responses.ts`，把 Header modal 用的 managed registry item 與 Pod popover 用的 availability item 分成兩種資料契約，並加入 registry list/save/delete 與 `pod:mcp-availability:list` 事件
            completed: true
            last_files_changed:
              - frontend/src/types/mcp.ts
              - frontend/src/types/websocket/events.ts
              - frontend/src/types/websocket/requests.ts
              - frontend/src/types/websocket/responses.ts
          - id: P1.A.t2
            text: 建立 `frontend/src/services/managedMcpApi.ts`，提供 registry list/save/delete 與 pod availability list 的 WebSocket wrapper、normalizer 與 cache invalidation；同時把既有 `frontend/src/services/mcpApi.ts` 收斂成 Pod selection 寫入與其專屬 cache 邏輯，不再承擔 provider-native list 載入
            completed: true
            last_files_changed:
              - frontend/src/services/managedMcpApi.ts
              - frontend/src/services/mcpApi.ts
          - id: P1.A.t3
            text: 新增 `frontend/tests/services/managedMcpApi.test.ts`，案例名稱至少包含「registry list 會正規化 transport 與 status」「pod availability 會保留 selected / disabledReason」「registry save/delete 後會清掉相關 cache」；測試只 mock `createWebSocketRequest` 這個外部傳輸 wrapper，不 mock normalizer 與 cache helper
            completed: true
            last_files_changed:
              - frontend/tests/services/managedMcpApi.test.ts

      - id: P1.B
        title: 建立 Header modal 所需的 store 與 broadcast invalidation
        tasks:
          - id: P1.B.t1
            text: 建立 `frontend/src/stores/managedMcpStore.ts`，集中管理全域 registry 清單、loading/error 狀態、save/delete action 與手動 refresh，讓 Header modal 不直接散落呼叫 API wrapper
            completed: true
            last_files_changed:
              - frontend/src/stores/managedMcpStore.ts
          - id: P1.B.t2
            text: 在前端 WebSocket event handler 路徑新增 managed MCP registry 更新事件處理，收到後要同時失效全域 registry cache 與 pod availability cache，並讓已開啟的 Header modal 或 Pod popover 可以重新抓到最新資料
            completed: true
            last_files_changed:
              - frontend/src/composables/eventHandlers/managedMcpEventHandlers.ts
              - frontend/src/composables/useUnifiedEventListeners.ts
          - id: P1.B.t3
            text: 新增 store / event handler 測試，案例名稱至少包含「registry updated 事件會觸發 cache invalidation」「store refresh 失敗會保留錯誤狀態」「save 成功後清單會更新」；測試的 mock 邊界落在 `managedMcpApi` wrapper，不 mock Pinia state mutation 本身
            completed: true
            last_files_changed:
              - frontend/tests/stores/managedMcpStore.test.ts
              - frontend/tests/composables/useUnifiedEventListeners.test.ts

  - id: P2
    title: Header 全域 MCP 按鈕與管理 modal
    parallel: false
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P2.A
        title: 將全域 MCP 入口接到 AppHeader
        tasks:
          - id: P2.A.t1
            text: 編輯 `frontend/src/components/layout/AppHeader.vue`，新增獨立的 MCP 按鈕與 open state，讓 Header 可以開啟新的 managed MCP modal，而不是把功能塞進 `GlobalSettingsModal`
            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue
          - id: P2.A.t2
            text: 在 `frontend/src/locales/zh-TW.json`、`frontend/src/locales/en.json`、`frontend/src/locales/ja.json` 新增 managed MCP 相關文案，至少包含 Header 按鈕 title、modal 標題、transport 欄位、status badge、last error、空狀態與儲存/刪除操作文案
            completed: true
            last_files_changed:
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/en.json
              - frontend/src/locales/ja.json
          - id: P2.A.t3
            text: 新增或補強 Header 相關測試，案例名稱至少包含「點擊 Header MCP 按鈕會開啟 modal」「modal 關閉後 Header 狀態恢復」；測試可以 mock `useManagedMcpStore` 這個 UI 外層 wrapper，不 mock `AppHeader` 內部的開關 state
            completed: true
            last_files_changed:
              - frontend/tests/components/layout/AppHeader.test.ts

      - id: P2.B
        title: 實作 managed MCP modal 與 child status 顯示
        tasks:
          - id: P2.B.t1
            text: 建立 `frontend/src/components/settings/ManagedMcpModal.vue`，使用既有 Dialog 元件呈現 registry 清單、create/edit 表單與 delete 操作，並讓表單能依 `stdio`、`http`、`sse` 切換對應欄位
            completed: true
            last_files_changed:
              - frontend/src/components/settings/ManagedMcpModal.vue
          - id: P2.B.t2
            text: 在 `ManagedMcpModal.vue` 內為每一筆 registry entry 顯示 child MCP 狀態資訊，至少包含健康狀態、啟動中狀態、最近一次失敗原因與 transport；若需要更多細節，使用 inline detail panel 或次級視圖承載，不再把這些狀態塞進 Pod popover
            completed: true
            last_files_changed:
              - frontend/src/components/settings/ManagedMcpModal.vue
          - id: P2.B.t3
            text: 新增 `frontend/tests/components/settings/ManagedMcpModal.test.ts`，案例名稱至少包含「列出 registry entries」「切換 transport 時顯示對應欄位」「儲存後刷新清單」「error 狀態會顯示 last error」；測試只 mock `useManagedMcpStore` 或 `managedMcpApi` 這類外層 wrapper，不 mock Dialog 與表單互動本身
            completed: true
            last_files_changed:
              - frontend/tests/components/settings/ManagedMcpModal.test.ts

  - id: P3
    title: Pod MCP availability 與 selection flow
    parallel: false
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P3.A
        title: 讓 Pod popover 改吃 pod-scoped availability
        tasks:
          - id: P3.A.t1
            text: 編輯 `frontend/src/components/pod/McpPopover.vue`，將載入來源從 provider-native `listMcpServers` 改成 pod-scoped availability API，畫面要同時呈現 `selected`、`selectable`、`disabledReason` 與 runtime status，並保留 Goal built-in MCP 的 locked 顯示
            completed: true
            last_files_changed:
              - frontend/src/components/pod/McpPopover.vue
          - id: P3.A.t2
            text: 擴充 `frontend/src/components/pod/McpServerRow.vue` 與必要樣式，讓 row 能顯示 transport、status badge、disabled hint 與 readonly/locked 狀態；`CanvasPod.vue` 的 active count 仍以 `pod.mcpServerNames` 為唯一來源，避免 UI 自己推算 selection
            completed: true
            last_files_changed:
              - frontend/src/components/pod/McpServerRow.vue
          - id: P3.A.t3
            text: 更新 `frontend/tests/components/pod/McpPopover.test.ts`，案例名稱至少包含「availability row 顯示 selected 與 disabledReason」「全域 registry 改動後重新開啟 popover 會看到新狀態」「無效 name 不再被當成可切換 user MCP」；測試只 mock API wrapper 與 canvas guard，不 mock `McpPopover` 內部狀態轉換
            completed: true
            last_files_changed:
              - frontend/tests/components/pod/McpPopover.test.ts

      - id: P3.B
        title: 接上 selection 更新與全域變更同步
        tasks:
          - id: P3.B.t1
            text: 保留 `pod:set-mcp-server-names` 作為 Pod subset 寫入路徑，調整前端 cache invalidation 與 store 更新順序，確保切換後的 `pod.mcpServerNames`、Header registry 廣播與 popover 本地 state 不會互相覆蓋
            completed: true
            last_files_changed:
              - frontend/src/services/mcpApi.ts
              - frontend/src/composables/eventHandlers/podEventHandlers.ts
              - frontend/src/stores/pod/podStore.ts
          - id: P3.B.t2
            text: 補強 `frontend/tests/composables/eventHandlers/podEventHandlers.test.ts` 與相關快取測試，案例名稱至少包含「registry updated 事件後下一次 popover 會重抓 availability」「POD_MCP_SERVER_NAMES_UPDATED 仍會更新 podStore active count」「provider 切換或 Goal 變動時 availability cache 會失效」
            completed: true
            last_files_changed:
              - frontend/tests/composables/eventHandlers/podEventHandlers.test.ts
              - frontend/tests/services/managedMcpApi.test.ts
              - frontend/tests/integration/canvasPodFlow.test.ts
              - frontend/tests/services/mcpApi.test.ts
              - frontend/tests/stores/podStore.test.ts
