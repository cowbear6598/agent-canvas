feature: goal-mcp-refactor
side: backend
approved: true
phases:
  - id: P1
    title: Goal MCP contract 與 runtime 狀態
    parallel: false
    verification: []
    done: true
    items:
      - id: P1.A
        title: 建立內建 Goal MCP surface
        tasks:
          - id: P1.A.t1
            text: 建立固定名稱的內建 `agent_canvas_goal` MCP bridge，定義 Goal runtime 會暴露給模型的工具介面與回傳格式
            completed: true
            last_files_changed:
              - backend/src/services/goalRuntime.ts
              - backend/src/services/mcp/goalMcpBridge.ts
          - id: P1.A.t2
            text: 把現有 `goalRuntime` 改成 run-scoped state helper，讓目前 todo、完成狀態與阻塞摘要可以被 Goal MCP 工具讀取與推進
            completed: true
            last_files_changed:
              - backend/src/services/goalRuntime.ts
          - id: P1.A.t3
            text: 讓 Goal MCP 的完成與阻塞工具回傳下一個 todo 或完成狀態，作為同一輪 tool loop 持續推進的唯一協議
            completed: true
            last_files_changed:
              - backend/src/services/goalRuntime.ts
              - backend/src/services/mcp/goalMcpBridge.ts
          - id: P1.A.t4
            text: 補 `backend/tests/unit/goalRuntime.test.ts` 或新增相鄰單元測試，覆蓋 Goal runtime state 與 MCP tool contract 的主要分支
            completed: true
            last_files_changed:
              - backend/tests/unit/goalRuntime.test.ts
      - id: P1.B
        title: MCP discovery 與 control plane
        tasks:
          - id: P1.B.t1
            text: 將 `MCP_LIST` schema 與 handler 改成 pod-aware，讓同一個 provider 可依 Pod 是否有 Goal 回傳不同的 built-in MCP 清單
            completed: true
            last_files_changed:
              - backend/src/schemas/mcpSchemas.ts
              - backend/src/handlers/mcpHandlers.ts
          - id: P1.B.t2
            text: 讓後端正式回傳 `system`、`locked` 與 Goal Runtime metadata，作為前端顯示的唯一真相來源
            completed: true
            last_files_changed:
              - backend/src/handlers/mcpHandlers.ts
              - backend/src/services/goalRuntime.ts
              - backend/src/schemas/mcpSchemas.ts
          - id: P1.B.t3
            text: 補 `backend/tests/integration/pod-api.test.ts`、`backend/tests/unit/providerHandlers.test.ts` 或相鄰測試，驗證有 Goal 與無 Goal 的 MCP list 差異
            completed: true
            last_files_changed:
              - backend/tests/unit/mcpHandlers.test.ts

  - id: P2
    title: 三個 provider 的 Goal MCP 掛載
    parallel: true
    verification: []
    done: true
    items:
      - id: P2.A
        title: Claude 掛載內建 Goal MCP
        tasks:
          - id: P2.A.t1
            text: 在 Claude provider 的 MCP 組裝流程中合併 `agent_canvas_goal`，並與 Pod 自選 MCP、integration reply MCP 同時存在
            completed: true
            last_files_changed:
              - backend/src/services/provider/claude/buildClaudeOptions.ts
          - id: P2.A.t2
            text: 只在 Pod 有 Goal 時掛入 Goal MCP，沒有 Goal 的 Pod 保持既有 user MCP 與 integration tool 行為
            completed: true
            last_files_changed:
              - backend/src/services/provider/claude/buildClaudeOptions.ts
          - id: P2.A.t3
            text: 補 `backend/tests/unit/buildClaudeOptions.test.ts` 與 `backend/tests/provider/claudeProviderBuildOptions.test.ts`，驗證 Goal MCP 與既有 MCP 合併規則
            completed: true
            last_files_changed:
              - backend/tests/unit/buildClaudeOptions.test.ts
              - backend/tests/provider/claudeProviderBuildOptions.test.ts
      - id: P2.B
        title: Codex 掛載內建 Goal MCP
        tasks:
          - id: P2.B.t1
            text: 為 Codex provider 補上 request-scoped MCP config 組裝，讓 `agent_canvas_goal` 能和使用者已安裝的 MCP 一起被送進同一次執行
            completed: true
            last_files_changed:
              - backend/src/services/provider/codexProvider.ts
          - id: P2.B.t2
            text: 移除 `CODEX_ENV` 的模組層快取做法，改成每次執行動態建立 env 與 config path，讓 Goal MCP context 能跟著當前 Pod 與 Run 切換
            completed: true
            last_files_changed:
              - backend/src/services/provider/codexProvider.ts
          - id: P2.B.t3
            text: 擴充 Codex normalizer 與 provider 事件流，讓 `mcp_tool_call` 也會被轉成標準化 tool call event 供 Goal runtime 推進
            completed: true
            last_files_changed:
              - backend/src/services/provider/codexNormalizer.ts
          - id: P2.B.t4
            text: 補 `backend/tests/provider/codexProvider.test.ts`、`backend/tests/provider/codexNormalizer.test.ts` 與 `backend/tests/provider/codexProviderBuildOptions.test.ts`，覆蓋 Goal MCP 注入與 tool event 映射
            completed: true
            last_files_changed:
              - backend/tests/provider/codexNormalizer.test.ts
              - backend/tests/provider/codexProviderBuildOptions.test.ts
      - id: P2.C
        title: Opencode 掛載內建 Goal MCP
        tasks:
          - id: P2.C.t1
            text: 調整 opencode server 的 config 組裝方式，讓 `agent_canvas_goal` 可以作為系統 MCP 與使用者既有 MCP 一起被 server 載入
            completed: true
            last_files_changed:
              - backend/src/services/provider/opencodeProvider.ts
          - id: P2.C.t2
            text: 更新 opencode provider 的 tool subset 邏輯，讓 Goal MCP 在 Pod 有 Goal 時被納入可用工具集合，沒有 Goal 時不暴露
            completed: true
            last_files_changed:
              - backend/src/services/provider/opencodeProvider.ts
          - id: P2.C.t3
            text: 補 `backend/tests/provider/opencodeServer.test.ts`、`backend/tests/provider/opencodeProvider.test.ts` 與相鄰 provider 測試，驗證 Goal MCP 與既有 user MCP 的共存掛載
            completed: true
            last_files_changed:
              - backend/tests/provider/opencodeProvider.test.ts

