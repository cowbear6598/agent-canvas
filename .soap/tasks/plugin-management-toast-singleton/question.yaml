feature: plugin-management-toast-singleton
created: "2026-05-25"
approved: true
questions:
  - id: Q1
    text: Plugin 管理目前顯示的是安裝時間還是更新時間？
    type: codebase-investigation
    completed: true
    answer: |
      `frontend/src/components/settings/ManagedPluginModal.vue` 目前卡片文案使用「安裝於」，並呼叫 `formatDate(plugin.installedAt)`。`InstalledPlugin` 型別同時已有 `installedAt` 與 `updatedAt`，後端 `managed_plugins` table 也同時保存 `installed_at` 與 `updated_at`，更新 plugin 時會更新 `updated_at`。
  - id: Q2
    text: rename canvas 會跳兩次 toast 的原因是什麼？
    type: codebase-investigation
    completed: true
    answer: |
      `frontend/src/stores/canvasStore.ts` 的 `renameCanvas()` 在 WebSocket request 成功後會呼叫 `showSuccessToast("Canvas", t("store.canvas.renamed"), newName)`。同一個 `CANVAS_RENAMED` response 也會被 `frontend/src/composables/eventHandlers/canvasEventHandlers.ts` 的 `handleCanvasRenamed` 收到，`createUnifiedHandler` 針對 own operation 且有 `toastMessage` 時會再呼叫一次 toast，所以同一次 rename 會出現兩個成功 toast。
  - id: Q3
    text: 除了 rename canvas，還有哪些 WebSocket own operation 可能同時在 action 與 event handler 顯示成功 toast？
    type: codebase-investigation
    completed: true
    answer: |
      目前具相同風險的來源包含：Canvas create（store 成功 toast + `CANVAS_CREATED` handler toastMessage）、Pod rename（store 成功 toast + `POD_RENAMED` handler toastMessage）、Pod schedule set（store 成功 toast + `POD_SCHEDULE_SET` handler toastMessage）、Connection create/delete（connection store 有成功 toast，handler 也有 toastMessage）、Canvas paste（`useCopyPaste` 成功 toast + `CANVAS_PASTE_RESULT` handler toastMessage）、Repository delete（repository store 成功 toast + `REPOSITORY_DELETED` handler toastMessage）。此外 `POD_MODEL_SET` 與部分事件 handler 有 toastMessage，需在實作時對照發起端是否已有成功 toast。
  - id: Q4
    text: 這次修正應採用哪種 toast 所有權規則？
    type: codebase-investigation
    completed: true
    answer: |
      建議把「發起 action」作為 own operation 成功 toast 的唯一 owner，event handler 只負責同步 state 或處理其他 client 廣播，不再對 own operation 顯示成功 toast。這樣既能保留 action 端較完整的分類、描述與物件名稱，也避免同一 response 經 pending request 與全域 listener 兩條路徑各跳一次 toast。
