feature: plugin-management-toast-singleton
approved: true
scenarios:
  - id: F1
    scenario: 使用者在 Plugin 管理查看 plugin 更新時間
    given:
      - 使用者已打開 Plugin 管理視窗
      - Plugin 清單中有已安裝的 plugin
    when:
      - 使用者查看 plugin 卡片上的時間資訊
    then:
      - 畫面顯示更新於
      - 顯示的時間對應 plugin 最近一次更新時間

  - id: F2
    scenario: 使用者重新命名 Canvas 後只看到一次成功提示
    given:
      - 使用者已打開 Canvas 側邊欄
      - 使用者正在編輯某個 Canvas 名稱
    when:
      - 使用者送出新的 Canvas 名稱
    then:
      - Canvas 名稱更新成功
      - 成功提示只出現一次

  - id: F3
    scenario: 使用者執行其他會顯示成功提示的操作時只看到一次提示
    given:
      - 使用者在畫布中執行會透過 WebSocket 回應同步狀態的操作
      - 該操作完成後需要顯示成功提示
    when:
      - 操作成功完成
    then:
      - 畫面狀態更新成功
      - 成功提示只出現一次
