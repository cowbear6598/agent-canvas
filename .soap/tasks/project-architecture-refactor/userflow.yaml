feature: project-architecture-refactor
approved: true
scenarios:
  - id: F1
    scenario: 維護者查看整份專案的架構風險總覽
    given:
      - 維護者準備規劃專案重構
      - 專案同時包含前端與後端
    when:
      - 查看這次重構規劃的總覽
    then:
      - 可以看見前端的主要架構熱點
      - 可以看見後端的主要架構熱點
      - 可以看見共用契約層的主要架構熱點

  - id: F2
    scenario: 維護者取得可分階段執行的全面重構藍圖
    given:
      - 維護者要處理整個 repo 的重構
      - 維護者不希望只得到零散的單點建議
    when:
      - 查看這次重構規劃的執行方案
    then:
      - 可以看見有先後順序的重構主線
      - 可以看見每個階段要處理的重點
      - 可以看見哪些工作可以同時推進

  - id: F3
    scenario: 維護者確認這次規劃同時涵蓋前端、後端與共用契約
    given:
      - 維護者要避免只修單一側造成新的耦合
      - 這次規劃需要同時考慮多個層次
    when:
      - 查看這次重構規劃的範圍說明
    then:
      - 可以確認前端已被納入規劃
      - 可以確認後端已被納入規劃
      - 可以確認共用契約已被納入規劃
