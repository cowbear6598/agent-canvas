feature: project-architecture-refactor
created: "2026-06-03"
approved: true
impact_classification:
  frontend:
    status: possible
    evidence:
      - 使用者要求審視整份專案，已知專案包含 Vue3 前端。
      - 目前 review 已發現前端 store、畫布 host component 與 WebSocket 契約有明顯可維護性問題。
  backend:
    status: possible
    evidence:
      - 使用者要求審視整份專案，已知專案包含 Bun + TypeScript 後端。
      - 目前 review 已發現後端 handler、service、store 與 workflow lifecycle 的責任邊界混雜。
questions:
  - id: Q1
    text: 目前專案的架構熱點是否集中在前端 store / component orchestration、後端 workflow / store 邊界，以及 WebSocket 契約重複定義？
    type: codebase-investigation
    completed: true
    answer: |
      是。前端熱點集中在 `frontend/src/stores/connectionStore.ts`、`frontend/src/stores/pod/podStore.ts`、
      `frontend/src/stores/run/runStore.ts` 與 `frontend/src/components/canvas/CanvasContainer.vue`，
      這些模組同時承擔 state、domain rule、WebSocket transport、toast、listener lifecycle、
      orchestration 等多種責任。後端熱點集中在 `backend/src/services/connectionStore.ts`、
      `backend/src/services/podStore.ts`、`backend/src/services/workflow/runExecutionService.ts`、
      `backend/src/services/workflow/workflowExecutionService.ts` 與 `backend/src/handlers/podHandlers.ts`，
      存在 persistence、domain policy、transport、resource lifecycle 混寫。WebSocket 契約則分散在
      前端 `frontend/src/types/websocket/*.ts` 與後端 `backend/src/schemas/events.ts`，而
      `backend/src/schemas/serverEventManifest.ts` 目前未提供真正的 schema 約束。
  - id: Q2
    text: 前端 store 與後端 service / handler 是否存在雙向耦合或跨層直接寫入，會提高重構成本？
    type: codebase-investigation
    completed: true
    answer: |
      是。前端 `podStore` 直接操作 `connectionStore`，`connectionStore` 又反向依賴 `podStore`；
      `repositoryStore` 也會直接寫入 pod 狀態。後端則由 handler 層直接承擔 domain rule，
      同時 store 層又混入 provider fallback、validation、filesystem / resource cleanup 邏輯。
      這使得變更一個業務規則時，常常要同時修改 transport、domain 與 persistence 多層程式。
  - id: Q3
    text: 這次規劃要聚焦在可分階段落地的高 ROI 重構主線，還是要做整個 repo 的全面重構藍圖？
    type: user-input
    completed: true
    answer: 這次規劃要涵蓋整個 repo 的全面重構藍圖。
  - id: Q4
    text: 這次 scope 是否要同時涵蓋 frontend、backend 與 shared WebSocket contract，還是你要先限定某一側優先落地？
    type: user-input
    completed: true
    answer: scope 要同時涵蓋 frontend、backend 與 shared WebSocket contract。
