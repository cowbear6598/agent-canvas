  - id: Q14
    text: opencode 設定頁要列哪些 provider？資料來源為何？
    type: user-input
    completed: true
    answer: |
      資料來源：開啟設定 modal 時呼叫 opencode GET /provider 拉 { all,
      default, connected }。
      呈現邏輯：
        - 列出 all[] 內所有 provider（anthropic / openai / google /
