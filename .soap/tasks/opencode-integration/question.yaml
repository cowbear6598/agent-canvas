  - id: Q1
    text: 現有三家 provider（claude / codex / gemini）的執行模式、availableModels 維護方式、capabilities 設定是什麼？要新增第 4 家 provider 需要動哪些 touch points？
    type: codebase-investigation
    completed: true
    answer: |
      執行模式：
        - claude：在後端 process 內直接呼叫 @anthropic-ai/claude-agent-sdk 的
          query({ prompt, options }) 函式
        - codex：spawn `codex exec` / `codex exec resume` CLI 子程序、stdin 餵 prompt、
          逐行解析 stdout JSON lines
        - gemini：spawn `gemini --model X --output-format stream-json` CLI 子程序、
          prompt 用 --prompt flag（非 stdin）、解析 stream-json
      availableModels：每個 provider 在自己的 metadata 內寫死 ReadonlyArray<{label,
      value, thinkingLevels?, defaultThinkingLevel?}>。claude 3 / codex 3 /
      gemini 6 個，全部 hardcode；前端沒有「使用者編輯對應表」概念。
      capabilities：三家完全相同 → chat / plugin / repository / command / mcp
      全部 true。
      新增第 4 個 provider 需修改的檔案：
        1. backend/src/services/provider/index.ts → providerRegistry 加 entry
           （ProviderName 型別由 keyof 自動推導）
        2. backend/src/services/provider/opencodeProvider.ts → 新檔，實作 AgentProvider
        3. backend/src/services/provider/capabilities.ts → 新增 OPENCODE_CAPABILITIES
           常數
        4. backend/src/api/podApi.ts → 更新 VALID_PROVIDERS 陣列
      不需改的：DB schema（pods.provider 是 TEXT NOT NULL DEFAULT 'claude' 無 CHECK
      constraint）、statements.ts、pod.ts 型別。
      Anthropic / OpenAI / Google API Key 後端完全沒儲存也不讀取，預期由 OS
      環境變數或對應 CLI 的 auth.json 提供給 SDK / CLI — opencode 採同樣模式即可，
      不需要在後端碰 API Key 儲存層。

  - id: Q2
    text: 前端 model 選擇器目前是怎麼從 provider:list 取得 availableModels 並渲染？相關元件位置、Pinia store、capabilities 顯隱邏輯是什麼？目前 UI 是否能容納大量 model（>100 條）？
    type: codebase-investigation
    completed: true
    answer: |
      providerCapabilityStore（frontend/src/stores/providerCapabilityStore.ts）集中
      管理三層資料：
        - availableModelsByProvider: Record<Provider, ReadonlyArray<{label,value,
          thinkingLevels?,defaultThinkingLevel?}>>
        - capabilities by provider（plugin/mcp/repository/command 等開關）
        - thinkingMetaByProviderModel（二層 map）
      載入時機：App.vue mount 時呼叫 loadFromBackend() → WebSocket 送
      provider:list、收 provider:list:result。失敗保留上次有效值，僅 toast。
      現有兩套 model 選擇 UI：
        1. ProviderModelSelector.vue（GlobalSettings 內）→ 純 button list 垂直排列、
           border-l highlight 選中、Provider 與 Model 分兩區塊，無搜尋無虛擬化
        2. PodModelSelector.vue（Pod 上方 notch）→ TransitionGroup 堆疊卡片、預設
           只顯示 active、hover 展開、debounce 150ms、收合動畫 300ms，無搜尋無虛擬化
      Capabilities 顯隱對應：
        - plugin → PodPluginSlot
        - mcp → PodMcpSlot
        - repository / command → PodSingleBindSlot
        - thinking → 用 isThinkingSupportedForModel(provider, model) 查
          thinkingMetaByProviderModel
      100+ model 評估：兩套 UI 都會壞（DOM 線性增長、無捲動容器、操作低效）。

  - id: Q3
    text: opencode SDK 事實基線（package / binary / server 啟動 / session API / event stream / abort / Bun 相容性）為何？
    type: codebase-investigation
    completed: true
    answer: |
      取自 opencode.ai/docs 與 github.com/sst/opencode raw source（2026-05-14 確認）。

      1) Package
         - @opencode-ai/sdk @ 1.14.50，MIT、pure ESM、唯一 runtime dep 是
           cross-spawn@7。釋出頻率每幾天一版。
         - opencode-ai @ 1.14.50（同步 release），是「binary distributor」npm
           package，靠 optionalDependencies 拉 platform native（darwin-arm64 /
           darwin-x64 / linux-x64 / linux-arm64 等）。

      2) Binary 解析
         - @opencode-ai/sdk 本身不帶 binary；createOpencodeServer() 用
           cross-spawn launch('opencode', args) 從 PATH 找 binary，找不到會直接
           reject。
         - 標準走法：bun add opencode-ai 進專案 → postinstall 自動拉 platform
           binary 到 node_modules/.bin/opencode → 整個 npm 環境內可 spawn。
         - 不支援 OPENCODE_BIN_PATH 自訂環境變數（source code 寫死字串
           "opencode"），只能透過 PATH 變更。

      3) Server 啟動
         - createOpencodeServer(options?) spawn `opencode serve
           --hostname=… --port=…` 子程序（不是 in-process）；預設
           127.0.0.1:4096、timeout 5000ms，等 stdout 印
           "opencode server listening on <url>" 才 resolve。
         - 透過 OPENCODE_CONFIG_CONTENT env 灌入 config JSON（不必寫
           opencode.json）。
         - 回傳 { url, close() }；close() 內部 proc.kill()（Windows 走
           taskkill /T /F）。
         - createOpencode() = server + client 一鍵起；createOpencodeClient({
           baseUrl }) 是純 HTTP client。
         - **server boot 不需要任何 auth — auth.all() 用 orElseSucceed(() => ({}))，
           auth.json 不存在不會 fail；缺 key 是 session.prompt 才報錯。**

      4) Session API surface（REST / hey-api codegen client）
         - session.create: POST /session，body { parentID?, title? }，
           **query.directory** 帶 cwd（不是 body）
         - session.prompt: POST /session/{id}/message，body
           { messageID?, model?: { providerID, modelID },
             agent?, noReply?, system?, tools?: {[k]:bool},
             parts: (TextPartInput|FilePartInput|...)[] }
           → per-call 可切 model、改 system、子集化 tools、切 agent persona
         - session.abort: POST /session/{id}/abort，query.directory 可帶
         - session.fork: POST /session/{id}/fork，body { messageID? }
         - cwd 只在 session 級（query.directory），prompt 沒有 per-call cwd

      5) Event stream
         - SSE：GET /global/event；SDK 上 client.event.subscribe() 回
           { stream }，for await 取 { type, properties }
         - 31 個 event union（packages/sdk/js/src/gen/types.gen.ts）：
           server.instance.disposed / installation.updated /
           installation.update-available / lsp.client.diagnostics / lsp.updated /
           message.updated / message.removed / message.part.updated /
           message.part.removed / permission.updated / permission.replied /
           session.status / session.idle / session.compacted / session.created /
           session.updated / session.deleted / session.diff / session.error /
           file.edited / todo.updated / command.executed / file.watcher.updated /
           vcs.branch.updated / tui.prompt.append / tui.command.execute /
           tui.toast.show / pty.created / pty.updated / pty.exited /
           pty.deleted / server.connected
         - 對 NormalizedEvent 的對應建議：
           * session_started ← session.created
           * text / thinking ← message.part.updated（part.type 為 text / reasoning）
           * tool_call_start / tool_call_result ← message.part.updated（part.type
             為 tool；含 step-start / step-finish 等）
           * turn_complete ← session.idle
           * error ← session.error

      6) Abort
         - POST /session/{id}/abort → server 端直接終結該 turn，比 SIGTERM 乾淨
           （避免 a88df2f4 處理過的孤兒 runDir 同類風險）
         - 取消後 server 發 session.idle，SSE stream 本身不關（global event）

      7) Bun 相容性
         - SDK pure ESM、Bun 原生支援 fetch + cross-spawn → SDK 跑得起來
         - Binary 端是 platform native executable（Bun 編出來的 standalone），
           與 host runtime 解耦
         - 公開 issue tracker 沒看到 Bun-SDK 相關 startup 問題

      8) 已知地雷
         - PATH 找不到 opencode binary → createOpencodeServer reject（需 require
           opencode-ai 或 brew install）
         - 預設 timeout 5s — cold start 慢機可能 timeout，要拉大
         - session.create 的 cwd 在 query 不在 body
         - MCP local 的 command 是字串陣列（cmd+args 合在一起），跟 Anthropic
           標準 schema 不互通

  - id: Q4
    text: opencode 的 auth / 模型清單 / 已登入 provider 偵測機制為何？要怎麼判斷使用者已登入哪些 provider、怎麼拉到該 provider 的 model 清單？缺 key 時錯誤訊息如何辨識？
    type: codebase-investigation
    completed: true
    answer: |
      事實取自 opencode.ai/docs/server、docs/cli、packages/opencode/src/auth/index.ts
      與 src/provider/provider.ts raw source（2026-05-14 確認）。

      1) auth.json 路徑與寫入
         - macOS / Linux 統一走 XDG_DATA_HOME 慣例：
           ~/.local/share/opencode/auth.json（macOS 也是這條路；不走 Library/）
         - source 寫入 mode 0o600
         - server 啟動本身不依賴 auth：auth.all() 用 orElseSucceed(() => ({}))，
           檔不存在回空物件，不 fail
         - 只有實際呼叫 session.prompt → resolveSDK 時，若 provider 缺 key 才會炸

      2) 使用者怎麼登入
         - 互動式（人類在 terminal 跑）：opencode auth login <provider>
           （OAuth 走瀏覽器；API Key 走 prompt 輸入）
         - 程式化（非互動，我們後端可用）：
           HTTP PUT /auth/:id body { type: "api", key: "sk-..." }
           → server 寫進 auth.json、不需重啟、下次 provider 建立時生效
           SDK 上對應 client.auth.set({ path: { id }, body })

      3) GET /provider — 最重要的 endpoint
         - 路徑：GET /provider（server 端有，docs/server 明文）
         - 回傳：
           {
             all: Provider[],           // opencode 認得的所有 provider（不論登入）
             default: { [id]: string }, // 每個 provider 的預設 modelID
             connected: string[]        // 已在 auth.json 內登入的 provider id 清單
           }
         - 每個 Provider 物件內含 models 欄位（不需另外 endpoint 拉 model 清單）

      4) GET 已登入清單
         - 沒有獨立 GET /auth；用 GET /provider 的 connected[] 就是
         - 也有 PATCH /config 可改 config，但與 auth 無關

      5) 缺 key 錯誤辨識
         - HTTP 已 200 並開始 SSE 串流；錯誤以 SSE event session.error 或
           message.part 含 error 內文回傳
         - 訊息 shape：上游 Vercel AI SDK 拋 AI_APICallError，message 含
           "No auth credentials found" / "API key" 等字串
         - 我們前端的策略：先用 connected[] 過濾 disable 未登入 provider；prompt
           時若仍收到 error event，match 訊息字串顯示 "請執行 opencode auth login
           <provider>"

      6) Per-session lazy 載入 provider
         - session.prompt 帶 model: { providerID, modelID } 第一次用某 provider 時，
           server 內 resolveSDK 才 import 對應的 AI SDK + 注入 auth.json 中的 key
         - 同一個 server 內不同 session 可用不同 provider（例如 session A 用
           anthropic、session B 用 openrouter）

      7) 計費由 LLM 廠直接向使用者收
         - opencode 本身 MIT 免費；錢都付給「opencode 後面接的那個 LLM 廠商」
         - Anthropic OAuth → 走使用者的 Claude Pro / Max subscription 額度
         - Anthropic API Key → pay-per-token，走 Anthropic console 帳單
         - OpenAI / Google / OpenRouter / Groq / xAI / DeepSeek 各自 pay-per-token
         - OpenRouter 在底層廠價格上加 5% markup
         - 整體與三大家「我們後端完全不碰錢」的模式一致

