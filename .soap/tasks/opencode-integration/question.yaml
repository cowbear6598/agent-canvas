  - id: Q5
    text: 要以哪種方式接入 opencode？(A) 新增獨立 provider，執行層走 @opencode-ai/sdk；(B) 不接，繼續沿用三大家
    type: user-input
    completed: true
    answer: |
      (A) 新增獨立 opencode provider。在 providerRegistry 加 entry `opencode`，
      不依賴任何 LLM 廠 SDK。執行層走 @opencode-ai/sdk + opencode-ai binary：
      opencodeProvider.chat() 透過共用的 opencode server 建/續 session、送 prompt、
      訂閱 SSE event，把 opencode 的 31 種 event 轉成 NormalizedEvent。底層 LLM
      provider（anthropic / openai / google / openrouter / …）由 opencode 自己路由,
      file / bash / MCP / agent loop 全部交給 opencode 內建負責。

  - id: Q6
    text: opencode 的 API Key / Auth 要怎麼管？(A) 我們前端做完整 API Key 管理 UI 與 PUT /auth 寫入；(B) 完全不碰，使用者自己在 terminal 跑 `opencode auth login <provider>`（跟現有三大家相同模式）；(C) 折衷：前端列幾個常用 provider 的 API Key 輸入欄
    type: user-input
    completed: true
    answer: |
      (B) 完全不碰 auth。
      理由：
        - 三大家（claude / codex / gemini）目前就是「使用者自己在 OS 層配
          ANTHROPIC_API_KEY / codex auth / gemini auth」，後端零 secret 管理。
          opencode 採同樣模式可保持架構一致。
        - opencode auth login 有 OAuth 流（Anthropic Claude Pro / Max 走 OAuth，
          可吃 subscription 額度），前端 UI 引導不了瀏覽器 OAuth；強做反而劣化
          UX。
        - opencode 已提供 GET /provider 的 connected[] 讓我們知道使用者登入了
          哪些，已足以驅動「未登入時禁用」UX。
      UX 補強：modal 內未 connected provider 顯示 disabled + 提示文字
      「請在 terminal 執行 `opencode auth login <provider id>` 後重新整理」。

  - id: Q7
    text: opencode server lifecycle 要採哪一種策略？(A) 後端啟動時就 spawn 一個共用 server，整個應用全 Pod 共用；(B) 第一個 opencode Pod 建立時 lazy 啟動，往後共用；(C) 每個 Pod 各自一個 opencode server
    type: user-input
    completed: true
    answer: |
      (A) 後端啟動時 spawn 一個共用 server，所有 opencode Pod 共用。
      實作要點：
        - Bun 後端 bootstrap 流程加一步 createOpencodeServer({ timeout: 拉大,
          config: 注入需要的 base config })，拿到 baseUrl 後存進 service
        - opencodeProvider.chat() 透過 createOpencodeClient({ baseUrl }) 取得
          client；每個 Pod 對應一個 opencode session id（建 Pod 時呼叫
          session.create({ query: { directory: workspacePath } })）
        - 後端 shutdown 時呼叫 server.close()，把子程序關掉
        - 啟動 server 失敗：toast 報錯、provider:list 內 opencode capabilities
          標 chat=false（前端 PodModelSelector 不讓選 opencode）
      取捨：常駐子程序吃 ~50-100MB RAM 即使使用者沒用 opencode，但建 Pod 0 cold
      start，最符合「桌面應用、Agent 隨時可用」的 UX 期望。

  - id: Q8
    text: opencode provider 的 ProviderCapabilities 對應表怎麼填？現有結構為 { chat, plugin, repository, command, mcp }
    type: user-input
    completed: true
    answer: |
      OPENCODE_CAPABILITIES = {
        chat: true,
        plugin: false,
        repository: true,
        command: true,
        mcp: true,
      }
      說明：
        - chat: 基本聊天能力
        - plugin: 不支援。opencode 自家 plugin 機制（TS module）與 Claude SDK
          的 .claude-plugin（manifest + commands + hooks + MCP）格式不相容。
          要做轉接需要 commands / agents / skills 機械轉檔 + hooks 包成 TS
          plugin module，工程量 ~300-500 LOC，且偏離本 feature 初衷。首期
          plugin=false，opencode Pod 上不出 PodPluginSlot。未來如有需求，
          另開 feature 做 plugin adapter。
        - repository / command: 純前端 metadata（與 provider 是否支援無關），
          沿用三大家慣例都 true。
        - mcp: true，opencode 內建 MCP 整合（細節見 Q9）。

  - id: Q9
    text: opencode 的 MCP 設定要怎麼接？背景修正：先前以為 DB 內 integration_apps 存 MCP schema 本體 → 經查 schema.ts 與 mcpHandlers.ts 確認 **DB 只存 pod_mcp_server_names（pod→name 對應）**，MCP 設定本體由各 provider 從外部 config 讀（claude→~/.claude.json、codex→codex config、gemini→~/.gemini/settings.json）。要決定的是 (1) opencode 的 MCP 設定來源、(2) Pod 端怎麼 per-pod 子集化生效。
    type: user-input
    completed: true
    answer: |
      (1) MCP 設定來源 — 沿用三大家 reader 模式
        - 新增 backend/src/services/mcp/opencodeMcpReader.ts，讀
          ~/.config/opencode/opencode.json 的 mcp 區塊
        - 回傳 { name, type? }[]（與三大家 reader 介面對齊）
          * opencode mcp.<name>.type = "local" → type = "stdio"
          * opencode mcp.<name>.type = "remote" → type = "http" 或 "sse"
            （依 url scheme 判斷，或如果 docs 有明文就照官方）
        - handleMcpList 內 resolveAvailableMcpServers 加上 opencode 分支
        - 缺檔（使用者沒 opencode.json）→ 回空陣列、不報錯，與三大家
          self-healing 同模式

      (2) Per-pod 子集化 — 透過 session.prompt 的 tools 子集
        - opencode 一個 server 內所有 session 共用同一批 MCP server pool
          （server 啟動時就一次性 load 完）
        - opencodeProvider.buildOptions 取 Pod 的 mcpServerNames 清單後，
          轉成 session.prompt body 的 tools: { [k]: boolean } 子集
        - 細節：opencode MCP 提供的 tool 名稱通常為
          `mcp__<server>__<tool>` 風格（按 MCP convention）；先 list 該
          opencode server 提供的全部 tool（GET /experimental/tool 或
          類似 endpoint，backend.yaml 細節時確認 endpoint），按
          `mcp__<server>__*` prefix 過濾、把 Pod 已勾選的 server 對應
          的 tool 全 true、其餘的 mcp__* tool 全 false；非 MCP 的內建
          tool（file/bash/edit 等）保持 default 開啟
        - Pod 沒勾任何 MCP server → 把所有 mcp__* tool 全關，內建 tool
          照常開
        - 失敗處理：list tool endpoint 失敗 → log warning + 不送 tools
          欄位（讓 opencode 走預設）

      此設計刻意不寫 schema 轉換 adapter（原本以為要寫的那層），因為 DB 內
      根本沒存 MCP 本體；opencode 自己讀 opencode.json，我們只是「在自己
      side 也有 reader 幫前端列名稱供使用者勾選」。

  - id: Q10
    text: opencode provider 要不要支援 reasoning / thinking？
    type: user-input
    completed: true
    answer: |
      (D) 不支援。opencode session.prompt 不傳 reasoning effort 設定，由使用者
      在 opencode.json config 自行控（如果需要）或交由模型端決定。對應到
      OPENCODE_CAPABILITIES.thinking 不存在（前端不顯示 thinking-level UI），
      model 對應表也不需要記 reasoning 欄位。

