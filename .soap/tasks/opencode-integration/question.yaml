        - connected[] 內的 provider 標為「已登入」可正常設定 model 對應
        - 未在 connected[] 的 provider 顯示 disabled 狀態 + 提示文字
          「請在 terminal 執行 `opencode auth login <id>` 後重新整理」
      失敗處理（opencode server 啟不起來 / call 失敗）：toast 報錯，面板顯示
      空清單 + retry 按鈕。

  - id: Q15
    text: 每個 provider 下的 model 對應表行為？真實 model id 從哪來？是否有「別稱」欄？CRUD 範圍？
    type: user-input
    completed: true
    answer: |
      設計：
        - 每筆 row：{ providerID, modelID, alias }
        - 真實 model id 來源：從該 provider 的 Provider.models 清單（GET
          /provider 已帶回）下拉選取，避免使用者打錯字
        - 別稱欄（alias）：使用者自填，顯示在 PodModelSelector 上；不可重複
          （同一 provider 內 alias 唯一）
        - CRUD：完整支援 新增 / 編輯 / 刪除 / 重排（重排影響
          PodModelSelector 顯示順序）
        - 持久化：DB 新建一張表 opencode_model_aliases（或重用 global_settings）;
          表結構由 backend.yaml 計畫拆解時決定

  - id: Q16
    text: PodModelSelector 在 opencode provider 下，當對應表為「空」時呈現什麼？
    type: user-input
    completed: true
    answer: |
      (A) 顯示 placeholder 並禁用選取。文字：「請先到 LLM Provider 設定新增 model 對應」。
      使用者需自行打開 header 上的 LLM Provider 按鈕去設定。

  - id: Q17
    text: PodModelSelector 在對應表超過 4 筆時要怎麼呈現？
    type: user-input
    completed: true
    answer: |
      (A) 維持垂直堆疊互動，超過 4 張時在展開容器加 max-height + overflow-y: auto
      （以滾輪上下翻頁）。與現有 hover 展開動畫相容、改動最小；不影響「目前 active
      卡片貼 Pod 底部」的視覺基準。

  - id: Q18
    text: provider:list WebSocket 回傳的 opencodeProvider.availableModels 要怎麼填？三大家是 hardcode 寫死、opencode 不適用此模式（清單動態、視使用者登入而定）
    type: user-input
    completed: true
    answer: |
      opencode 的 availableModels **不從 provider metadata hardcode 取得**，
      改從 DB 內使用者建立的 model 對應表動態拉。具體流程：
        - 前端取得 opencode 的 model 清單時，改向後端要 opencode_model_aliases
          表的內容（不走 provider:list 的 availableModels 欄位）
        - 或在 provider:list 的回傳裡 opencode 那一筆，把 availableModels 動態
          填成 DB 對應表的 row（label = alias、value = providerID/modelID 組合
          字串）— 與三大家界面相容
      實作細節（傳輸格式）：value 採 "{providerID}/{modelID}" 組合字串（例如
      "anthropic/claude-sonnet-4-5"），後端在 buildOptions 時拆開塞進 opencode
      session.prompt 的 model: { providerID, modelID }；不污染 NormalizedEvent
      或 podStore 既有型別。

  - id: Q19
    text: 動態變更（使用者在 terminal 新登入了一個 provider 或更新 model 對應表）的反映機制？
    type: user-input
    completed: true
    answer: |
      - 「使用者新登入 provider」：modal 內提供「重新整理」按鈕重新打 GET
        /provider；不做 polling、不做 WebSocket push（opencode server 不會主動通知
        auth.json 變動）。
      - 「使用者改動 model 對應表」：透過後端 API 寫入 DB → 後端發 WebSocket
        provider:list:result（或新事件 opencode:aliases:updated）→
        providerCapabilityStore 更新 → PodModelSelector 自動 reactive 重繪。
      - Pod 正在跑時改 alias：不中斷 Pod 行為（chat 用的是真實 providerID/modelID，
        alias 只是顯示用）。
