feature: workflow-connection-goal-queue
approved: true
scenarios:
  - id: F1
    scenario: 使用者啟動含多條輸入線的 workflow run
    given:
      - 使用者在畫布上有一個 Pod 被多條 connection 連入
      - 該 Pod 設定了 Goal todo
      - 使用者準備啟動 workflow run
    when:
      - 使用者送出觸發訊息
    then:
      - workflow run 開始執行
      - 該 Pod 一次只處理一輪輸入
      - 後續輸入會排隊等待

  - id: F2
    scenario: 使用者看到 Pod 等完整 Goal 結束後才處理下一條 connection
    given:
      - workflow run 中同一個 Pod 已經有一輪輸入正在執行
      - 該 Pod 的 Goal 尚未完成
      - 另一條 connection 已準備觸發同一個 Pod
    when:
      - 目前這輪仍在執行
    then:
      - 另一條 connection 保持排隊
      - 目前這輪繼續執行到 Goal 完成
      - 目前這輪也可以執行到 Goal Blocked
      - 目前這輪結束後才開始下一條 connection

  - id: F3
    scenario: 使用者看到多條 Direct 連線依序產生多輪 Goal
    given:
      - Pod B 被三條 Direct connection 連入
      - Direct connection 沒有合併成同一輪
      - Pod B 設定了 Goal todo
    when:
      - 三條 Direct connection 都準備觸發 Pod B
    then:
      - Pod B 依序跑三輪 Goal
      - 每一輪都等 Goal 完成或 Blocked
      - 每一輪結束後各自觸發 Pod B 的下游

  - id: F4
    scenario: 使用者看到合併輸入以同一輪 Goal 呈現
    given:
      - Pod B 被多個來源 Pod 連入
      - 這些來源被 workflow 規則合併成同一個 connection group
      - Pod B 設定了 Goal todo
    when:
      - connection group 準備觸發 Pod B
    then:
      - Pod B 以同一輪 Goal 處理這些來源
      - 這一輪歷程顯示所有來源 Pod 名稱
      - 這一輪結束後只觸發下游一次

  - id: F5
    scenario: 使用者在歷程中辨識每一輪 Goal 的結束點
    given:
      - workflow run 中同一個 Pod 跑過多輪 Goal
      - 每一輪來自不同 connection 或 connection group
    when:
      - 使用者打開該 run 的歷程
    then:
      - 歷程依照每輪 Goal 區分內容
      - 每輪結束位置顯示 divider
      - divider 顯示來源 Pod 名稱
      - divider 顯示該輪是完成或 Blocked

  - id: F6
    scenario: 使用者遇到 workflow 執行缺少 run context 的異常
    given:
      - workflow 執行流程被程式錯誤地以非 run mode 呼叫
    when:
      - 系統嘗試觸發 workflow
    then:
      - 系統不會默默用 fallback 繼續執行
      - 系統會回報 workflow 執行錯誤
      - 使用者不會看到不完整的 queue 或 Goal 行為
