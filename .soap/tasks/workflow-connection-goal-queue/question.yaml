feature: workflow-connection-goal-queue
created: "2026-05-24"
approved: true
questions:
  - id: Q1
    text: 現有 workflow 執行是否仍支援非 run mode fallback？
    type: codebase-investigation
    completed: true
    answer: |
      現有程式碼仍保留非 run mode fallback：createStatusDelegate(runContext?)
      在沒有 runContext 時會回傳 NoopStatusDelegate，NoopStatusDelegate 不會更新
      run status、不會 enqueue，也不會啟用 Goal Runtime gate。Goal Runtime MCP
      注入與 evaluateGoalGate 也都依賴 runContext。此次需求要移除這種靜默
      fallback，workflow 執行應只承認 run mode；沒有 runContext 應視為程式錯誤，
      不可默默放行。

  - id: Q2
    text: Pod 的一輪 workflow execution 應以什麼條件視為完成？
    type: user-input
    completed: true
    answer: |
      一輪必須等完整 Goal 跑完才算完成。只有 Goal Runtime 狀態變成
      completed 或 blocked 時，該輪才可以結束、產生歷程 divider、觸發下游
      workflow，並允許 dequeue 下一個 connection item。單次 chat response 結束
      不代表 Pod 完成。

  - id: Q3
    text: 多條 connection 同時觸發同一個 target Pod 時，queue item 的單位是什麼？
    type: user-input
    completed: true
    answer: |
      queue item 是一次 connection trigger 或 connection group trigger。Direct 不
      merge 時，一條 Direct 是一個 queue item，三條 Direct 進同一 Pod 就依序跑
      三輪 Goal。Auto/Branch multi-input 或 Direct merge 形成 group 時，整個 group
      是一個 queue item。Pod queue 是容器，connection/group 是 item。

  - id: Q4
    text: 同一個 target Pod 的 connection queue 應採用什麼排隊規則？
    type: user-input
    completed: true
    answer: |
      同一個 runId + targetPodId 只能同時有一個 active connection/group item。
      只要 target Pod 正在處理一輪 Goal、已有 active stream、正在中間狀態、
      或 queue 內已有 item，後續進來的 connection/group 都必須 FIFO enqueue。
      不能只用 status === running 判斷忙碌，因為 queued/waiting/summarizing/
      deciding 等狀態也代表 Pod 不可接下一輪。

  - id: Q5
    text: Direct 不 merge 且同一 target Pod 被三條 Direct 連入時，下游應如何觸發？
    type: user-input
    completed: true
    answer: |
      預設每一輪 Goal completed/blocked 後就各自觸發下游一次。三條 Direct 不
      merge 代表三個獨立 queue item，因此 target Pod 會依序跑三輪 Goal，並在
      每一輪完成後各自將該輪結果送給下游，不等待三輪全部跑完再合併送出。

  - id: Q6
    text: 前端歷程要如何呈現同一 Pod 多輪 Goal execution？
    type: user-input
    completed: true
    answer: |
      歷程需要用 Goal 結束事件作為 divider。每個 divider 代表一個 connection/
      group item 的 Goal round 已結束，顯示來源 Pod 名稱，例如「Pod 1、Pod 2
      完成」或「Pod 3 Blocked」。divider 應由後端在 Goal completed/blocked
      放行時產生事件或可持久化的歷程資料，前端不應只靠訊息內容猜測。

  - id: Q7
    text: 現有 codebase 中哪些模組會受此次需求影響？
    type: codebase-investigation
    completed: true
    answer: |
      後端主要影響 workflowExecutionService、workflowPipeline、
      workflowStatusDelegate、runQueueService、workflowMultiInputService、
      workflowDirectTriggerService、goalCompletionGate、goalRuntime、
      streamingChatExecutor 與 runStore/runExecutionService。前端主要影響 run/
      workflow WebSocket event 型別、workflowEventHandlers、runStore 或聊天歷程
      顯示元件。測試需覆蓋 connection queue FIFO、Goal completed/blocked 才
      dequeue、runContext 必填、Direct 不 merge 多輪、歷程 divider 顯示。
