              - backend/src/services/chatEmitStrategy.ts
              - backend/src/services/claude/streamingChatExecutor.ts
              - backend/src/handlers/runHandlers.ts
              - backend/tests/business-logic/chatEmitStrategy.test.ts
              - backend/tests/business-logic/runHandlers.test.ts
              - backend/tests/business-logic/streamingChatExecutor.test.ts

      - id: P3.B
        title: 下游觸發時機
        tasks:
          - id: P3.B.t1
            text: 調整 `workflowExecutionService.onWorkflowChatComplete` 的順序，確保 Goal round divider 已完成持久化與廣播後，才觸發下游 workflow
            completed: true
            last_files_changed:
              - backend/tests/business-logic/streamingChatExecutor.test.ts
          - id: P3.B.t2
            text: 確認 `delegate.scheduleNextInQueue` 只會在 Goal completed 或 blocked 放行後執行，並以測試固定此順序
            completed: true
            last_files_changed:
