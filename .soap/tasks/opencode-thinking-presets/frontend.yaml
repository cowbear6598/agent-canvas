            text: 在 `frontend/src/stores/opencodeAliasStore.ts` 新增 `refreshPresets(id)` action，成功後以後端回傳 item 更新本地 alias 清單
            completed: false
            last_files_changed: []
          - id: P1.B.t3
            text: 更新 `frontend/tests/business-logic/stores/opencodeAliasStore.test.ts`，覆蓋 alias metadata 在 load、add、edit、reorder、refresh 後都會保留或更新
            completed: false
            last_files_changed: []

