        tasks:
          - id: P2.B.t1
            text: 檢查 `frontend/src/components/pod/PodSlots.vue` 與 `ThinkingPopover.vue` 的 OpenCode path，確認既有 provider/model 查詢會使用 OpenCode alias value 顯示 presets
            completed: false
            last_files_changed: []
          - id: P2.B.t2
