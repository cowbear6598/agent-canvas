            text: 更新 `frontend/src/stores/providerCapabilityStore.ts`，讓 `syncFromPayload` 即使遇到 opencode provider 也會從 `provider:list.availableModels` 建立 thinking metadata map
            completed: false
            last_files_changed: []
          - id: P2.A.t2
            text: 調整 `providerCapabilityStore.getAvailableModels("opencode")` 保持從 alias store 組 model 選單，但 thinking levels 由 provider list 的 metadata map 提供
            completed: false
            last_files_changed: []
          - id: P2.A.t3
            text: 更新 `providerCapabilityStore.getDefaultThinkingLevel` 與 `isThinkingSupportedForModel` 相關測試，覆蓋 OpenCode alias 有 presets 時 Thinking UI 會啟用
            completed: false
            last_files_changed: []

