feature: opencode-thinking-presets
approved: true
scenarios:
  - id: F1
    scenario: 使用者新增支援 thinking 的 OpenCode model
    given:
      - 使用者在 OpenCode 設定頁
      - OpenCode server 已啟動
      - 使用者選擇的 model 有官方 thinking 設定
    when:
      - 使用者新增 model alias
    then:
      - 系統建立 model alias
      - 系統保存該 model 的 thinking presets
      - 該 alias 會出現在 Pod model 選單

  - id: F2
    scenario: 使用者新增 OpenCode model 時官方設定無法取得
    given:
      - 使用者在 OpenCode 設定頁
      - OpenCode server 已啟動
      - 官方 model metadata 暫時無法取得
    when:
      - 使用者新增 model alias
    then:
      - 系統不建立 model alias
      - 系統顯示稍後再試的錯誤提示
      - OpenCode alias 清單維持原狀

  - id: F3
    scenario: 使用者在 Pod 選擇 OpenCode model 的 thinking preset
    given:
      - 使用者已建立 OpenCode model alias
      - 該 alias 已保存 thinking presets
      - 使用者正在編輯使用 OpenCode provider 的 Pod
    when:
      - 使用者選擇該 OpenCode model
      - 使用者打開 Thinking 選單
      - 使用者選擇其中一個 thinking preset
    then:
      - Pod 保存選到的 thinking preset
      - 後續執行會使用該 OpenCode model 的 thinking 設定

  - id: F4
    scenario: 使用者刷新既有 OpenCode model 的 thinking presets
    given:
      - 使用者在 OpenCode 設定頁
      - 使用者已建立 OpenCode model alias
      - OpenCode server 已啟動
    when:
      - 使用者對該 alias 執行刷新 thinking presets
    then:
      - 系統重新取得官方 model metadata
      - 系統更新該 alias 保存的 thinking presets
      - Pod Thinking 選單顯示更新後的選項
