feature: remove-restful-apis
approved: true
scenarios:
  - id: F1
    scenario: 使用者在畫布介面管理畫布
    given:
      - 使用者已進入應用程式
      - 使用者可操作畫布清單
    when:
      - 建立新畫布
      - 重新命名畫布
      - 刪除畫布
    then:
      - 每個操作都成功完成
      - 畫布清單立即更新
      - 使用者不需要重新整理頁面
  - id: F2
    scenario: 使用者在畫布內管理 Pod 與 Connection
    given:
      - 使用者已開啟一張畫布
      - 畫布內已有可操作的節點區域
    when:
      - 建立 Pod
      - 重新命名 Pod
      - 刪除 Pod
      - 建立 Connection
      - 更新 Connection
      - 刪除 Connection
    then:
      - 畫布內容立即更新
      - 使用者可持續編輯目前畫布
      - 畫面上不需要改走額外的操作流程
  - id: F3
    scenario: 使用者從 Workflow 入口 Pod 操作對話
    given:
      - 使用者已開啟一張含有 Workflow 的畫布
      - 使用者目前可對 Workflow 入口 Pod 輸入訊息
    when:
      - 發送訊息給 Workflow 入口 Pod
      - 在執行期間停止這次對話
    then:
      - 對話可正常開始
      - 停止操作可正常生效
      - 畫布上的執行狀態維持可觀察
  - id: F4
    scenario: 使用者繼續使用需要檔案傳輸的功能
    given:
      - 使用者已開啟可操作的畫布
      - 使用者需要處理本地檔案
    when:
      - 上傳附件到 Pod 對話
      - 下載 Pod 資料夾
      - 匯入本地 skill bundle
    then:
      - 這些功能都維持可用
      - 使用者不需要改變既有操作方式
  - id: F5
    scenario: 使用者繼續使用整合與重連相關能力
    given:
      - 使用者已設定整合服務或正在使用畫布連線
      - 系統需要處理外部事件或重新連線
    when:
      - 外部整合服務送出 webhook
      - 使用者在連線中斷後回到畫布
    then:
      - 整合流程維持可用
      - 使用者可重新回到既有工作狀態
      - 既有 integrations 不會因這次調整失效
