feature: remove-restful-apis
created: "2026-05-31"
approved: true
frontend:
  required: false
  reason: 前端 runtime 既有主要操作已走 WebSocket，這次決策也明確保留仍依賴 HTTP 的 5 條 `/api/*`，不需要新增或修改前端使用流程。
  evidence:
    - question.yaml Q2 確認前端 runtime 直接依賴的 HTTP 入口只有 `/api/bundles/import`、`/api/upload`、`/api/auth/redeem-reconnect-grant`、`/api/canvas/:id/pods/:podId/download`。
    - question.yaml Q6 確認上述仍依賴 HTTP 特性的 `/api/*` 需保留，不補 WebSocket，也不移除功能。
    - userflow.yaml F1 至 F4 都要求使用者既有畫布、Pod、Connection、Workflow 與檔案流程維持現況，不改操作方式。
backend:
  required: true
  reason: 需要從後端 router 與 handler 中移除已被 WebSocket 取代的 `/api/*` REST API，保留仍有用途的 HTTP 入口，並同步更新測試與程式內殘留的 REST 說明。
  evidence:
    - question.yaml Q4 明確列出 14 條已有 WebSocket 對應的 `/api/*` 可刪除路由，外加使用者確認可直接刪除的 `GET /api/canvas/:id/workflows`。
    - question.yaml Q5 確認刪除範圍只處理可被 WebSocket 取代的 `/api/*` REST API，webhook HTTP 入口需保留。
    - question.yaml Q3 確認 repo 內沒有可同步的 project skill 檔，因此本次同步範圍改為測試與程式內殘留的 REST 說明文字。
