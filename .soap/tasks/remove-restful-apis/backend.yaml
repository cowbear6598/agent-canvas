feature: remove-restful-apis
side: backend
approved: true
phases:
  - id: P1
    title: 收斂保留中的 HTTP 入口並移除冗餘 REST 路由
    parallel: true
    verification: []
    done: true
    items:
      - id: P1.A
        title: Route manifest 與 router 派送清理
        tasks:
          - id: P1.A.t1
            text: 更新 `backend/src/api/restRouteManifest.ts`，只保留 `GET /api/canvas/:id/pods/:podId/download`、`POST /api/bundles/import`、`POST /api/upload`、`POST /api/auth/redeem-reconnect-grant`、`POST /api/internal/integration-reply` 五條仍需存在的 `/api/*` 路由
            completed: true
            last_files_changed:
              - backend/src/api/restRouteManifest.ts
          - id: P1.A.t2
            text: 調整 `backend/src/api/apiRouter.ts` 與 `backend/src/index.ts` 相關派送邏輯，讓已移除的 `/api/canvas*`、`/api/workflows*`、`/api/connections*` REST 請求回到 404，而保留中的 `/api/*` 與 webhook HTTP 入口維持可用
            completed: true
            last_files_changed:
              - backend/src/api/apiRouter.ts
              - backend/src/index.ts
      - id: P1.B
        title: 刪除 REST-only handler 模組與殘留依賴
        tasks:
          - id: P1.B.t1
            text: 刪除 `backend/src/api/canvasApi.ts`、`backend/src/api/connectionApi.ts`、`backend/src/api/workflowApi.ts` 這些已完全失去用途的 REST handler 模組，並移除對應 import 與型別依賴
            completed: true
            last_files_changed:
              - backend/src/api/canvasApi.ts
              - backend/src/api/connectionApi.ts
              - backend/src/api/workflowApi.ts
          - id: P1.B.t2
            text: 收斂 `backend/src/api/podApi.ts` 只保留仍需存在的 HTTP 能力，移除已被 WebSocket 取代的 Pod REST handler 與其 REST 專用註解或 helper
            completed: true
            last_files_changed:
              - backend/src/api/podApi.ts

