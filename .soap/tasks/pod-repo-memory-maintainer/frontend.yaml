            text: 在 repository 右鍵選單或等效操作入口新增獨立的 `清除 Repo Memory` 操作，並與既有 repository 動作整合，同時讓前端可讀取 repository 的 `hasRepoMemory` 狀態
            completed: true
            last_files_changed:
              - frontend/src/types/repository.ts
              - frontend/src/types/websocket/events.ts
              - frontend/src/types/websocket/requests.ts
              - frontend/src/types/websocket/responses.ts
