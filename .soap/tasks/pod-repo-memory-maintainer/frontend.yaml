              - frontend/src/components/pod/CanvasPod.vue
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/en.json
              - frontend/src/locales/ja.json
              - frontend/tests/business-logic/components/pod/PodActions.test.ts
