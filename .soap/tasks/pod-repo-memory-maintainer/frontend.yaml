feature: pod-repo-memory-maintainer
side: frontend
approved: true
phases:
  - id: P1
    title: 全域 Memory 設定介面
    parallel: false
    verification:
      - bun run style
    done: true
    items:
      - id: P1.A
        title: Config 契約與 store 擴充
        tasks:
          - id: P1.A.t1
            text: 在 `frontend/src/types/websocket/requests.ts` 與 `frontend/src/types/websocket/responses.ts` 擴充 memory 全域設定欄位，至少覆蓋 `memoryProvider`、`memoryModel` 與 `memoryThinkingLevel`
            completed: true
            last_files_changed:
              - frontend/src/types/websocket/requests.ts
              - frontend/src/types/websocket/responses.ts
          - id: P1.A.t2
            text: 在 `frontend/src/services/configApi.ts`、`frontend/src/stores/configStore.ts` 與 `frontend/src/composables/useGlobalSettingsForm.ts` 串起 memory 設定的讀取、編輯與保存資料流，沿用既有 config:get / config:update 路徑
            completed: true
            last_files_changed:
              - frontend/src/services/configApi.ts
              - frontend/src/stores/configStore.ts
              - frontend/src/composables/useGlobalSettingsForm.ts
      - id: P1.B
        title: Global Settings Modal 控制項
        tasks:
          - id: P1.B.t1
            text: 在 `frontend/src/components/settings/GlobalSettingsModal.vue` 新增 memory provider、model 與 thinking level 的設定區塊，重用現有 provider 能力與模型選單元件風格
            completed: true
            last_files_changed:
              - frontend/src/components/settings/GlobalSettingsModal.vue
          - id: P1.B.t2
            text: 在 `frontend/src/locales/zh-TW.json`、`frontend/src/locales/en.json` 與 `frontend/src/locales/ja.json` 補齊 memory maintainer 全域設定所需文案
            completed: true
            last_files_changed:
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/en.json
              - frontend/src/locales/ja.json

