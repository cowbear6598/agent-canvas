feature: pod-repo-memory-maintainer
created: "2026-05-31"
approved: true
impact_classification:
  frontend:
    status: required
    evidence:
      - 使用者明確要求在全域設定中可設定 memory 使用的 provider、model 與 thinking level。
      - 使用者明確要求 pod 右鍵選單可啟用或停用 memory 系統，並在刪除 pod / repo 時加入二次提醒。
  backend:
    status: required
    evidence:
      - 使用者明確要求 memory 維護走一次性的 disposable agent task，且需要類似 MCP 的工具輸出與驗證能力。
      - 使用者明確要求 pod-memory、repo-memory、背景 job、重試與 7 天清理策略，屬於伺服器端資料模型與排程邏輯改動。
questions:
  - id: Q1
    text: 現有 disposable chat 抽象與各 provider 的一次性查詢能力，是否已支援工具 / MCP 型任務？若不足，最可能需要動哪些層？
    type: codebase-investigation
    completed: true
    answer: |
      目前 `backend/src/services/disposableChatService.ts` 只抽象「一次性無狀態、純文字輸出」查詢，
      對外介面只有 `provider / model / systemPrompt / userMessage / workspacePath / thinkingLevel`，
      沒有工具宣告、工具回呼或結構化結果驗證能力。Claude 的
      `backend/src/services/claude/claudeService.ts` 內 `executeDisposableChat()` 明確把
      `allowedTools` 設成空陣列；Codex 的 `backend/src/services/codex/codexService.ts`
      `executeDisposableChat()` 也是單次 subprocess prompt，不支援工具契約。OpenCode disposable
      路徑雖然底層是 provider chat，但在 `disposableChatService.ts` 會把 `mcpEntries` 清空，
      只收斂文字事件。若要支援 Memory Maintainer 這種可帶工具的一次性任務，最自然的落點是
      擴充 disposable chat family：保留現有純文字 `executeDisposableChat()` 給 summary /
      branch decide，另外新增帶 tools / validation contract 的 disposable agent task，
      並擴充 provider 層的一次性任務介面，而不是直接把現有純文字介面塞胖。

  - id: Q2
    text: 現有全域設定從後端 `global_settings` 到前端 Global Settings Modal 的資料流是什麼？若新增 memory provider / model / thinkingLevel，會碰哪些檔案？
    type: codebase-investigation
    completed: true
    answer: |
      現有全域設定後端主入口是 `backend/src/services/configStore.ts`，目前只管理
      `timezone_offset`、backup 相關欄位與 workspace password 狀態；WebSocket 讀寫入口在
      `backend/src/handlers/configHandlers.ts`，schema 與 payload 型別在
      `backend/src/schemas/configSchemas.ts`。前端透過 `frontend/src/services/configApi.ts`
      走 `config:get` / `config:update` WebSocket 請求，Pinia 狀態在
      `frontend/src/stores/configStore.ts`，表單組裝與保存流程在
      `frontend/src/composables/useGlobalSettingsForm.ts`，UI 在
      `frontend/src/components/settings/GlobalSettingsModal.vue`。若新增 memory provider / model /
      thinkingLevel，需同步擴充上述後端 config store、config handler、schema、前端 config API、
      config store、global settings form 與 Global Settings Modal；若 model / thinkingLevel
      要沿用現有 provider 能力清單，前端還要重用 `providerCapabilityStore` 與現有模型 / thinking
      選單元件。

  - id: Q3
    text: 現有啟動流程與背景服務是否已有可掛「啟動時先清一次」與「每天排程清理一次」的入口？
    type: codebase-investigation
    completed: true
    answer: |
      有。伺服器啟動入口在 `backend/src/services/startupService.ts`，`initialize()` 會先建立目錄、
      初始化 DB，再呼叫 `startBackgroundServices()` 與 `startOrphanRunRepoCleanup()`。目前背景服務已經有
      `scheduleService`、`backupScheduleService` 與 `tmpCleanupService`，代表系統已有常駐排程模式；
      另外 `startOrphanRunRepoCleanup()` 透過 `queueMicrotask()` 在啟動後立即跑一次清理，
      這正好可作為 memory 維護紀錄「開機先清一次」的掛點。新功能可比照：新增 memory cleanup /
      maintenance service，在 startup initialize 中先觸發一次 prune，再用 daily interval
      或既有排程模式每天清 7 天前的維護紀錄。

  - id: Q4
    text: 現有 pod / repo 刪除流程與 UI 確認點在哪裡？repo 是否已在被 pod 使用時禁止刪除？
    type: codebase-investigation
    completed: true
    answer: |
      Pod 刪除 UI 目前在 `frontend/src/components/pod/PodActions.vue`，只有一層確認 dialog；
      確認後前端 store 送出刪除請求，後端由 `backend/src/handlers/podHandlers.ts` 呼叫
      `deletePodWithCleanup()` 清掉 notes、connections、workspace 與 pod row。Repository 刪除則走
      `frontend/src/stores/note/repositoryStore.ts` 與 `backend/src/handlers/repositoryHandlers.ts`
      的 `handleRepositoryDelete()`；共用的後端刪除守門在
      `backend/src/utils/handlerHelpers.ts` 的 `handleResourceDelete()`，它會先檢查
      `findPodsUsing()`，只要還有 pod 綁該 repository，就直接回 `IN_USE`，不允許刪除。
      這代表本次若要加 memory 二次提醒：pod 刪除只需在現有前端 dialog 基礎上再加一層
      「此 pod 有記憶」確認；repo 刪除也只需針對 repo memory 做二次提醒，不必再處理
      「仍有 pod 綁定 repo」這條共享分支，因為現行後端已經禁止刪除。

  - id: Q5
    text: Memory Maintainer 所需的 evidence pack，現有系統已經持久化了哪些資料可直接重用？
    type: codebase-investigation
    completed: true
    answer: |
      現有 run persistence 已經足夠組 evidence pack，不需要再做第二套 transcript storage。
      `backend/src/services/runStore.ts` 的 `RunPodInstance` 已持久化 `sessionId`、
      `lastResponseSummary`、`workspacePath / runRepoPath` 與 pod status；`RunMessage`
      已持久化訊息本文、metadata 與 `subMessages`，其中 tool traces 就掛在
      `subMessages.toolUse`。另外 `backend/src/services/claude/streamingLifecycleCoordinator.ts`
      在每次 turn 完成時會把 assistant 內容收斂成 `lastResponseSummary`，而
      `backend/src/services/workflow/runTranscriptWindow.ts` 已封裝「persistedSummary +
      recentMessages」的讀法。這表示 Memory Maintainer 的 evidence pack 可以直接重用：
      runId、podId、repositoryId、最近 N 則 run messages、tool submessages、`lastResponseSummary`
      與是否有 repo 綁定；不應再把整份 prompt、完整 transcript 副本或工具原文另存一份到
      memory tables。
  - id: Q6
    text: 「停用 memory」與「清除 memory」已決定分開後，pod memory 與 repo memory 的清除入口各要放在哪裡？
    type: user-input
    completed: true
    answer: |
      Pod memory 除了獨立清除入口外，刪除 pod 時若已有 pod memory，也要跳二次確認。
      Repo memory 除了獨立清除入口外，刪除 repo 時若已有 repo memory，也要跳二次確認。
