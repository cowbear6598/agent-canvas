            completed: true
            last_files_changed:
              - backend/src/services/disposableChatService.ts
              - backend/src/services/memoryMaintainerService.ts
      - id: P2.B
        title: Memory Maintainer 兩階段流程
        tasks:
          - id: P2.B.t1
            text: 實作 pod-memory 與 repo-memory 共用的 evidence pack 組裝流程，重用 run persistence 的 `lastResponseSummary`、recent messages、tool traces 與 repository 綁定資訊
            completed: true
            last_files_changed:
              - backend/src/services/memoryMaintainerService.ts
          - id: P2.B.t2
            text: 實作 Candidate Builder phase，讓 maintainer 依 evidence pack 產生 pod / repo 候選記憶，並把 observation 與判斷結果寫入維護紀錄
            completed: true
            last_files_changed:
              - backend/src/services/memoryMaintainerService.ts
          - id: P2.B.t3
