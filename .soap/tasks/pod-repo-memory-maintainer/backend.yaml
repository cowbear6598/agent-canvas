        title: 一次性 agent task 抽象
        tasks:
          - id: P2.A.t1
            text: 以現有 `disposableChatService` 為基礎擴充一次性 agent task 抽象，讓 Claude、Codex 與 OpenCode 的 disposable 路徑可宣告工具與接收結構化結果
            completed: true
            last_files_changed:
              - backend/src/services/shared/disposableChatTypes.ts
              - backend/src/services/disposableChatService.ts
          - id: P2.A.t2
