              - backend/src/services/configStore.ts
              - backend/src/handlers/configHandlers.ts
              - backend/src/schemas/configSchemas.ts
          - id: P1.A.t2
            text: 在前後端共享的 config payload 契約中補齊 memory 設定欄位，確保 config:get / config:update 可讀寫完整的 memory maintainer 模型參數
            completed: true
            last_files_changed:
              - frontend/src/types/websocket/requests.ts
              - frontend/src/types/websocket/responses.ts
              - frontend/src/types/config.ts
