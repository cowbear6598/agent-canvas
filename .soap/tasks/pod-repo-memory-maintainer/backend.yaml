            completed: true
            last_files_changed:
              - backend/src/services/memoryStateService.ts
          - id: P1.B.t3
            text: 擴充 pod / repository 的 payload 與查詢流程，讓前端可取得 `memoryEnabled`、`hasPodMemory` 與 `hasRepoMemory` 等狀態，以支援右鍵選單入口與刪除前二次確認
            completed: true
            last_files_changed:
              - backend/src/handlers/repositoryCloneHandlers.ts
              - backend/src/services/podStore.ts
              - backend/src/services/repositoryService.ts
              - backend/src/types/pod.ts
              - backend/src/types/repository.ts
              - backend/src/types/responses/repository.ts
