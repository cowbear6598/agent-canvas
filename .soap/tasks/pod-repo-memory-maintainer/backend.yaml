    parallel: false
    verification: []
    done: true
    items:
      - id: P1.A
        title: Global Settings 與 schema 擴充
        tasks:
          - id: P1.A.t1
            text: 在 `backend/src/services/configStore.ts`、`backend/src/handlers/configHandlers.ts` 與 `backend/src/schemas/configSchemas.ts` 擴充 memory 專用的 `provider`、`model` 與 `thinkingLevel` 設定欄位
