            text: 在後端資料庫 schema 與 statements 新增 `pod_memory_states`、`repo_memory_states`、`memory_jobs` 與 `memory_observations` 所需資料結構，區分正式 summary 與 7 天維護紀錄，並明確保存 pod 的 `memoryEnabled` 與 memory summary 存在性
            completed: true
            last_files_changed:
              - backend/src/database/index.ts
              - backend/src/database/schema.ts
              - backend/src/database/statements.ts
