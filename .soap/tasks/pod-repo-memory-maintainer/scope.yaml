feature: pod-repo-memory-maintainer
created: "2026-05-31"
approved: true
frontend:
  required: true
  reason: 需要新增全域 memory 模型設定、pod 與 repository 的 memory 操作入口，以及清除 / 刪除時的多段確認互動。
  evidence:
    - question.yaml Q2 確認現有全域設定已有完整的前後端資料流，可擴充 memory 專用 provider / model / thinkingLevel。
    - question.yaml Q4 確認 pod 刪除 UI 與 repository 刪除流程目前只有原始刪除確認，需新增 memory 二次提醒。
    - question.yaml Q6 確認 pod memory 與 repo memory 都需要獨立清除入口，且刪除 pod / repo 時若已有記憶也要二次確認。
    - userflow.yaml F1、F2、F2b、F5、F6、F7、F8 都直接描述使用者在設定、右鍵選單、停用、主動清除與刪除流程中的可見操作。
backend:
  required: true
  reason: 需要新增 pod-memory / repo-memory 的持久化、背景維護 job、disposable agent task 擴充，以及啟動與每日清理機制。
  evidence:
    - question.yaml Q1 確認現有 disposable chat 只支援純文字輸出，若要做 Memory Maintainer 必須擴充成帶工具與驗證契約的一次性任務。
    - question.yaml Q3 確認現有 startup 與背景服務已有可掛啟動即清理與每日排程清理的入口。
    - question.yaml Q5 確認 run persistence 已提供 `lastResponseSummary`、recent messages 與 tool traces，可直接組成 maintainer 的 evidence pack。
    - userflow.yaml F2b 要求停用 pod memory 後保留 summary 但停止注入與維護，代表後端必須明確區分 disable 與 clear 語意。
    - userflow.yaml F3 與 F4 都要求 pod 完成整體任務後，由系統在背景維護 pod-memory，並依是否有檔案讀寫決定 repo-memory 是否更新。
