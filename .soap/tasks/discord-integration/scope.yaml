feature: discord-integration
created: "2026-06-05"
approved: true
frontend:
  required: true
  reason: 需要讓使用者在既有 integration 介面中建立 Discord App、選擇可綁定的 Discord 頻道，並把 Pod 綁到指定頻道。
  evidence:
    - question.yaml Q2 確認 Discord 若要進入現有 UI，必須新增 provider config、icon 與多語系文案。
    - userflow.yaml F1 描述使用者要在介面中建立 Discord Integration App。
    - userflow.yaml F2 描述使用者要在介面中選擇指定的 Discord 頻道並完成綁定。
backend:
  required: true
  reason: 需要新增 Discord provider，處理 Bot 初始化、頻道資源同步、mention 事件接收，以及像 Slack 一樣的 reply MCP 回覆。
  evidence:
    - question.yaml Q1 確認 integration provider 的初始化、事件正規化與回覆送出都在後端 provider 架構中實作。
    - question.yaml Q4 確認 Discord 需求是被標記 Bot 後觸發 Agent，並且要能回覆原本的 Discord 對話。
    - question.yaml Q5 確認本次不做 thread 全歷史，但仍要維持最小 reply context 模式。
    - userflow.yaml F3 描述系統必須接收 Discord mention 事件並回覆。
    - userflow.yaml F4 描述只有綁定頻道內的事件才可觸發 Pod。
