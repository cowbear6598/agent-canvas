feature: discord-integration
approved: true
scenarios:
  - id: F1
    scenario: 使用者建立 Discord Integration App
    given:
      - 使用者已開啟 Discord integration 管理介面
      - 使用者已準備好 Discord Bot 所需的連線設定
    when:
      - 輸入 Discord App 名稱
      - 輸入 Discord Bot 的必要憑證
      - 送出建立操作
    then:
      - 系統建立一個新的 Discord Integration App
      - 使用者可以在 integration 清單看到這個 App
      - 系統顯示這個 App 的連線狀態

  - id: F2
    scenario: 使用者將 Pod 綁定到指定的 Discord 頻道
    given:
      - 使用者已有一個可用的 Discord Integration App
      - 該 Discord Integration App 已取得可綁定的頻道清單
      - 使用者正在設定某個 Pod 的 integration 綁定
    when:
      - 選擇 Discord Integration App
      - 選擇一個指定的 Discord 頻道
      - 確認綁定
    then:
      - 系統將該 Pod 綁定到選定的 Discord 頻道
      - 後續只有該頻道的 Discord 事件會觸發這個 Pod
      - 使用者重新開啟綁定介面時可以看到既有的 Discord 綁定

  - id: F3
    scenario: 使用者在綁定的 Discord 頻道標記 Bot 後收到 Agent 回覆
    given:
      - 某個 Pod 已綁定到指定的 Discord 頻道
      - Discord Bot 已成功連線
      - 使用者在該 Discord 頻道內可以標記這個 Bot
    when:
      - 使用者在綁定的 Discord 頻道標記 Bot
      - 使用者送出要交給 Agent 的訊息
    then:
      - 系統接收到這次 Discord mention 事件
      - 系統將這則訊息交給對應的 Pod 執行
      - Discord 對話中會收到 Agent 的回覆

  - id: F4
    scenario: 使用者在未綁定的 Discord 頻道標記 Bot 不會觸發 Pod
    given:
      - 某個 Pod 只綁定到特定的 Discord 頻道
      - Discord Bot 已成功連線
      - 使用者位於另一個未綁定的 Discord 頻道
    when:
      - 使用者在這個未綁定的 Discord 頻道標記 Bot
      - 使用者送出訊息
    then:
      - 系統不會把這則訊息交給該 Pod
      - 已綁定頻道以外的對話不會誤觸發這個 Pod
