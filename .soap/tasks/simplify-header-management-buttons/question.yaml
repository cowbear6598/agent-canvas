feature: simplify-header-management-buttons
created: "2026-06-06"
approved: true
impact_classification:
  frontend:
    status: required
    evidence:
      - 使用者明確要求簡化 header 上的按鈕功能，並把「全域設定 / 整合服務」搬進「整合管理中心」。
      - 使用者明確要求調整整合管理中心的分組方式、加入 divider，並重新整理「LLM Provider -> OpenCode」的呈現。
      - 使用者明確要求移除 MCP 管理與 Model 設定中的多段說明文，且指定設定框內不要再重複顯示標題與說明。
  backend:
    status: unlikely
    evidence:
      - 需求只描述 header 入口、modal 分組、文案移除與既有設定畫面的重排，沒有要求新增或修改 websocket API、資料儲存、驗證或 runtime 邏輯。
      - 現有前端已經分別掛載 `GlobalSettingsModal`、`IntegrationSelectModal`、`ManagedMcpModal`、`ManagedPluginModal`、`LlmProviderModal`、`ModelSettingsModal`，MCP 狀態與 Model 設定資料來源也都已存在。
questions:
  - id: Q1
    text: 現有 header 上與這次需求相關的入口按鈕、modal 掛載與 hub 導流是怎麼接的？
    type: codebase-investigation
    completed: true
    answer: |
      `frontend/src/components/layout/AppHeader.vue` 目前有三個直接相關按鈕：
      1. `layout.header.globalSettings` 開 `GlobalSettingsModal`
      2. `layout.header.integrationsHub` 開 `IntegrationsHubModal`
      3. `layout.header.integrations` 開 `IntegrationSelectModal`

      同一個 header 元件也已經直接掛載所有相關 modal，包含 `ManagedMcpModal`、`ManagedPluginModal`、`LlmProviderModal`、`ModelSettingsModal`。`IntegrationsHubModal` 目前透過 emit 導去 MCP / Skill / LLM Provider / Model Settings 四個子 modal，因此這次把「全域設定 / 整合服務」搬進 hub，屬於前端入口重組。

  - id: Q2
    text: 現有整合管理中心能否直接擴充成分組式入口，並承接「全域設定 / 整合服務 / MCP / Skill / Model 設定 / OpenCode」？
    type: codebase-investigation
    completed: true
    answer: |
      可以。`frontend/src/components/settings/IntegrationsHubModal.vue` 目前是單一 grid 卡片列表，已經有 emit 機制可開啟子 modal。只要新增對應的 emit 與分組 UI，就能把既有的 `GlobalSettingsModal`、`IntegrationSelectModal`、`ManagedMcpModal`、`ManagedPluginModal`、`ModelSettingsModal`、`LlmProviderModal` 整合進同一個 hub，不需要新增後端能力。

      另外 `frontend/src/components/settings/LlmProviderModal.vue` 目前本來就只有 `home -> opencode` 這一條路徑，首頁也只有一張 opencode 卡片，所以「LLM Provider -> OpenCode 然後自己一組」可視為 hub 入口分組與命名上的前端調整。

  - id: Q3
    text: MCP 管理目前是否已經顯示 transport 與最近一次 runtime 狀態，這次是否只需移除說明文？
    type: codebase-investigation
    completed: true
    answer: |
      是。`frontend/src/components/settings/managedMcp/McpEditForm.vue` 在編輯既有 entry 時，已經用 badge 顯示 `transport` 與 `status`，`frontend/src/components/settings/managedMcp/McpRegistryList.vue` 也會在列表顯示每個 entry 的 `status`。對應說明文來自 `frontend/src/locales/*.json` 的 `managedMcp.form.editDescription`，內容就是「這裡顯示全域 registry entry 的 transport 與最近一次 runtime 狀態。」因此這一項屬於前端文案移除。

  - id: Q4
    text: Model 設定目前有哪些重複說明，這次是否只需保留選類別與底下欄位本身？
    type: codebase-investigation
    completed: true
    answer: |
      是。`frontend/src/components/settings/ModelSettingsModal.vue` 目前有三層重複資訊：
      1. modal header 的 `modelSettings.description`
      2. 類別切換按鈕上的 `modelSettings.category.memory.description` 與 `modelSettings.category.connectionLine.description`
      3. 內容框內再次顯示同一組 category title 與 description

      使用者要求移除 modal header 說明、Memory/Connection Line 的說明文，且設定框內不要再重複顯示標題與說明；這表示 UI 可以改成只保留類別切換與底下 provider / model / thinking level 欄位，屬於前端版面與 i18n 文案調整。

  - id: Q5
    text: 這次需求是否牽涉新的 API 或資料格式調整？
    type: codebase-investigation
    completed: true
    answer: |
      目前沒有證據顯示需要。`GlobalSettingsModal` 仍走既有 config API，`ModelSettingsModal` 仍走既有 `getConfig` / `updateConfig` 與 `providerCapabilityStore`，`IntegrationSelectModal` 仍讀前端 provider registry，`ManagedMcpModal` 與 `ManagedPluginModal` 也已具備各自資料流。需求描述的是入口整併、分組與說明文字移除，Discover 階段可先判定為純前端變更。
