feature: simplify-header-management-buttons
approved: true
scenarios:
  - id: F1
    scenario: 使用者從 header 進入整合管理中心查看集中入口
    given:
      - 使用者正在使用畫布頁面
      - header 上保留整合管理中心入口
    when:
      - 點擊整合管理中心按鈕
    then:
      - 開啟整合管理中心
      - 使用者看到分組後的管理入口
      - 使用者不會看到原本的整合管理中心說明文字

  - id: F2
    scenario: 使用者從整合管理中心開啟全域設定或整合服務管理
    given:
      - 使用者已開啟整合管理中心
      - 整合管理中心內有全域設定與整合服務管理分組
    when:
      - 點擊全域設定入口
      - 重新開啟整合管理中心
      - 點擊整合服務管理入口
    then:
      - 系統開啟全域設定視窗
      - 系統開啟整合服務管理視窗
      - 使用者不需要回到 header 尋找這兩個功能

  - id: F3
    scenario: 使用者從整合管理中心查看 MCP、Skill、Model 設定分組
    given:
      - 使用者已開啟整合管理中心
      - 整合管理中心以 divider 分出不同群組
    when:
      - 查看 MCP 管理
      - 查看 Skill 管理
      - 查看 Model 設定
    then:
      - 使用者可以清楚辨識這三個入口屬於同一組
      - 分組之間有明確的視覺區隔

  - id: F4
    scenario: 使用者在 MCP 管理查看既有項目狀態
    given:
      - 使用者從整合管理中心開啟 MCP 管理
      - MCP 清單中已有既有項目
    when:
      - 選取任一 MCP 項目
    then:
      - 使用者看得到該項目的 transport
      - 使用者看得到該項目的最近狀態
      - 使用者不會看到原本的說明文字

  - id: F5
    scenario: 使用者在 Model 設定切換不同設定類別
    given:
      - 使用者從整合管理中心開啟 Model 設定
      - Model 設定內可切換 Memory 與 Connection Line
    when:
      - 切換不同設定類別
      - 查看底下的設定欄位
    then:
      - 使用者看得到對應類別的 Provider、Model 與 Thinking Level 欄位
      - 使用者不會看到原本的整體說明文字
      - 使用者不會看到內容框內重複的標題與說明

  - id: F6
    scenario: 使用者從整合管理中心進入 OpenCode 設定
    given:
      - 使用者已開啟整合管理中心
      - 整合管理中心內有獨立的 OpenCode 分組
    when:
      - 點擊 OpenCode 入口
    then:
      - 系統開啟 OpenCode 相關設定視窗
      - 使用者能理解這個入口與其他分組是分開管理
