feature: simplify-header-management-buttons
side: frontend
approved: true
phases:
  - id: P1
    title: Header 入口與整合管理中心重整
    parallel: false
    verification:
      - bun run style
      - bun run test
    done: true
    items:
      - id: P1.A
        title: Header 按鈕精簡與 modal 導流
        tasks:
          - id: P1.A.t1
            text: 調整 `frontend/src/components/layout/AppHeader.vue`，移除 header 上直接開啟全域設定與整合服務管理的按鈕，只保留整合管理中心入口，並保留既有 modal 掛載能力。
            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue
          - id: P1.A.t2
            text: 在 `AppHeader.vue` 新增整合管理中心內部導流 handler，讓 hub 可以開啟 `GlobalSettingsModal`、`IntegrationSelectModal`、`ManagedMcpModal`、`ManagedPluginModal`、`ModelSettingsModal` 與 `LlmProviderModal`，同時清掉不再需要的舊 handler 與狀態命名。
            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue
              - frontend/src/components/integration/IntegrationSelectModal.vue
              - frontend/src/components/integration/IntegrationAppsModal.vue
              - frontend/src/components/settings/GlobalSettingsModal.vue
              - frontend/src/components/settings/ManagedMcpModal.vue
              - frontend/src/components/settings/ManagedPluginModal.vue
              - frontend/src/components/settings/ModelSettingsModal.vue
              - frontend/src/components/settings/LlmProviderModal.vue
              - frontend/src/components/ui/ModalBackButton.vue
      - id: P1.B
        title: 整合管理中心分組與命名
        tasks:
          - id: P1.B.t1
            text: 重做 `frontend/src/components/settings/IntegrationsHubModal.vue` 的版面，新增「全域設定 / 整合服務管理」群組、「MCP / Skill / Model 設定」群組，以及獨立的 OpenCode 群組，使用 divider 明確區隔。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/IntegrationsHubModal.vue
          - id: P1.B.t2
            text: 更新 `IntegrationsHubModal.vue` 的 emit 介面與卡片 click 流程，讓「LLM Provider」入口改名為 OpenCode，並補上開啟全域設定與整合服務管理的 emit。
            completed: true
            last_files_changed:
              - frontend/src/components/layout/AppHeader.vue
              - frontend/src/components/settings/IntegrationsHubModal.vue
              - frontend/src/components/settings/LlmProviderModal.vue
          - id: P1.B.t3
            text: 更新 `frontend/src/locales/zh-TW.json`、`frontend/src/locales/en.json`、`frontend/src/locales/ja.json` 中 header 與整合管理中心相關文案，移除 hub 說明文字，補齊新分組標題與 OpenCode 命名，並刪除不再使用的 key。
            completed: true
            last_files_changed:
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/en.json
              - frontend/src/locales/ja.json

  - id: P2
    title: MCP 與 Model 設定畫面精簡
    parallel: true
    verification:
      - bun run style
      - bun run test
    done: true
    items:
      - id: P2.A
        title: MCP 管理說明文清理
        tasks:
          - id: P2.A.t1
            text: 調整 `frontend/src/components/settings/managedMcp/McpEditForm.vue`，移除編輯既有 entry 時顯示的說明段落，保留 transport、status 與錯誤資訊區塊。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/managedMcp/McpEditForm.vue
          - id: P2.A.t2
            text: 更新三個 locale 檔的 `managedMcp.form.editDescription` 與相關文案引用，避免畫面殘留已刪除的說明 key。
            completed: true
            last_files_changed:
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/en.json
              - frontend/src/locales/ja.json
      - id: P2.B
        title: Model 設定版面簡化
        tasks:
          - id: P2.B.t1
            text: 調整 `frontend/src/components/settings/ModelSettingsModal.vue`，移除 modal header 的整體說明文字，保留 Memory 與 Connection Line 類別切換與既有欄位載入/儲存流程。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/ModelSettingsModal.vue
          - id: P2.B.t2
            text: 簡化 `ModelSettingsModal.vue` 的類別切換卡片與內容區，移除 Memory / Connection Line 的說明文，以及內容框內重複出現的類別標題與說明，讓設定欄位直接承接目前選取的類別。
            completed: true
            last_files_changed:
              - frontend/src/components/settings/ModelSettingsModal.vue
          - id: P2.B.t3
            text: 更新三個 locale 檔的 `modelSettings.description`、`modelSettings.category.memory.description`、`modelSettings.category.connectionLine.description` 與相關顯示字串，確保 i18n 與新 UI 結構一致。
            completed: true
            last_files_changed:
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/en.json
              - frontend/src/locales/ja.json

  - id: P3
    title: 使用者流程驗證與回歸覆蓋
    parallel: false
    verification:
      - bun run style
      - bun run test
    done: true
    items:
      - id: P3.A
        title: 整合管理中心導流 user flow
        tasks:
          - id: P3.A.t1
            text: 在 `frontend/tests/userflows/settings/` 新增或擴充整合管理中心 user flow 測試，覆蓋 header 只保留 hub 入口、hub 內可開啟全域設定、整合服務管理、MCP、Skill、Model 設定與 OpenCode 的導流行為。
            completed: true
            last_files_changed:
              - frontend/tests/userflows/settings/integrationsHubFlow.test.ts
          - id: P3.A.t2
            text: 更新相關測試 helper，使 user flow 測試沿用真實的 `AppHeader.vue`、`IntegrationsHubModal.vue` 與既有 store 狀態流；若需要隔離測試邊界，只 stub dialog shell 這類測試環境包裝層，不直接 mock Vue、Pinia 或 hub 內部導流 handler。
            completed: true
            last_files_changed:
              - frontend/tests/userflows/settings/integrationsHubFlow.test.ts
      - id: P3.B
        title: Model 設定回歸測試
        tasks:
          - id: P3.B.t1
            text: 調整 `frontend/tests/business-logic/components/settings/ModelSettingsModal.test.ts`，沿用既有 `@/services/configApi` wrapper mock 與真實 `useProviderCapabilityStore` 狀態流，讓測試對齊簡化後的 UI 結構，持續驗證 Memory 與 Connection Line 切換時的 provider、model、thinking level 狀態與儲存條件。
            completed: true
            last_files_changed:
              - frontend/tests/business-logic/components/settings/ModelSettingsModal.test.ts
