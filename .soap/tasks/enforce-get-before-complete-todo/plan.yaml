description: >
  Goal Runtime 目前會在 Complete Todo 後立即把 active todo 推進到下一項，卻沒有
  保存或驗證 AI 是否曾讀取該項目，因此一次 Get 後可以連續完成多個 Todo。需要讓
  每次完成動作只對透過 get_active_goal_todo 明確讀取的 active todo 有效，確保
  Agent 知道該做什麼後才能判斷是否完成，避免進度回報與實際工作項目脫節。
goal:
  - 確保每次 Complete Todo 只在 AI 已透過 get_active_goal_todo 讀取目前 active todo 後才會成功。
  - 保持 get_goal_status 為完整進度與除錯查詢，不讓它取得 Complete Todo 資格。
  - 完成一項 Todo 後立即消耗已讀取狀態，防止一次讀取授權連續完成後續項目。
  - 拒絕完成與最近讀取項目不一致的 Todo，確保只能完成 Agent 實際取得的 active todo。
  - 未按順序呼叫時保留既有 Goal 進度，並回傳可引導 AI 先讀取 Todo 的 zh-TW 錯誤。
  - 讓既有的 run-scoped Goal Runtime snapshot 在新增讀取狀態後仍可正常載入與正規化。
  - 讓初始引導、重試提醒與 MCP 工具說明一致呈現 Get 與 Complete 的交替契約。
related:
  - backend/src/services/goalRuntime.ts
  - backend/src/services/mcp/goalMcpBridge.ts
  - backend/src/services/provider/mcpBootstrapPrompt.ts
  - backend/src/services/goalCompletionGate.ts
  - backend/tests/business-logic/goalRuntime.test.ts
  - backend/tests/business-logic/goalCompletionGate.test.ts
  - backend/tests/business-logic/runClaudeQuery.test.ts
  - backend/tests/business-logic/opencodeProvider.test.ts
  - backend/tests/business-logic/codexProvider.test.ts
verify:
  - cd backend && bun run test -- tests/business-logic/goalRuntime.test.ts tests/business-logic/goalCompletionGate.test.ts tests/business-logic/runClaudeQuery.test.ts tests/business-logic/opencodeProvider.test.ts tests/business-logic/codexProvider.test.ts
