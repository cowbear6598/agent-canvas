feature: scrollbar-and-gpt-mini-cleanup
created: "2026-05-27"
approved: true

questions:
  - id: Q1
    text: 目前 frontend 中 scrollbar 樣式是怎麼定義的？是否有 dark mode？scroll-area 內 thumb 的樣式細節為何？哪些組件使用 custom scrollbar、哪些用瀏覽器預設？
    type: codebase-investigation
    completed: true
    answer: |
      主要 scrollbar 樣式集中在三個檔案：

      1. frontend/src/assets/styles/doodle/scrollbar.css（核心嫌疑檔案）
         - .doodle-scrollbar-thumb：
             background: oklch(0.88 0.1 90)
             border: 2px solid oklch(0.4 0.02 50)  ← 深灰邊（接近黑）
             box-shadow: 1px 1px 0 oklch(0.4 0.02 50)  ← 深灰硬陰影（接近黑）
             transform: rotate(0.5deg)  ← 旋轉建立 composite layer
             transition: all 0.15s ease  ← thumb 位置改變時觸發 transition
         - .doodle-scrollbar-thumb:hover：
             transform: rotate(-0.5deg) scale(1.05)
             box-shadow: 2px 2px 0 oklch(0.4 0.02 50)  ← hover 時陰影更大
         - 另有 .doodle-textarea-scrollbar（textarea 專用，配色 / 結構與上同）
         - 檔內有 .dark .doodle-scrollbar-thumb 規則，但專案實際未啟用 dark mode（root 上不會掛 .dark class），此段規則永遠不會被觸發，dark mode 不是本 bug 來源

      2. frontend/src/components/ui/scroll-area/ScrollBar.vue
         - Shadcn ScrollArea 的 ScrollBar 元件
         - vertical 軌道套 .doodle-scrollbar-track，thumb 套 .doodle-scrollbar-thumb
         - 來源是 reka-ui 的 ScrollAreaScrollbar + ScrollAreaThumb

      3. frontend/src/assets/styles/doodle/menus.css（line 71-88）
         - .pod-menu-submenu-scrollable 自帶 inline ::-webkit-scrollbar 規則
         - 此區塊與本次 bug 不直接相關（樣式較單純，且非 ScrollArea）

      其他組件用 overflow-y-auto 但沒套 custom scrollbar class（屬瀏覽器預設，不在嫌疑範圍）：
         - frontend/src/components/chat/ToolOutputModal.vue (line 70)
         - frontend/src/components/chat/ChatModal.vue (line 152, .doodle-textarea)
         - frontend/src/components/ui/select/SelectContent.vue

      根因強假設（待實作驗證）：
         .doodle-scrollbar-thumb 的 transform: rotate(...) 會把 thumb 推上獨立的 composite layer；
         配合接近黑的 box-shadow（oklch(0.4 0.02 50)）與 transition: all 0.15s，
         在捲動時 thumb 位置變化過程的中間幀（rotate 旋轉 + box-shadow 位移）可能在 ScrollArea
         內部留下未被清掉的 box-shadow 像素，呈現為「滑動時 scroll area 區域出現幾條黑色條紋」。
         需於實作時實測「拿掉 transform」「拿掉 box-shadow」「拿掉 transition」三種變因獨立驗證。

  - id: Q2
    text: 「GPT 5.4 mini」在 codebase 中具體出現在哪些位置？是 backend 還是 frontend？
    type: codebase-investigation
    completed: true
    answer: |
      主要在 backend，frontend 透過 API 取得：

      1. backend/src/services/provider/capabilities.ts（主要來源，需編輯）
         - Line 20：CODEX_AVAILABLE_MODELS 陣列含 { label: "GPT-5.4-mini", value: "gpt-5.4-mini" }
         - Lines 67-70：CODEX_MODEL_THINKING_LEVELS 物件含 "gpt-5.4-mini" 設定（levels: low/medium/high/xhigh, default: medium）

      2. frontend/tests/business-logic/stores/providerCapabilityStore.test.ts
         - Line 282：test 期望陣列含 { label: "GPT-5.4 Mini", value: "gpt-5.4-mini" }

      3. backend 多個測試以 "gpt-5.4-mini" 作為 mock 值：
         - backend/tests/business-logic/disposableChatService.test.ts (line 72)
         - backend/tests/business-logic/streamingChatExecutor.test.ts (line 75)
         - backend/tests/business-logic/providerHandlersOpencode.test.ts（comment 行）

      gpt-5.4-mini 屬於 Codex (OpenAI) provider，不是 Claude。

  - id: Q3
    text: scrollbar 殘留黑色具體發生在哪個 UI 區塊？是整頁、modal、chat、canvas 還是特定組件？發生的條件與時機（mode / 切換 / 捲動）？
    type: user-input
    completed: true
    answer: |
      位置：多處 / 不確定具體位置（使用者未指出特定區塊，視為「全站套用 .doodle-scrollbar-thumb 的 ScrollArea 都有」）
      條件：專案本身沒有 dark mode（dark mode 不是觸發條件）；現象是「在 scroll area 區域滑一滑（捲動時），會有幾條黑黑的殘留」
      推論：屬於捲動過程中 thumb 移動所留下的 paint 殘影，並非主題切換瞬間或 scrollbar 本身顏色錯誤，與 Q1 答案的根因假設（rotate + box-shadow + transition 組合造成 composite layer 殘留）一致

  - id: Q4
    text: 黑色殘留出現在哪個瀏覽器 / 作業系統？
    type: user-input
    completed: true
    answer: |
      使用者未指定特定瀏覽器 / OS（回覆空白）。
      處理立場：以 ::-webkit-scrollbar 適用環境（Chromium 系：Chrome / Edge / 部分 Electron / Safari）為主要驗證範圍，不特別針對 Firefox 做客製處理；驗證以開發者本機環境為準。

  - id: Q5
    text: 移除 GPT 5.4 mini 的處理範圍是什麼？是否要為使用者既有設定做 migration？測試 mock 是否要換成其他 codex model 還是直接刪除？
    type: user-input
    completed: true
    answer: |
      處理範圍：完全移除，包含 migration + 刪測試。
      具體含義：
        1. backend/src/services/provider/capabilities.ts 內 CODEX_AVAILABLE_MODELS 與 CODEX_MODEL_THINKING_LEVELS 移除 gpt-5.4-mini 條目
        2. 為使用者既有設定（任何儲存 model 值為 "gpt-5.4-mini" 的位置：DB / config / Workflow 設定等）做 migration，自動切換到預設 codex model
        3. 直接刪除 backend 端以 "gpt-5.4-mini" 為 mock 的測試案例（disposableChatService.test.ts line 72 / streamingChatExecutor.test.ts line 75 / providerHandlersOpencode.test.ts comment），不換成其他 model 保留測試
        4. frontend/tests/business-logic/stores/providerCapabilityStore.test.ts line 282 對應的 assertion 也移除

  - id: Q7
    text: 既然要為「使用者既有設定中已使用 gpt-5.4-mini」做 migration，這份設定實際儲存在哪裡？是 backend DB（SQLite）、frontend localStorage、還是分散在多處？migration 觸發時機為何？
    type: codebase-investigation
    completed: true
    answer: |
      model 值的持久化儲存集中在 backend SQLite，frontend 沒有 localStorage 儲存 model：

      1. backend/src/database/schema.ts - `pods` 表 (line 83-99)
         - 欄位 `provider_config_json TEXT`（JSON 字串）
         - JSON 內含 `.model` 字段
         - statements.ts 已有 `json_extract(provider_config_json, '$.model') = $modelValue` 形式的查詢（line 890, 934, 942），代表 migration 可直接用 SQLite JSON1 函數 update

      2. backend/src/database/schema.ts - `connections` 表 (line 144-167)
         - 欄位 `summary_model TEXT NOT NULL DEFAULT 'sonnet'`
         - 欄位 `branch_model TEXT`（nullable）
         - 都是 plain TEXT，可直接 UPDATE

      3. frontend：未找到 localStorage / sessionStorage 儲存 model 值的程式碼（只有 frontend/src/i18n.ts 用 localStorage 存 i18n 語言設定）

      Migration 觸發時機：
         - backend/src/database/schema.ts 已有 schema migration 風格（addColumnIfMissing、舊資料去重等），同檔案在 db 初始化時執行
         - 建議：在 schema.ts 的 migration sequence 加一筆「啟動時掃 pods.provider_config_json 與 connections.summary_model / branch_model，若 model = 'gpt-5.4-mini' 則改成預設 codex model (見 Q8)」
         - 必須冪等（執行多次結果相同），且需要寫對應的回歸測試

  - id: Q8
    text: 「預設 codex model」具體是哪個？CODEX_AVAILABLE_MODELS 中是否已有明確標示的 default？還是要在這次 plan 中決定？
    type: codebase-investigation
    completed: true
    answer: |
      已明確，不需要在 plan 中再決定：
      backend/src/services/provider/codexProvider.ts:665 內 codexMetadata.defaultOptions.model 已硬編為 "gpt-5.4"。
      該值同時被 prepareCodexExecution 與多處 fallback 使用（line 679, 712, 743, 758）。
      Migration 時將 "gpt-5.4-mini" 一律改成 "gpt-5.4" 即可（與 runtime fallback 行為一致，零驚訝）。

  - id: Q9
    text: 既然 dark mode 也要完全移除，目前 codebase 中所有與 dark mode 相關的 code 散落在哪？完整清單為何？是否會牽動 shadcn-ui / reka-ui 等第三方元件？
    type: codebase-investigation
    completed: true
    answer: |
      共分 4 大類，總計 4 個 CSS 檔 + 4 個 Vue 檔。

      A. CSS - dark variant 全域宣告
         - frontend/src/assets/styles/main.css:7
             @custom-variant dark (&:is(.dark *));
         → 整行移除（Tailwind v4 自訂 variant；移除後 `dark:xxx` class 與 `.dark .xxx` selector 皆失效）

      B. CSS - dark mode 變數區塊（variables.css）
         - frontend/src/assets/styles/variables.css 約 line 64-127
             整個 `.dark { ... }` 區塊（含 background / foreground / card / popover / primary /
             secondary / muted / accent / destructive / border / input / ring / sidebar 系列；
             Pod 漸層暗模式變數 --pod-provider-*-top；Doodle 暗模式調色板；Pod thinking 暗模式變數）
         → 整段刪除
         - 同檔 line 92 / 105 / 118 註解內含「dark mode」描述
         → 註解內提到 dark mode 的字眼可順手清理或改寫（不影響功能）

      C. CSS - scrollbar.css dark 規則
         - frontend/src/assets/styles/doodle/scrollbar.css
             line 22-32：.dark .doodle-scrollbar-thumb { ... } 與 :hover 版本
             line 54-63：.dark .doodle-textarea::-webkit-scrollbar-thumb { ... } 與 :hover 版本
         → 整段刪除（與 scrollbar 修復同檔案，可一起處理）
         - 同檔 slots.css line 397 註解提到「light/dark mode」
         → 註解可改寫

      D. Tailwind `dark:` class（4 檔，共 8 處）
         - frontend/src/components/pod/PodHeader.vue：line 70 (`dark:hover:bg-gray-800`)、line 75 (`dark:text-gray-400 dark:hover:text-gray-300`)
         - frontend/src/components/settings/OpencodeSettingsPanel.vue：line 345 (`dark:text-green-400`)
         - frontend/src/components/chat/ToolOutputModal.vue：line 73 (`dark:bg-red-950/30 dark:border-red-800 dark:text-red-400`)
         - frontend/src/components/chat/ChatMessageBubble.vue：line 96-99 共 4 個 `dark:bg-*-950/30` 在 status style map 中
         → 各檔逐處移除 `dark:` 前綴的 class 名稱（保留同行的 light-mode class）

      E. 第三方元件 / 其他位置
         - frontend/src/components/ui/* 已 grep 確認沒有任何 `dark:` 或 `.dark` 用法（shadcn-ui port 元件未直接依賴 dark variant）
         - reka-ui 套件內部可能有自己的 dark 機制，但屬套件實作，我們不去動
         - root 上是否有掛 `.dark` class（document.documentElement / html）：未在 src 中找到任何加掛邏輯，使用者已確認「沒有 dark mode」，所以 `.dark` class 實際從未被啟用，移除以上規則不會造成可見變化

      不影響範圍：variables.css 中 `:root { ... }`（light mode 變數區塊）以及 `@theme inline` 對應的 mapping 保留不動。
