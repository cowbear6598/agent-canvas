description: >
  Connections can currently cross over agent nodes, such as Game Asset, without
  offering a simple way to route an edge around the obstruction. Every connection
  needs Miro-style adjustable Bezier and orthogonal routes with up to three
  persistent intermediate routing points while retaining Bezier as the default,
  so users can keep relationships readable without changing the existing
  appearance unless they choose to.
goal:
  - Let users choose Bezier or orthogonal routing independently for every connection, with Bezier remaining the default.
  - Present the routing choice in the connection context menu below Direct Trigger and a separating divider.
  - Let users adjust either routing style above or around obstructing nodes with one simple drag handle.
  - Display orthogonal routes as a three-segment U or sideways-U route with 90-degree turns.
  - Match Miro-style constrained dragging: move a horizontal middle segment vertically, move a vertical middle segment horizontally, and bend a Bezier curve perpendicular to the connection's dominant direction.
  - Preview the route while dragging and save its relative routing offset when the drag ends.
  - Let users progressively create and freely move up to three intermediate routing points on either routing style.
  - Show insertion handles between existing routing points until the three-point limit is reached.
  - Smooth Bezier paths through their routing points and keep orthogonal paths axis-aligned through theirs.
  - Keep connection labels and directional arrows correctly positioned along the selected and adjusted route.
  - Preserve each connection's routing mode, offset, and routing points after reloads, real-time updates, copy and paste, and Pod Pack export and import, while treating legacy data as Bezier with no routing points.
  - Keep adjusted orthogonal routes available when their routed bounds intersect the virtualized canvas viewport.
