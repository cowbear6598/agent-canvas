feature: hide-workflow-run-repos
approved: true
scenarios:
  - id: F1
    scenario: 使用者在右鍵選單選擇 repository
    given:
      - 使用者在 canvas 畫面
      - 系統內已有使用者建立的 repository
      - 系統內存在 workflow 執行產生的暫存 repo
    when:
      - 使用者在 canvas 空白處按右鍵
      - 使用者展開 Repository 子選單
    then:
      - Repository 子選單只顯示使用者建立的 repository
      - Repository 子選單不顯示 workflow 執行產生的暫存 repo

  - id: F2
    scenario: 使用者對既有 repository note 開啟右鍵操作
    given:
      - 使用者在 canvas 畫面
      - canvas 上已有一般 repository note
      - 系統內存在 workflow 執行產生的暫存 repo
    when:
      - 使用者對一般 repository note 按右鍵
    then:
      - 系統正常開啟該 repository 的右鍵選單
      - 右鍵選單操作目標維持為使用者原本選取的 repository
      - workflow 執行產生的暫存 repo 不會成為可操作的 repository note

  - id: F3
    scenario: workflow 執行後使用者再次查看 repository 清單
    given:
      - 使用者已在 repository pod 執行 workflow
      - workflow 曾建立暫存 repo 供執行使用
    when:
      - 使用者再次在 canvas 空白處按右鍵
      - 使用者展開 Repository 子選單
    then:
      - 使用者仍只看到原本可選的 repository
      - workflow 執行產生的暫存 repo 不會出現在清單中
