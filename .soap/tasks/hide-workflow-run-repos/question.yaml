feature: hide-workflow-run-repos
created: "2026-05-23"
approved: true
questions:
  - id: Q1
    text: workflow 執行產生的 repo 是在哪裡建立，命名規則是什麼？
    type: codebase-investigation
    completed: true
    answer: |
      `backend/src/services/runtime/runExecutionResources.ts` 在有 Git repository、已有 commit、且有 origin remote 時，會為 workflow run 建立隔離 clone，路徑在專用 runtime root 下，名稱由共用 helper 產生，格式為 `${pod.repositoryId}-agnet-canvas-${runId}`。這些資料夾是 runtime workspace，不是使用者主動建立或 clone 的 repository。
  - id: Q2
    text: 目前 repository 清單為什麼會包含 workflow run repo？
    type: codebase-investigation
    completed: true
    answer: |
      舊實作會讓 workflow run clone 與使用者 repository 共用 `config.repositoriesRoot`，因此 `backend/src/services/repositoryService.ts` 的 `list()` 掃描所有 directory 時會把 runtime workspace 混入清單。`handleRepositoryList` 透過 `createListHandler` 原樣回傳這份清單，因此前端 `repositoryStore.loadRepositories()` 會收到 run repo。
  - id: Q3
    text: 前端右鍵 repo 相關 UI 使用哪一份 repository 清單？
    type: codebase-investigation
    completed: true
    answer: |
      右鍵 canvas 開啟的 `PodTypeMenu.vue` 會在 mounted 時呼叫 `repositoryStore.loadRepositories()`，並用 `repositoryStore.typedAvailableItems` 顯示 Repository 子選單。repo note 的右鍵選單 `RepositoryContextMenu.vue` 則依 note.repositoryId 從同一份 `typedAvailableItems` 找 repository。只要後端清單被 run repo 污染，使用者就可能在右鍵 Repository 子選單建立 run repo note，後續也會看到這些 run repo 的 repo 右鍵操作。
  - id: Q4
    text: 應該在哪一層排除 workflow run repo，才能避免污染所有 repository 使用場景？
    type: codebase-investigation
    completed: true
    answer: |
      應在後端 runtime workspace 的儲存位置切開 namespace，而不是只在單一前端選單過濾。workflow run clone 需放在專用 runtime root，讓 `repositoryService.list()` 只掃描使用者 repository root；孤兒掃描與清理則使用同一個 run repo 命名 helper 判斷 `${repositoryId}-agnet-canvas-${runId}`。
  - id: Q5
    text: 是否需要同步變更 API router 文件或 WebSocket 文件？
    type: codebase-investigation
    completed: true
    answer: |
      這次需求預期只調整既有 WebSocket `repository:list` 回傳內容的過濾邏輯，不新增、更新或刪除 API Router。AGENTS.md 指定 WebSocket 不需要更新後端 API 文件，因此不需要同步專案 skill 的 API 文件。
