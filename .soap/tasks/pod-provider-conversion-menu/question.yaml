feature: pod-provider-conversion-menu
created: "2026-05-31"
approved: true
impact_classification:
  frontend:
    status: required
    evidence:
      - 使用者明確要求右鍵 pod 選單新增「轉換成其他 provider」選項。
      - 使用者明確要求把 pod 右鍵選單中的 integration 改成集合式 hover 子選單。
  backend:
    status: required
    evidence:
      - 使用者要求的 provider 轉換必須真正改變 pod 的 provider，而現有 codebase 尚未提供 pod provider 持久化更新事件或 API。
      - 現有前端 `updatePodProvider()` 只更新本地狀態，沒有把 provider 變更送到後端或廣播給其他客戶端。
questions:
  - id: Q1
    text: 現行 pod 右鍵選單的結構與 integration 呈現方式是什麼？
    type: codebase-investigation
    completed: true
    answer: |
      `frontend/src/components/canvas/PodContextMenu.vue` 目前只有一個下載資料夾按鈕，
      後面直接把所有 integration provider 平鋪成按鈕；每個 provider 依當前是否已綁定，
      顯示 connect 或 disconnect。integration 沒有被包成子選單，也沒有 hover 展開層級。

  - id: Q2
    text: 現有 codebase 是否已經有可參考的 hover 子選單互動樣式？
    type: codebase-investigation
    completed: true
    answer: |
      有。`frontend/src/components/canvas/connectionMenu/SummarySection.vue`
      已經實作 `mouseenter` / `mouseleave` 控制的右側 hover 子選單，Summary Provider、
      Summary Model 與 Thinking Level 都採用主列項目加 `ChevronRight`，再在
      `absolute left-full top-0` 的浮層中顯示各選項。這正是使用者提到的
      「summary model 那種跳法」。

  - id: Q3
    text: 現行 pod provider 切換是否已經有完整的前後端持久化流程？
    type: codebase-investigation
    completed: true
    answer: |
      沒有完整流程。前端 `frontend/src/stores/pod/podStore.ts` 雖然有
      `updatePodProvider(podId, provider, providerConfig)`，但它只改本地 pod 狀態，
      並呼叫 `connectionStore.reconcileSummaryModelsForPod()` 修正下游 connection 的
      summaryModel；現有 WebSocket event 只有 `pod:set-model` 與
      `pod:set-thinking-level`，沒有 `pod:set-provider`。後端
      `backend/src/handlers/podHandlers.ts` 也沒有處理 provider 變更的 handler，
      代表 provider 轉換目前無法持久化到資料庫，也不會 broadcast 給其他客戶端。

  - id: Q4
    text: 現行 pod provider 選項與預設 model 來源是什麼？
    type: codebase-investigation
    completed: true
    answer: |
      建立 pod 的 provider 選單在 `frontend/src/components/canvas/ProviderPicker.vue`
      目前是硬編碼 `claude`、`codex`、`opencode` 三個 provider；選到 provider 後，
      會從 `providerCapabilityStore` 取該 provider 的預設 model。connection 右鍵中的
      provider 子選單也是硬編碼 provider 順序。這表示本次 pod 右鍵的 provider 轉換
      功能，若沿用既有設計，應重用同一組 provider 選項與預設 model 解析規則。
