feature: pod-provider-conversion-menu
approved: true
scenarios:
  - id: F1
    scenario: 使用者從 pod 右鍵選單切換 provider
    given:
      - 使用者在畫布上看到一個 pod
      - 該 pod 已有目前的 provider 設定
    when:
      - 使用者對該 pod 按右鍵
      - 使用者開啟轉換 provider 的子選單
      - 使用者選擇另一個 provider
    then:
      - 系統會把該 pod 切換成使用者選擇的 provider
      - 系統會套用新 provider 可用的預設 model
      - 右鍵選單會關閉

  - id: F2
    scenario: 使用者查看 pod 右鍵選單中的 integration 集合
    given:
      - 使用者在畫布上看到一個 pod
      - 系統已有可用的 integration provider 清單
    when:
      - 使用者對該 pod 按右鍵
      - 使用者把滑鼠移到 integration 集合項目
    then:
      - 系統會在右側展開 integration 子選單
      - 子選單會列出各個 integration provider 的操作項目

  - id: F3
    scenario: 使用者從 integration 子選單管理單一 provider 綁定
    given:
      - 使用者已開啟 pod 的右鍵選單
      - 使用者已展開 integration 子選單
    when:
      - 使用者選擇其中一個 integration provider 的操作項目
    then:
      - 若該 provider 尚未綁定就會進入連接流程
      - 若該 provider 已綁定就會執行解除綁定流程
      - 右鍵選單會關閉
