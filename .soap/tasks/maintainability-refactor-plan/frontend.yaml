feature: maintainability-refactor-plan
side: frontend
approved: true
phases:
  - id: P1
    title: 入口協調邏輯拆分
    parallel: false
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P1.A
        title: App bootstrap composable
        tasks:
          - id: P1.A.t1
            text: 梳理 `frontend/src/App.vue` 目前負責的初始化流程，列出資料載入、canvas reset/load、session 初始化與畫面 gate 的現有責任邊界
            completed: true
            last_files_changed:
              - frontend/src/composables/useAppBootstrap.ts
          - id: P1.A.t2
            text: 新增 `frontend/src/composables/useAppBootstrap.ts`，承接 App 啟動時的使用者資料、專案資料與全域設定載入流程
            completed: true
            last_files_changed:
              - frontend/src/composables/useAppBootstrap.ts
          - id: P1.A.t3
            text: 將 `App.vue` 中對應的 bootstrap 呼叫改為使用 `useAppBootstrap` 回傳的狀態與操作，保留既有 template gate 行為
            completed: true
            last_files_changed:
              - frontend/src/App.vue
              - frontend/src/composables/useAppBootstrap.ts
          - id: P1.A.t4
            text: 新增或調整 `frontend/src/__tests__` 中涵蓋 app bootstrap 成功載入與載入中狀態的測試，mock 邊界只使用既有 store 或專案 wrapper
            completed: true
            last_files_changed:
              - frontend/tests/business-logic/composables/useAppBootstrap.test.ts
      - id: P1.B
        title: Socket 與 canvas session lifecycle
        tasks:
          - id: P1.B.t1
            text: 新增 `frontend/src/composables/useAppSocketLifecycle.ts`，承接 WebSocket 連線、reconnect listener 與清理流程
            completed: true
            last_files_changed:
              - frontend/src/composables/useAppSocketLifecycle.ts
          - id: P1.B.t2
            text: 新增 `frontend/src/composables/useCanvasSessionLifecycle.ts`，承接 canvas 切換時的 session reset、load 與 run 狀態重新同步流程
            completed: true
            last_files_changed:
              - frontend/src/composables/useCanvasSessionLifecycle.ts
          - id: P1.B.t3
            text: 將 `App.vue` 中 socket lifecycle 與 canvas session lifecycle 改為呼叫對應 composable，讓 `App.vue` 僅保留組裝與 template
            completed: true
            last_files_changed:
              - frontend/src/App.vue
          - id: P1.B.t4
            text: 補上 socket reconnect 與 canvas 切換流程測試，確認使用者切換 canvas 後仍會載入對應 session 並維持既有同步行為
