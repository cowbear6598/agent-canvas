feature: maintainability-refactor-plan
created: "2026-05-25"
approved: true
questions:
  - id: Q1
    text: 前端 review 中第一批最適合落地的維護項目是哪些？
    type: codebase-investigation
    completed: true
    answer: |
      建議第一批前端以 `frontend/src/App.vue` 入口協調拆分為主，新增 `useAppBootstrap`、`useAppSocketLifecycle`、`useCanvasSessionLifecycle` 這類 composable，先抽資料載入、canvas reset/load、WebSocket reconnect listener，security gate 留到後續，避免一次動到 template gate。第二順位是 settings 副作用邊界，目標為 `OpencodeSettingsPanel.vue` 與 `GlobalSettingsModal.vue`，可抽 provider/alias/form/backup/password composable。第三順位是 WebSocket/API/store contract mapper，目標為 connection response mapper、run history result normalizer、canvas-scoped command helper。測試 fail-fast 應排在核心拆分穩定後，避免大量既有 warning 阻塞第一批。
  - id: Q2
    text: 後端 review 中第一批最適合落地的維護項目是哪些？
    type: codebase-investigation
    completed: true
    answer: |
      建議第一批後端先做風險防線與可抽出純邏輯，不直接硬拆整個 executor。第一順位是 `backend/tests/setup/testConfig.ts` 的 console capture-and-fail 與 allowlist helper，避免後續重構吞掉 warning/error。第二順位是 REST/WebSocket contract 可觀測化，目標為 `apiRouter.ts`、handler registry、eventRouter、events schema，先加 typed manifest/introspection test。第三順位是 run 狀態機純化，從 `runExecutionService.ts` 與 `workflowRunDecisions.ts` 抽 `RunStatusMachine` 或 settlement decision 純函式。第四順位才是 `streamingChatExecutor.ts` 輕量切邊，例如 lifecycle coordinator 或 dispatcher/persist helper，不碰 provider stream 主迴圈與 Goal gate 主語意。暫不建議第一批納入 `codexProvider.ts`、`opencodeAliasService.ts`、`runStore.ts`、`podStore.ts`，避免 blast radius 過大。
  - id: Q3
    text: 這次計畫要先做哪個範圍？
    type: user-input
    completed: true
    answer: |
      使用者指定前後端都要納入第一批計畫。計畫需同時涵蓋前端 `App.vue` 入口協調拆分、settings 副作用邊界、WebSocket/API/store contract mapper，以及後端測試防線、REST/WebSocket contract 可觀測化、run 狀態機純化與輕量 streaming executor 邊界。由於範圍較大，後續 plan 需明確分階段與驗證命令，避免一次性大改造成風險。
