  - id: P1
    title: 後端測試訊號防線
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P1.A
        title: Console capture 與 allowlist
        tasks:
          - id: P1.A.t1
            text: 檢查 `backend/tests/setup/testConfig.ts` 目前覆寫 console warning/error 的方式，列出既有測試中需要保留的合法輸出來源
            completed: true
            last_files_changed:
              - backend/tests/setup/testConfig.ts
          - id: P1.A.t2
            text: 在 `backend/tests/setup/testConfig.ts` 建立 console warning/error capture helper，讓未列入 allowlist 的輸出會造成測試失敗
            completed: true
            last_files_changed:
              - backend/tests/setup/testConfig.ts
          - id: P1.A.t3
            text: 將需要預期 console warning/error 的測試改成明確 assertion 或加入具體 allowlist，移除全域靜默造成的誤判風險
            completed: true
            last_files_changed:
              - backend/tests/setup/testConfig.ts
          - id: P1.A.t4
            text: 補上 console capture helper 的測試，確認未預期輸出會失敗，已列入 allowlist 的輸出會通過
            completed: true
            last_files_changed:
