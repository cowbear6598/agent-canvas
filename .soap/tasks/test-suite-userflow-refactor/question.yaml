feature: test-suite-userflow-refactor
created: "2026-05-21"
approved: true
questions:
  - id: Q1
    text: 現有前後端測試主要分布在哪些層級？
    type: codebase-investigation
    completed: true
    answer: |
      專案目前共有 216 個非 node_modules 測試檔。後端主要集中在 `backend/tests/unit`（93 個），另有 `backend/tests/integration`（20 個）、provider / services / handlers / api / database / utils 等分類。前端主要集中在 `frontend/tests/stores`（28 個）、`frontend/tests/composables`（21 個）、`frontend/tests/components`（4 個），另有 `frontend/tests/integration`（3 個）與 `frontend/tests/integration-providers`（6 個）。
  - id: Q2
    text: 現有測試是否大量依賴第三方或內部 module mock？
    type: codebase-investigation
    completed: true
    answer: |
      是。以 `vi.mock`、`vi.spyOn`、`mockResolvedValue`、`mockReturnValue`、`@vue/test-utils`、`mount(` 等關鍵字粗掃，約 122 個測試檔命中。這表示目前大量測試是隔離單元或 UI/component 行為驗證，重構時需要重新定義哪些 mock 可以保留為外部邊界，哪些 mock 應被 integration harness 取代。
  - id: Q3
    text: 專案目前有哪些可用的自動驗證指令？
    type: codebase-investigation
    completed: true
    answer: |
      根目錄提供 `bun run build`。前端 `frontend/package.json` 提供 `bun run build`、`bun run style`、`bun run test`、`bun run test:run`。後端 `backend/package.json` 提供 `bun run build`、`bun run style`、`bun run test`、`bun run test:watch`。前後端都使用 Vitest，前端另有 Vue Test Utils / jsdom。
  - id: Q4
    text: 測試重構的範圍是否要一次涵蓋所有現存測試檔，還是分階段先處理高價值流程？
    type: user-input
    completed: true
    answer: |
      範圍涵蓋所有現存測試檔。實作上仍應分批遷移與驗證，避免單次改動讓 CI/CD 長時間不可用；但最終盤點與分類不能只挑部分檔案。
  - id: Q5
    text: 哪些測試類型仍允許保留為非 userflow / integration 測試？
    type: user-input
    completed: true
    answer: |
      允許保留少量高價值、穩定、無 UI 依賴的商業邏輯或純函式測試，例如 parser、schema migration、sanitizer、validator、路徑安全規則、狀態機決策、錯誤分類、時間與排程計算、資料轉換器。這些測試必須驗證產品規則或風險邊界，不能只驗證第三方 mock 是否被呼叫、Vue component 是否 render 出某個 class、或 implementation detail。
  - id: Q6
    text: 對第三方服務與外部程序的 mock 邊界要怎麼定義？
    type: user-input
    completed: true
    answer: |
      真正第三方或外部程序可以 mock / fake，包括 git CLI / remote git provider、Claude、Codex、opencode、Sentry、Slack、Jira、Telegram 等網路服務或不可控 process。filesystem、database、websocket 不應預設 mock；這些應透過臨時目錄、測試資料庫或 in-memory/ephemeral database、真 WebSocket server/client harness 進行 integration test。CI/CD 必須維持穩定，測試不可依賴外網、真 credential、真使用者環境或長時間 sleep；必要時用 fake server、stub executable、fixture workspace、transaction/cleanup 隔離。
