feature: test-suite-userflow-refactor
approved: true
scenarios:
  - id: F1
    scenario: 維護者完成全量測試盤點
    given:
      - 專案已有前端測試
      - 專案已有後端測試
      - 測試分散在多個目錄
    when:
      - 維護者檢視測試清單
      - 維護者判斷每個測試的價值
    then:
      - 每個現存測試都有保留或重寫或刪除的分類
      - 每個分類都有明確原因
      - 無意義 mock 測試被標記為待重寫
  - id: F2
    scenario: 開發者用測試驗證前端使用流程
    given:
      - 使用者會在畫布上操作 pod
      - 使用者會傳送訊息
      - 使用者會複製貼上內容
    when:
      - 開發者執行前端測試
    then:
      - 測試驗證真實使用流程
      - 測試驗證 store 行為如何支援流程
      - 測試不只檢查畫面片段
  - id: F3
    scenario: 開發者用測試驗證後端商業流程
    given:
      - 使用者會建立 pod
      - 使用者會發起 chat
      - 使用者會觸發 workflow
    when:
      - 開發者執行後端測試
    then:
      - 測試驗證 API 到服務層的完整行為
      - 測試驗證資料會正確寫入測試資料庫
      - 測試驗證檔案會正確寫入臨時目錄
  - id: F4
    scenario: 開發者確認外部服務失敗時產品行為仍可預期
    given:
      - 產品會呼叫外部 AI provider
      - 產品會呼叫第三方整合服務
      - 產品會呼叫外部 git 操作
    when:
      - 開發者執行外部服務失敗情境測試
    then:
      - 測試使用 fake 外部服務
      - 測試不依賴真實憑證
      - 測試不依賴外網
      - 產品錯誤訊息符合使用者情境
  - id: F5
    scenario: 開發者確認 websocket 流程可端到端運作
    given:
      - 使用者操作會透過 websocket 傳送
      - 後端會回傳事件給前端
    when:
      - 開發者執行 websocket 流程測試
    then:
      - 測試使用真實 websocket server
      - 測試使用真實 websocket client
      - 測試驗證前端收到的事件會更新狀態
  - id: F6
    scenario: 維護者在 CI 中執行重構後測試
    given:
      - 測試已改為以流程為主
      - 測試需要在 CI 環境穩定執行
    when:
      - 維護者觸發 CI
    then:
      - 測試不需要外部網路
      - 測試不需要真實憑證
      - 測試不依賴本機使用者設定
      - 測試完成時間可接受
  - id: F7
    scenario: 開發者修改商業邏輯時得到有效回饋
    given:
      - 開發者修改了產品流程
      - 修改影響前端狀態
      - 修改影響後端資料
    when:
      - 開發者執行相關測試
    then:
      - 失敗測試指出使用流程破壞點
      - 失敗測試不只指出 mock 呼叫次數改變
      - 開發者可以從測試名稱理解產品規則
  - id: F8
    scenario: 維護者保留少量高價值純邏輯測試
    given:
      - 專案包含 parser
      - 專案包含 validator
      - 專案包含狀態決策邏輯
    when:
      - 維護者檢視這些測試
    then:
      - 高價值純邏輯測試被保留
      - 測試名稱描述產品規則
      - 測試不依賴 UI 細節
