feature: test-suite-userflow-refactor
side: frontend
approved: true
phases:
  - id: P1
    title: 前端測試盤點與分類規則
    parallel: false
    verification:
      - cd frontend && bun run style
    done: true
    items:
      - id: P1.A
        title: 前端測試分類清單
        tasks:
          - id: P1.A.t1
            text: 建立前端測試盤點文件，列出 `frontend/tests` 下每個測試檔的目前分類、保留或重寫或刪除決策、對應 userflow 或商業規則
            completed: true
            last_files_changed:
              - frontend/tests/test-inventory.json
          - id: P1.A.t2
            text: 在盤點文件中標記所有只驗證 Vue render、CSS class、component mount、mock 呼叫次數的測試，列為 userflow 測試重寫候選
            completed: true
            last_files_changed:
              - frontend/tests/test-inventory.json
          - id: P1.A.t3
            text: 在盤點文件中標記可保留的純商業邏輯測試，限定為 validator、sanitizer、資料轉換、排程計算、狀態決策這類不依賴 UI 的規則
            completed: true
            last_files_changed:
              - frontend/tests/test-inventory.json
      - id: P1.B
        title: 前端測試政策文件
        tasks:
          - id: P1.B.t1
            text: 建立前端測試政策文件，定義只允許 userflow、integration、商業邏輯三類測試
            completed: true
            last_files_changed:
              - frontend/TESTING.md
          - id: P1.B.t2
            text: 在政策文件中明確禁止新增純 UI render、snapshot、mock third-party SDK spy、store 初始欄位形狀測試
            completed: true
            last_files_changed:
              - frontend/TESTING.md
          - id: P1.B.t3
            text: 在政策文件中定義前端允許 fake 的邊界為外部 API client 或 websocket server harness，不允許 mock 產品 store 來宣稱流程已驗證
            completed: true
            last_files_changed:
              - frontend/TESTING.md

  - id: P2
    title: 前端 userflow 測試 harness
    parallel: false
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P2.A
        title: App 級測試啟動器
        tasks:
          - id: P2.A.t1
            text: 建立前端 userflow 測試啟動器，能掛載真 Pinia store、真 router、真 i18n，讓測試從使用者操作入口驅動狀態改變
            completed: true
            last_files_changed:
              - frontend/package.json
              - frontend/bun.lock
              - frontend/tests/helpers/index.ts
              - frontend/tests/helpers/userFlowLauncher.ts
          - id: P2.A.t2
            text: 將現有 `frontend/tests/setup.ts` 整理成共享 setup，保留 jsdom 必要設定，移除會遮蔽產品流程的全域 module mock
            completed: true
            last_files_changed:
              - frontend/tests/setup.ts
          - id: P2.A.t3
            text: 建立測試資料工廠，產生 canvas、pod、chat message、workflow event、integration provider 等流程所需資料
            completed: true
            last_files_changed:
              - frontend/tests/helpers/factories.ts
      - id: P2.B
        title: WebSocket 與 API 測試邊界
        tasks:
          - id: P2.B.t1
            text: 建立 fake WebSocket server harness，讓前端測試使用真 WebSocket client 接收後端事件格式
            completed: true
            last_files_changed:
              - frontend/tests/helpers/fakeWebSocketServer.ts
              - frontend/tests/helpers/index.ts
          - id: P2.B.t2
            text: 建立前端 API fake server 或 request adapter，讓測試以產品 API 合約回應資料，不直接 mock store action
            completed: true
            last_files_changed:
              - frontend/tests/helpers/fakeApiServer.ts
              - frontend/tests/helpers/index.ts
          - id: P2.B.t3
            text: 將 fake WebSocket 與 API harness 文件化，說明哪些情境應使用 fake server，哪些情境應改到後端 integration test 驗證
            completed: true
            last_files_changed:
              - frontend/TESTING.md

