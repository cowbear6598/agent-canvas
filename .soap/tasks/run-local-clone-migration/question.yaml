questions:
  - id: Q1
    text: syncToRemoteLatest 目前在哪些地方被呼叫？呼叫鏈與時機為何？影響 fetch-all 改動 + per-repo mutex 加在哪一層。
    type: codebase-investigation
    completed: true
    answer: |
      唯一呼叫點：runExecutionResources.ts:107 的 provisionRepositoryWorkspace()，
      Run 啟動的資源配置階段（在建立 worktree 前）。呼叫鏈：launchMultiInstanceRun
      → runExecutionService.createRun → provisionRunExecutionResources →
      provisionRepositoryWorkspace → gitService.syncToRemoteLatest。

      上層只有 per-Run 的 worktreeCache（Map，在 createRun 內建立），沒有跨 Run 的 mutex。
      多個 Run 同時針對同一 repo 觸發 sync 會撞 git lock。

      建議：per-repo mutex 放在 gitService 內部（gitService 是 global singleton，
      適合維護 private repoMutexes: Map<string, Promise>），攔截對同一 workspacePath
      的並發呼叫，第一個跑、其他 await 同一個 promise，一次 fetch 服務全部。

  - id: Q2
    text: getWorktreeBranches / getLocalBranches 回傳的 worktreeBranches 在後端、前端有哪些消費點？砍掉 manual worktree 後是否要一併清掉（含 BranchSelectModal 的「Worktree 佔用」分隔區）？
    type: codebase-investigation
    completed: true
    answer: |
      後端消費點：
      - gitService.ts:465-482 getWorktreeBranches 方法、217-231 parseWorktreeLine
      - gitService.ts:484-514 getLocalBranches 內部聚合 worktreeBranches 欄位
      - repositoryBranchHandlers.ts:130-137 組裝 REPOSITORY_LOCAL_BRANCHES_RESULT 回應
      - types/responses/repository.ts:81-88 RepositoryLocalBranchesResultPayload

      前端消費點：
      - types/websocket/responses.ts:290 worktreeBranches?: string[]
      - stores/note/repositoryStore.ts:50/214/240 型別與回應存儲
      - components/canvas/BranchSelectModal.vue:25/54-65/186-202「Worktree 佔用」分隔區與 disable
      - components/canvas/RepositoryContextMenu.vue:59/145/216/333 資料流
      - locales/(en|zh-TW|ja).json: canvas.branchSelect.worktreeOccupied i18n key

      結論：完全砍掉 worktreeBranches 是安全的。Run 自動建 worktree 用的是
      createDetachedWorktree（detached HEAD），跟「命名 branch worktree」無關、不互動。
      換成 clone 後也不再需要這個分隔區（不會再有 branch 被 worktree 佔用）。
      移除範圍：worktreeBranches 欄位（前後端 type + handler 組裝）、getWorktreeBranches /
      parseWorktreeLine、BranchSelectModal 分隔區 UI + i18n key。

  - id: Q3
    text: runExecutionService.cleanupRunResources 既有的 removeRunDirectory 工具方法在哪、簽名為何、權限與路徑安全檢查是否足以直接拿來刪 runDir（不再走 git worktree remove）？
    type: codebase-investigation
    completed: true
    answer: |
      位置：runExecutionService.ts:621-634
      Signature: private async removeRunDirectory(dirPath: string, label: string): Promise<void>
      實作：fs.rm(dirPath, { recursive: true, force: true })，try/catch 只記 warn log（fail-silent）

      路徑安全檢查：方法本身「沒有」boundary check，直接 rm 任何傳入路徑。
      目前的呼叫點（cleanupRunResources 內 686-697 的 sandbox home 清理）是「呼叫前
      在 caller 端用 isPathWithinDirectory 過濾」才安全的。

      要拿來刪 runDir（{repositoriesRoot}/{repositoryId}-run-{runId}）：
      不夠安全，需要新增一個專用 method removeRunRepoDirectory，內部包含
      isPathWithinDirectory(dirPath, config.repositoriesRoot) 檢查，
      通過再呼叫 removeRunDirectory。或在 cleanupRunResources 流程內加 filter。

  - id: Q4
    text: 既有 worktree 相關測試（gitServiceWorktree.test.ts、runExecutionResources.test.ts、runExecutionService.test.ts、runStore.test.ts、integration/repository.test.ts）分別覆蓋哪些行為？換成 clone 後哪些可保留、哪些要重寫？
    type: codebase-investigation
    completed: true
    answer: |
      全部重寫（rewrite）：
      - gitServiceWorktree.test.ts → gitServiceClone.test.ts，驗證 git clone --local
        + origin set-url，保留路徑安全檢查
      - integration/repository.test.ts worktree 段落（建立 / metadata / 刪除清理）→
        手動 worktree 整段砍掉，不另寫 clone 版（因為砍 manual worktree 功能）
      - integration/repository-git-operations.test.ts 分支獲取段落（案例 2-3）→
        移除（worktreeBranches 欄位一併砍）

      修改 mock（testdouble）：
      - runExecutionResources.test.ts 案例 1：mock createDetachedWorktree 失敗 →
        改 mock createLocalClone（或新方法名）失敗，錯誤路徑相同
      - runStore.test.ts 案例 38-42 getWorktreePathsByRunId / clearWorktreePathsByRunId
        欄位改名後同步更新（呼應 Q6 答案）

      保留：
      - runExecutionService.test.ts 全部 38 個案例（mock 隔離，對底層實作無依賴）
      - runStore.test.ts CRUD / 狀態 / execution paths 部分
      - repository-git-operations.test.ts 案例 1/4/5-6/7（parentRepoId 限制檢查
        對 clone 方案仍適用，邏輯不變）

  - id: Q5
    text: codex / claude provider 跑命令時，會不會在 prompt / 環境中假設 origin URL 是某個特定值？把 runDir 的 origin URL 設成真實遠端是否會影響其他流程？
    type: codebase-investigation
    completed: true
    answer: |
      Provider 完全不依賴 origin URL。確認：
      - codexProvider.ts:16 啟動 codex 用 --skip-git-repo-check，跳過 git 驗證
      - codexProvider.ts:82-83、codexHelpers.ts:13-26 環境變數白名單硬編碼，不含 GIT_*
      - claude/runClaudeQuery.ts:545 只傳 cwd，不涉及 git config
      - shared/podPathResolver.ts:21-54 resolvePodCwd 純粹靠 repositoriesRoot + repositoryId 或 workspacePath，不讀 git config

      Provider / workflow 內部唯一動到 git 的地方：
      - syncToRemoteLatest（針對主 repo，非 runDir）
      - createDetachedWorktree / removeWorktree（換 clone 後消失）

      結論：把 runDir 的 origin URL 從「本地 source path」改成「真實遠端 URL」
      完全安全、無副作用。AI 在 runDir 內跑 git push origin <branch> 會自動
      推到真實遠端（符合需求）。

  - id: Q6
    text: DB schema 的 run_pod_instances.worktree_path 欄位命名策略要走哪條？A) ALTER TABLE 改名 run_repo_path / B) 保留欄位名只改語義（避免 migration） / C) 直接新增欄位 + 砍舊欄位
    type: user-input
    completed: true
    answer: |
      A) ALTER TABLE 改名 run_repo_path。
      搭配既有 sqlite migration 邏輯（try/catch ALTER TABLE 模式），TypeScript 對應
      欄位名一律從 worktreePath 改成 runRepoPath。schema 與語義對齊、未來讀代碼不誤解。

  - id: Q7
    text: |
      主 repo 沒有 origin remote 時要怎麼處理？實際會發生的情境：使用者透過
      `REPOSITORY_CREATE` 建立「空 repository」（mkdir 空資料夾、不 init git）
      之後手動 `git init` + commit 但沒 `git remote add origin`。
      不會發生的情境：透過 `REPOSITORY_GIT_CLONE` 建立的會自動帶 origin。

      Q8 已答「非 git / 無 commit 沿用 sourceRepoPath」。此題針對的是「有 git、
      有 commit、但沒 origin」這個剩餘情境，需要決定行為。

      A) 報錯讓 Run fail（強制使用者先設好 origin 才能跑 Run）
      B) 仍然 clone --local，但 runDir 的 origin 保留指向本地 source path
         （AI push 會推到本地路徑、推不到真實遠端，但 Run 內可以正常 git 操作）
      C) 不做 clone、沿用 sourceRepoPath（套用 Q8 同樣 fallback，多 Run 共享同資料夾）
    type: user-input
    completed: true
    answer: |
      C) 不做 clone、沿用 sourceRepoPath。
      跟 Q8 fallback 邏輯統一：repository 條件不足以做 clone 隔離時，退回多 Run
      共享同資料夾的舊行為。使用者本來就沒設 remote，代表他不期待完整 git push 流程，
      多 Run 共享風險自負。實作判斷：repository 有 git + 有 commit + 有 origin
      才走 clone --local 路徑，否則沿用 sourceRepoPath。

  - id: Q8
    text: 現況 provisionRepositoryWorkspace 對「非 git repo」「無 commit」會 fallback 直接回傳 sourceRepoPath（多 Run 共享同一資料夾）。換成 clone 後這個 fallback 還要保留嗎？保留的話多 Run 並發會共享，跟新方案精神矛盾。
    type: user-input
    completed: true
    answer: |
      保留 fallback、直接用 sourceRepoPath。
      非 git repo 或無 commit 的 repository 多 Run 共享同一資料夾，承擔檔案衝突風險。
      Repository Slot 本來就允許非 git 用途（空資料夾 / 純文件），新方案不強制 git 化。

  - id: Q9
    text: PR 拆分策略？A) 一個 PR 一次完成（換 clone + 砍 manual worktree） / B) 兩個 PR 分批（先換 clone、再砍 manual worktree） / C) 兩個 PR 分批但反序（先砍 manual worktree、再換 clone）
    type: user-input
    completed: true
    answer: |
      一個 PR 一次完成全部（換 Run clone + 砍 manual worktree）。
      Review 一次性、不會有中間狀態，使用者習慣此節奏。

  - id: Q10
    text: 進程崩潰留下的孤兒 runDir（沒被 cleanup 到的 runId 資料夾）要不要在 backend 啟動時掃描清理？或維持「靠下次同 runId 衝突時手動處理」？
    type: user-input
    completed: true
    answer: |
      Backend 啟動時掃描 {repositoriesRoot}，比對 DB 內 active Run，列出孤兒 runDir
      並 warn log，但「不動手刪」。使用者保留決定權，避免誤刪。
      啟動掃描邏輯：找出符合 `{repositoryId}-run-{any}` 模式的資料夾，
      凡是 DB 對應不到 active Run 的、log 一條 warn。
