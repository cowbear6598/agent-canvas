feature: run-local-clone-migration
approved: true

scenarios:
  - id: F1
    scenario: 使用者同時觸發多個 Run，AI 各自 checkout 同一個 existing branch 工作
    given:
      - Pod 綁的 Repository 是透過 git clone 建立、有 origin、有 commit
      - Pod 開啟 multi-instance 模式
      - Repository 主 repo 當下不在 develop branch
    when:
      - 使用者在源頭 Pod 連續送出三條訊息觸發三個 Run
      - 每個 Run 內的 AI 都被指示 checkout 到 develop 並修改檔案
    then:
      - 三個 Run 都成功 checkout 到 develop
      - 三個 Run 互不干擾
      - 沒有出現 branch is already checked out 的錯誤

  - id: F2
    scenario: AI 在 Run 內 push 新 branch 到真實遠端
    given:
      - Run 內的 AI 已完成檔案修改
      - 該 Repository 是 clone 自 GitHub
    when:
      - AI 在 Run 工作目錄內執行 git checkout -b ai-implement/feature
      - AI 執行 git push origin ai-implement/feature
    then:
      - 真實遠端（GitHub）出現 ai-implement/feature branch
      - push 動作成功完成

  - id: F3
    scenario: Run 自然完成後系統自動清理工作目錄
    given:
      - 一個 Run 已執行完所有 Pod
      - Run 進入 completed 狀態
    when:
      - 系統觸發 Run cleanup
    then:
      - 該 Run 的工作目錄從檔案系統移除
      - 主 repo 不會殘留任何 AI 在 Run 內建立的 branch
      - 主 repo 不會出現 worktree stale entry

  - id: F4
    scenario: 使用者手動刪除進行中的 Run
    given:
      - 一個 Run 正在跑、AI 串流進行中
    when:
      - 使用者點 Run 卡片的刪除按鈕
    then:
      - AI 串流被中斷
      - 該 Run 的工作目錄被刪除
      - 主 repo 不殘留分支

  - id: F5
    scenario: Repository 條件不足以做隔離，多 Run 共享主 repo 目錄
    given:
      - Pod 綁的 Repository 滿足下列任一條件：是空資料夾 / 非 git repo / 是 git 但無 commit / 是 git 但無 origin
      - Pod 開啟 multi-instance 模式
    when:
      - 使用者連續送出多條訊息觸發多個 Run
    then:
      - 各 Run 直接使用主 repo 路徑工作
      - 多 Run 共享同一資料夾（fallback 行為，無隔離）
      - 系統不報錯、Run 正常執行

  - id: F6
    scenario: 使用者操作 Repository Pod 時不再看到 Worktree 相關 UI
    given:
      - 使用者在 Canvas 上有一個 Repository Pod
    when:
      - 使用者右鍵點該 Pod
      - 使用者打開 Branch 選擇 Modal
    then:
      - 右鍵選單不再有 Create Worktree 按鈕
      - Branch 選擇 Modal 不再顯示 Worktree 佔用分隔區
      - 所有 branch 都可以正常被選擇

  - id: F7
    scenario: backend 啟動時偵測到上次崩潰留下的孤兒 runDir
    given:
      - backend 上次執行時被強制終止、留下未清理的 runDir
      - 重啟後 DB 已找不到對應的 active Run
    when:
      - backend 啟動完成初始化
    then:
      - 系統 log 顯示找到的孤兒 runDir 數量與路徑
      - 系統不自動刪除這些孤兒目錄
      - 使用者可選擇手動清理

  - id: F8
    scenario: 多個 Run 同時針對同一 Repository 觸發，主 repo 只被 fetch 一次
    given:
      - 一個 Repository 是 clone 自遠端
      - 多個 Run 同時被觸發
    when:
      - 三個 Run 在同一時間呼叫主 repo 同步
    then:
      - 主 repo 對真實遠端只發出一次 fetch
      - 三個 Run 共享這次 fetch 結果
      - 不會出現 git lock 衝突錯誤
