feature: run-local-clone-migration
side: backend
approved: true

phases:
  - id: P1
    title: gitService 核心 API 改造（新增 createLocalClone、syncToRemoteLatest 改 fetch-all + per-repo mutex、移除 worktree methods、移除 worktreeBranches 欄位）
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test -- tests/unit/gitServiceClone.test.ts
      - test -f backend/src/services/workspace/gitService.ts
      - test -f backend/tests/unit/gitServiceClone.test.ts
      - "! test -f backend/tests/unit/gitServiceWorktree.test.ts"
    done: true
    items:
      - id: P1.A
        title: 在 gitService 新增 createLocalClone 與 per-repo fetch 去重機制
        tasks:
          - id: P1.A.t1
            text: 在 `backend/src/services/workspace/gitService.ts` 的 `GitService` class 內新增 `createLocalClone(sourceRepoPath, runDir)` 方法。實作：用 `simpleGit().clone(sourceRepoPath, runDir, ["--local"])` 建立隔離工作目錄；clone 完成後讀取主 repo（sourceRepoPath）的 `origin` remote URL，再對 runDir 執行 `git remote set-url origin <主 repo 的真實 origin URL>`，使 AI 在 runDir 內可直接 push 至真實遠端。runDir 路徑必須通過 `isPathWithinDirectory(runDir, config.repositoriesRoot)` 安全檢查。回傳 `Result<void>`。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed:
              - backend/src/services/workspace/gitService.ts
          - id: P1.A.t2
            text: 在 `GitService` class 內新增 `private repoFetchPromises: Map<string, Promise<Result<void>>>` 欄位。改寫 `syncToRemoteLatest(workspacePath)`：以 `path.resolve(workspacePath)` 作為 key，若 Map 內已有同 key 的進行中 Promise 則直接 await 回傳同一個結果（同 repo 多 Run 並發只 fetch 一次）；否則建立 promise 寫入 Map，promise 完成後（無論成功失敗）以 `finally` 從 Map 移除。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed:
              - backend/src/services/workspace/gitService.ts
          - id: P1.A.t3
            text: 將 `syncToRemoteLatest` 內部的 fetch 邏輯由「只 fetch 當前 branch」改為「fetch all branches」：保留「無 origin remote 時靜默 ok」的既有判斷，但 fetch 步驟改成執行 `git fetch origin --prune`（不再帶 `<branchName>` 參數，也不再執行 reset --hard）。改完語意：將主 repo 的所有遠端 branches 同步到本地，提供後續 clone --local 給 Run 使用，但不變動主 repo 的工作樹狀態。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed:
              - backend/src/services/workspace/gitService.ts

      - id: P1.B
        title: 移除 worktree 相關方法與 worktreeBranches 欄位
        tasks:
          - id: P1.B.t1
            text: 在 `backend/src/services/workspace/gitService.ts` 中刪除 `createDetachedWorktree` 方法、`removeWorktree` 方法、`getWorktreeBranches` 方法、檔案頂部的 `parseWorktreeLine` helper。同步移除已不再被使用的 import（若有）。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed:
              - backend/src/services/workspace/gitService.ts
          - id: P1.B.t2
            text: 在 `gitService.ts` 的 `getLocalBranches` 回傳型別與實作中移除 `worktreeBranches` 欄位：回傳改為 `Result<{ branches: string[]; current: string }>`，內部不再呼叫 `getWorktreeBranches`。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed:
              - backend/src/services/workspace/gitService.ts

      - id: P1.C
        title: 改寫 gitService worktree 測試為 gitServiceClone 測試
        tasks:
          - id: P1.C.t1
            text: 刪除 `backend/tests/unit/gitServiceWorktree.test.ts`，新增 `backend/tests/unit/gitServiceClone.test.ts` 並涵蓋以下案例：(1) 成功流程 — 對一個 git init + commit + 設好 origin 的暫存來源 repo 呼叫 `createLocalClone`，驗證 runDir 內存在 `.git`、`git remote get-url origin` 回傳的是原本來源 repo 的 origin URL（非 sourceRepoPath）。(2) 安全檢查 — 傳入位於 `config.repositoriesRoot` 之外的 runDir，回傳 err。(3) `syncToRemoteLatest` per-repo 去重 — 對同一 workspacePath 並發呼叫 3 次，驗證底層 fetch 只被觸發 1 次（用 testdouble 攔截 simple-git 的 fetch）。(4) `syncToRemoteLatest` fetch all — 驗證底層執行的是 `git fetch origin --prune`，且不執行 reset --hard。(5) `getLocalBranches` 回傳值不再含 `worktreeBranches` 欄位。Mock 邊界：不 mock `gitService` 自身、只在必要處 mock simple-git 的呼叫；其餘走真實檔案系統暫存目錄。
            completed: true
            attempts: 0
            last_failure: null
            last_files_changed:
              - backend/tests/unit/gitServiceClone.test.ts
              - backend/tests/unit/gitServiceWorktree.test.ts

