feature: editor-ux-cleanup
approved: true
scenarios:
  - id: F1
    scenario: 使用者在同一個 Pod 內複製整列 todos 後貼上
    given:
      - 使用者已開啟某個 Pod 的 Goal Editor
      - Goal 內已有若干 todo
    when:
      - 使用者點「複製」按鈕
      - 使用者點「貼上」按鈕
    then:
      - 既有 todos 後方新增等量的 todos
      - 新增的 todos 順序與文字與複製來源一致

  - id: F2
    scenario: 使用者跨 Pod 把 A 的 todos 貼到 B
    given:
      - 使用者已在 Pod A 的 Goal Editor 點過「複製」
      - 使用者關閉 Pod A modal 後開啟 Pod B 的 Goal Editor
      - Pod B 原本有若干 todo 或為空
    when:
      - 使用者在 Pod B Goal Editor 點「貼上」按鈕
    then:
      - Pod B 既有 todos 後方新增 Pod A 複製過去的 todos
      - 新增 todos 的順序與文字保留

  - id: F3
    scenario: 使用者在 clipboard 為空時試圖貼上
    given:
      - 使用者開啟 Goal Editor
      - 本 session 從未點過「複製」
    when:
      - 使用者看向「貼上」按鈕
    then:
      - 「貼上」按鈕為不可點（灰掉的 disabled 狀態）
      - 使用者不會誤觸貼上後跳出錯誤

  - id: F4
    scenario: 使用者編輯 Todo 時把內容清空後按儲存
    given:
      - 使用者在 Goal Editor 點某個 todo 進入 GoalTodoEditorModal
      - textarea 原本有文字
    when:
      - 使用者把 textarea 內容全部刪除
      - 使用者點「儲存」按鈕
    then:
      - textarea 出現紅框
      - 紅框下方顯示「禁止留空」錯誤訊息
      - modal 停留在編輯狀態
      - 儲存按鈕保持可點（不 disable）

  - id: F5
    scenario: 使用者修正留空錯誤後再次儲存
    given:
      - 使用者剛剛觸發過 F4 的留空錯誤
      - textarea 處於紅框 + 錯誤訊息狀態
    when:
      - 使用者重新輸入非空文字
      - 使用者點「儲存」按鈕
    then:
      - 紅框與錯誤訊息消失
      - todo 文字更新到 Goal Editor 列表
      - 子 modal 關閉並回到主 Goal Editor

  - id: F6
    scenario: 開發者執行測試時不再看到無意義測試
    given:
      - 專案先前包含純邊界測試與純 UI 結構測試
      - 使用者已逐項確認過候選清單
    when:
      - 使用者執行 `bun run test`
    then:
      - 先前確認要刪的無意義測試不會被執行
      - 保留下來的 integration / userflow / 真實業務邏輯測試全綠通過
      - 若有任何 user flow 未被既有 integration test 覆蓋，順手補上一個 integration test
