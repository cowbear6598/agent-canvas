feature: editor-ux-cleanup
created: "2026-05-17"
approved: true
questions:
  - id: Q1
    text: Goal Editor 當前實作位置與架構為何（主 modal、子 todo modal、相關 store / composable）？
    type: codebase-investigation
    completed: true
    answer: |
      - 主 modal：frontend/src/components/pod/GoalEditorModal.vue（todo 列表 + 拖曳排序 + Save 按鈕）
      - 子 modal：frontend/src/components/pod/GoalTodoEditorModal.vue（純 <textarea>，
        class doodle-textarea，min-height 8rem，無自訂 paste / clipboard listener）
      - Form 邏輯：frontend/src/composables/pod/useGoalEditorForm.ts
        （updateTodo(todoId, text) 只寫入 todo.text，無驗證）
      - Type：frontend/src/types/pod.ts:6-13
        interface GoalTodoItem { id: string; text: string }
        interface PodGoal { todos: GoalTodoItem[] }
      - Store：frontend/src/stores/pod/podStore.ts
        goalEditorPodId、setGoalWithBackend() 走 WebSocket 持久化
      - 儲存時機：明確 Save 按鈕（非 blur）；空 list 會把 goal 設為 null

  - id: Q2
    text: 編輯 Todo 留空時的當前行為與專案內已有的驗證 pattern 為何？
    type: codebase-investigation
    completed: true
    answer: |
      - 當前行為：GoalTodoEditorModal.vue:39-43 handleSave() 對空字串 silent drop
        （trim 後 length === 0 直接 return，不關 modal、不報錯，等同沒做事）
      - 已有 pattern：GoalEditorModal.vue 已用 validationMessage ref（line 28）+
        <p v-if="validationMessage" class="goal-editor-validation">（line 134-138）+
        red-brown 文字色（line 264-268 oklch(0.52 0.18 25)）
      - i18n key 命名慣例：pod.goal.editor.validation.noEmptyRows（zh-TW.json:245）
        → 子 modal 可沿用 pod.goal.editor.subModal.validation.* 同層階
      - 其他紅色錯誤樣式：CanvasSecurityModal、IntegrationAppsModal 使用 text-red-500
        （此處沿用 GoalEditorModal 的 doodle 風格 oklch 而非 text-red-500 以維持一致性）

  - id: Q3
    text: 目前 codebase 既有的「無意義測試」候選與「真正 userflow 測試」分布為何？
    type: codebase-investigation
    completed: true
    answer: |
      測試框架：Vitest + @vue/test-utils（前端 138 tests）、Vitest via Bun（後端 306 tests）

      Real userflow（應保留）：
      - frontend/tests/integration/canvasPodFlow.test.ts
      - frontend/tests/integration/copyPasteFlow.test.ts
      - frontend/tests/integration-providers/*（jira / slack / telegram / webhook / sentry）
      - backend/tests/integration-providers/*

      候選「無意義邊界測試」（純資料 / 純工具 / 形狀驗證）：
      - frontend/tests/utils/safeJsonParse.test.ts
      - frontend/tests/utils/errorSanitizer.test.ts
      - frontend/tests/utils/throttle.test.ts
      - frontend/tests/utils/domHelpers.test.ts
      - frontend/tests/composables/useMenuPosition.test.ts
      - backend/tests/unit/capabilities.test.ts（純 Set/value 形狀驗證）

      候選「無意義 UI 測試」（DOM 結構 / style 計算 / render snapshot 類）：
      - frontend/tests/composables/useMenuPosition.test.ts（重複，含 style geometry）
      - frontend/tests/composables/useDragHandler.test.ts（部分 DOM mock，需逐項看）
      - 部分 store 測試（canvasStore 初始狀態、簡單 getter / setter）

      不確定（需使用者本人判斷）：
      - 各 composable 測試（useEscapeClose、useModalForm 等）— 邏輯 vs DOM mock 混合
      - 各 store 測試是否與 integration test 高度重複
      - 後端 unit/ 內各種 retry / decision 邏輯測試（看起來是真實業務邏輯）

  - id: Q4
    text: 複製 / 貼上要做在「主 GoalEditorModal 的 todo 列表」還是「子 GoalTodoEditorModal 的 textarea」，要支援的單位是哪幾種？
    type: user-input
    completed: true
    answer: |
      只做主 GoalEditorModal 的 todo 列表，支援的單位是「整列 todos」（結構化的
      GoalTodoItem[]）。GoalTodoEditorModal 的 textarea 不另外加 paste 處理，維持
      瀏覽器原生 paste。

  - id: Q5
    text: 多行文字貼上時，是否要自動切成多個 todo（例如貼上三行 → 變三個 todo），還是維持原生 textarea 換行行為（停在原本那個 todo 內）？
    type: user-input
    completed: true
    answer: |
      因為 Q4 決定只在主列表做結構化 todos 複製 / 貼上，貼上時數量 1:1 對應：
      複製 N 個 todo → 貼上 N 個 todo（不切多、不合併、不依文字換行切割）。
      textarea 內的多行文字一律維持原生行為，不額外切多 todo。

  - id: Q6
    text: 是否要支援「跨 Pod / 跨 Goal」複製貼上（從 A Pod 的 goal 複製 todo 後到 B Pod 的 goal 貼上）？若要，是用瀏覽器系統剪貼簿、還是專案內 clipboardStore？
    type: user-input
    completed: true
    answer: |
      支援跨 Pod / 跨 Goal 複製貼上，走專案內 clipboardStore（結構化）。
      跨 Pod 貼上會保留結構化 GoalTodoItem 形狀；不走系統剪貼簿，因此不會跟外部
      app 互通，但能維持 id / 順序等結構化資訊。

  - id: Q7
    text: Todo 編輯留空時的錯誤顯示時機要「即時顯示（使用者打字過程就出現紅框）」還是「按下儲存才顯示」？儲存按鈕在錯誤狀態下要不要被 disable？
    type: user-input
    completed: true
    answer: |
      按下「儲存」才觸發驗證；儲存按鈕本身不 disable（保持可點），點下後才顯示
      紅框 + 錯誤訊息。沿用 GoalEditorModal 現有 validationMessage pattern。

  - id: Q8
    text: 留空錯誤訊息要用使用者描述的「禁止留空」原字串、還是套用既有 i18n 風格（例如「請輸入內容」等更柔和措辭）？
    type: user-input
    completed: true
    answer: |
      用「禁止留空」原字串作為 zh-TW i18n value（key 命名沿用既有 pod.goal.editor
      層階，例如 pod.goal.editor.subModal.validation.noEmpty）。

  - id: Q9
    text: 測試清理範圍只動前端、還是前後端一起？後端那 300+ 測試中是否也要找一波無意義邊界測試？
    type: user-input
    completed: true
    answer: |
      前後端一起清。本次 plan 同時涵蓋 frontend/tests/ 與 backend/tests/ 的無意義
      邊界 / UI / 形狀驗證測試。

  - id: Q10
    text: 測試清理採「我列候選清單 → 你逐個確認再刪」還是「直接以原則砍光」？刪除是否需要對應補上新的 userflow integration test，還是只刪不補？
    type: user-input
    completed: true
    answer: |
      採「列候選清單 → 逐項確認再刪」模式。Plan 階段必須先把每個候選測試（檔
      案路徑 + 一句說明為什麼被歸類為無意義）列出，由使用者逐項點頭。若刪除過程
      中發現某個 user flow 沒有被既有 integration test 覆蓋，順手補一個 integration
      test 以維持 userflow 覆蓋；不補單純的單元測試。
