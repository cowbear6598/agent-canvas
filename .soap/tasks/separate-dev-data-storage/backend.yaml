            completed: true
            last_files_changed:
              - backend/src/config/index.ts
      - id: P1.B
        title: 開發啟動入口切到獨立資料夾
        tasks:
          - id: P1.B.t1
            text: 調整 `backend/package.json` 的 `dev` script，固定注入 `AGENT_CANVAS_APP_DATA_DIR=$HOME/Documents/Development/AgentCanvas`，讓本機開發環境預設寫入獨立資料夾
            completed: true
            last_files_changed:
              - backend/package.json
          - id: P1.B.t2
            text: 若 `backend/src/cli.ts` 需要引用共用 resolver，將 `APP_DATA_DIR`、`PID_FILE`、`CONFIG_FILE`、`LOG_DIR` 與 `LOG_FILE` 的無 override fallback 維持在 `~/Documents/AgentCanvas`，避免部署 daemon 預設落到 development 目錄
            completed: true
            last_files_changed:
              - backend/src/cli.ts

