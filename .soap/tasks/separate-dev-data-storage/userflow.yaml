feature: separate-dev-data-storage
approved: true
scenarios:
  - id: F1
    scenario: 開發者在開發環境使用 Agent Canvas
    given:
      - 開發者在同一台電腦上也有正式版 Agent Canvas 資料
      - 開發者啟動的是開發環境
    when:
      - 開發者在開發環境建立或修改資料
    then:
      - 新資料寫入 `~/Documents/Development/AgentCanvas`
      - 正式版既有資料不被覆蓋

  - id: F2
    scenario: 使用者在正式版使用 Agent Canvas
    given:
      - 同一台電腦上已存在開發環境資料
      - 使用者啟動的是正式版
    when:
      - 使用者在正式版建立或修改資料
    then:
      - 資料繼續寫入 `~/Documents/AgentCanvas`
      - 開發環境資料不被讀取

  - id: F3
    scenario: 開發者在開發環境使用需要讀取資料庫的功能
    given:
      - 開發者啟動的是開發環境
      - 開發環境資料庫已建立在 `~/Documents/Development/AgentCanvas`
    when:
      - 開發者使用需要讀取既有資料的功能
    then:
      - 系統讀取開發環境資料庫
      - 正式版資料庫內容不會混入
