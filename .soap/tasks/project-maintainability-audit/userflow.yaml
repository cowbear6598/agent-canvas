feature: project-maintainability-audit
approved: true
scenarios:
  - id: F1
    scenario: 維護者取得可執行的複雜度優化清單
    given:
      - 專案已有前端程式碼
      - 專案已有後端程式碼
      - 多個模組承擔多種責任
    when:
      - 維護者檢視優化計畫
      - 維護者依照熱點排序挑選下一批重構
    then:
      - 每個熱點都有明確的問題描述
      - 每個熱點都有可執行的拆分方向
      - 優化順序能反映維護風險

  - id: F2
    scenario: 開發者用更清楚的模組邊界修改前端流程
    given:
      - 開發者需要修改畫布互動
      - 開發者需要修改 pod 顯示規則
      - 開發者需要修改 WebSocket 事件處理
    when:
      - 開發者依照前端優化計畫調整程式碼
    then:
      - 狀態邏輯與畫面元件責任分離
      - 資料轉換規則集中在可命名模組
      - 新增測試能驗證使用流程或商業規則

  - id: F3
    scenario: 開發者用更清楚的服務邊界修改後端流程
    given:
      - 開發者需要修改 provider 執行流程
      - 開發者需要修改設定管理流程
      - 開發者需要修改 workflow 執行流程
    when:
      - 開發者依照後端優化計畫調整程式碼
    then:
      - handler 只負責請求轉接與回應
      - orchestration 與 domain decision 分離
      - 外部服務邊界能用 fake harness 驗證

  - id: F4
    scenario: 維護者刪除或改寫低價值測試
    given:
      - 專案已有測試盤點文件
      - 測試中存在 mock 呼叫次數驗證
      - 測試中存在 UI render 細節驗證
    when:
      - 維護者依照測試品質計畫審查測試
    then:
      - 無產品規則的測試被刪除
      - 有價值但粒度錯誤的測試被改寫
      - 保留測試能對應使用流程或商業邏輯

  - id: F5
    scenario: 維護者收斂無必要 fallback
    given:
      - 專案存在歷史資料正規化 fallback
      - 專案存在外部服務錯誤處理
      - 專案存在為避免空值而加入的防衛分支
    when:
      - 維護者依照 fallback 審查計畫逐項判斷
    then:
      - 真實外部邊界保留明確錯誤契約
      - 正規流程不可達的 fallback 被移除
      - 可由 schema 或寫入路徑保證的狀態回到根因修正

  - id: F6
    scenario: 團隊用自動驗證確認優化沒有破壞既有行為
    given:
      - 前端優化已完成
      - 後端優化已完成
      - 測試整理已完成
    when:
      - 團隊執行自動驗證指令
    then:
      - 型別與 lint 檢查通過
      - 測試套件通過
      - 失敗訊息能指向真實使用流程或商業規則
