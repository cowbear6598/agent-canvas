feature: project-maintainability-audit-2
side: frontend
approved: true
phases:
  - id: P1
    title: 前端複雜度與職責盤點
    parallel: true
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P1.A
        title: 大型元件與入口協調 review
        tasks:
          - id: P1.A.t1
            text: 檢查 `frontend/src/App.vue` 的初始化、WebSocket、store reset、security、modal orchestration 是否混在同一層，整理可拆分的協調責任與具體檔案位置
            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md
          - id: P1.A.t2
            text: 檢查 `frontend/src/components/settings/OpencodeSettingsPanel.vue`、`frontend/src/components/settings/GlobalSettingsModal.vue`、`frontend/src/components/pod/PodModelSelector.vue`、`frontend/src/components/canvas/ScheduleModal.vue` 是否混合 UI、資料轉換、API 呼叫與狀態同步，列出需要抽到 composable 或 store action 的候選
            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md
      - id: P1.B
        title: Store 與狀態流 review
        tasks:
          - id: P1.B.t1
            text: 檢查 `frontend/src/stores/connectionStore.ts`、`frontend/src/stores/run/runStore.ts`、`frontend/src/stores/pod/podStore.ts` 的 action 是否承擔多個責任，列出可拆成 domain helper、mapper、或事件處理器的候選
            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md
          - id: P1.B.t2
            text: 檢查前端 WebSocket response types、API service、Pinia store 之間是否存在重複資料轉換或命名不一致，整理跨層 contract 風險
            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md

  - id: P2
    title: 前端測試有效性 review
    parallel: true
    verification:
      - cd frontend && bun run style
      - cd frontend && bun run test:run
    done: true
    items:
      - id: P2.A
        title: 低價值測試候選分類
        tasks:
