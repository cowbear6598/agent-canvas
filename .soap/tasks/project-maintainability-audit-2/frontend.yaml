            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md
      - id: P2.C
        title: 前端測試設定 review
        tasks:
          - id: P2.C.t1
            text: 檢查 `frontend/tests/setup.ts` 的全域 console mock 設定，整理哪些 warning 或 error 應在測試失敗時浮出
            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md

