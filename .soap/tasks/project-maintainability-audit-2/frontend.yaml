            text: 逐段檢查 `frontend/tests/business-logic/utils/renderMarkdown.test.ts`，把純 Markdown library render 測例、sanitizer 測例、link attribute 契約測例分成刪除、保留、改寫三類
            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md
          - id: P2.A.t2
            text: 逐段檢查 `frontend/tests/business-logic/lib/arrayHelpers.test.ts` 與 `frontend/tests/business-logic/stores/podStore.test.ts`，標出測 `Array.filter`、getter 鏡射、初始狀態鏡射的測例，並列出保留條件
            completed: true
            last_files_changed:
              - .soap/tasks/project-maintainability-audit-2/frontend-review.md
      - id: P2.B
        title: 易脆 user flow 與 mock 測試 review
        tasks:
          - id: P2.B.t1
            text: 檢查 `frontend/tests/business-logic/composables/canvas/useNoteEventHandlers.test.ts` 是否過度依賴 mock store 呼叫序列，整理可改成使用者行為或狀態結果斷言的測例
