feature: project-maintainability-audit-2
created: "2026-05-25"
approved: true
questions:
  - id: Q1
    text: 專案目前的前端、後端與共享模組架構如何分布？
    type: codebase-investigation
    completed: true
    answer: |
      專案是 monorepo 結構，root `package.json` 串接前後端驗證與建置。前端位於 `frontend/`，入口是 `frontend/src/main.ts`，主協調元件是 `frontend/src/App.vue`，使用 Vue 3、TypeScript、Pinia、Tailwind CSS、Shadcn UI 風格元件，主要程式碼分布在 `frontend/src/components`、`frontend/src/composables`、`frontend/src/stores`、`frontend/src/services`、`frontend/src/types`、`frontend/src/integration`、`frontend/src/locales`。後端位於 `backend/`，入口是 `backend/src/index.ts`，使用 Bun + TypeScript + Bun 原生 WebSocket；HTTP API router 位於 `backend/src/api/apiRouter.ts`，WebSocket handler 註冊集中在 `backend/src/handlers/index.ts` 並透過 `backend/src/services/eventRouter.ts` 分派。後端主要程式碼分布在 `backend/src/api`、`backend/src/handlers`、`backend/src/services`、`backend/src/database`、`backend/src/schemas`、`backend/src/types`、`backend/src/utils`。共享工具位於 `shared/`，目前包含 `safeJsonParse.ts`、`throttle.ts`。
  - id: Q2
    text: 哪些區域最可能是複雜度、可維護性與可讀性 review 的高風險範圍？
    type: codebase-investigation
    completed: true
    answer: |
      以檔案規模與職責集中度粗掃，主要高風險區域包含大型服務與 store：`backend/src/services/claude/streamingChatExecutor.ts`、`backend/src/database/statements.ts`、`frontend/src/stores/connectionStore.ts`、`backend/src/services/podStore.ts`、`backend/src/services/workflow/runExecutionService.ts`、`backend/src/services/provider/opencodeAliasService.ts`、`frontend/src/stores/run/runStore.ts`、`backend/src/services/provider/codexProvider.ts`、`backend/src/services/runStore.ts`、`backend/src/services/workspace/gitService.ts`。前端大型元件如 `frontend/src/App.vue`、`frontend/src/components/settings/OpencodeSettingsPanel.vue`、`frontend/src/components/pod/PodModelSelector.vue`、`frontend/src/components/canvas/ScheduleModal.vue`、`frontend/src/components/settings/GlobalSettingsModal.vue` 也需要檢查是否混合 UI、狀態、API 與資料轉換責任。跨端同步風險集中在 WebSocket request/response types、handler registry、HTTP API route table、integration/plugin/MCP/provider/workflow 等跨系統狀態區域。
  - id: Q3
    text: 測試套件目前如何分布，review 時應如何辨識低價值或無用測試？
    type: codebase-investigation
    completed: true
    answer: |
      前後端測試都使用 Vitest。root `bun run test` 會執行後端 `bun run test` 與前端 `bun run test:run`；root `bun run style` 會分別執行前後端 style。前端目前有 83 個 `frontend/tests/**/*.test.ts`，包含 business-logic 59 個、userflows 18 個、integration 6 個。後端目前有 147 個 `backend/tests/**/*.test.ts`，包含 business-logic 122 個、userflows 18 個、integration 5 個、database 2 個。測試檔案規模高風險區包含 `frontend/tests/business-logic/stores/connectionStore.test.ts`、`backend/tests/business-logic/opencodeProvider.test.ts`、`backend/tests/business-logic/streamingChatExecutor.test.ts`、`frontend/tests/business-logic/stores/run/runStore.test.ts`、`frontend/tests/business-logic/stores/chat/chatMessageActions.test.ts`。已粗掃出的低價值或易脆候選包含：`frontend/tests/business-logic/utils/renderMarkdown.test.ts` 內純 Markdown render 測例偏測 marked 本身，但 XSS/sanitizer/link attribute 測試有價值；`frontend/tests/business-logic/lib/arrayHelpers.test.ts` 的 `removeById` 多數測例偏測 `Array.filter`；`backend/tests/business-logic/safeJsonParse.test.ts` 的泛型型別推斷與純 JSON.parse 測例 runtime 保護力較低；`frontend/tests/business-logic/stores/podStore.test.ts` 的 getter 測例有初始狀態與資料容器鏡射風險；`backend/tests/business-logic/claudeProviderBuildOptions.test.ts`、`opencodeProvider.test.ts`、`streamingChatExecutor.test.ts` mock 密度高，需要區分跨 SDK/provider 邊界的必要 mock 與只驗證 mock 組裝的低價值測例；`frontend/tests/business-logic/composables/canvas/useNoteEventHandlers.test.ts`、`frontend/tests/userflows/canvas/canvasPodInteractionsFlow.test.ts`、`frontend/tests/userflows/settings/opencodeSettingsFlow.test.ts` 有 implementation detail selector 或 stub render 斷言風險。低價值測試的 review 判準會依 shared test policy：刪除或改寫純 UI render 同義反覆、只鏡射初始狀態、測 framework 行為、mock 自己寫的 service/domain、直接 mock 第三方 library 內部、只驗證常數或 getter 的測試；保留 user flow、integration、商業邏輯、資料規格化、安全與真實錯誤路徑測試。
  - id: Q4
    text: 專案有哪些可用的 verification 指令可支援後續 review 與修改？
    type: codebase-investigation
    completed: true
    answer: |
      root 可用 `bun run style` 與 `bun run test`；前端可用 `bun run style`、`bun run test`、`bun run test:run`；後端可用 `bun run style`、`bun run test`、`bun run test:watch`。依專案指示，不需要執行 `bun run dev`。若後續修改後端程式碼，需要提醒使用者重啟後端常駐服務。
