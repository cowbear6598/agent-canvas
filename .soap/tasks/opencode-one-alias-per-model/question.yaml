feature: opencode-one-alias-per-model
created: "2026-05-23"
approved: true
questions:
  - id: Q1
    text: 目前 opencode model alias 的資料模型與唯一性限制是什麼？
    type: codebase-investigation
    completed: true
    answer: |
      後端使用 SQLite `model_aliases` 表保存 opencode alias，欄位包含 `provider_id`、`real_provider`、`real_model`、`alias`、`order_idx` 與 thinking preset metadata。目前 DB 唯一限制是 `UNIQUE(provider_id, real_provider, alias)`，只限制同一 real provider 內 alias 名稱不可重複，尚未限制同一 `real_provider + real_model` 只能出現一筆 alias。
  - id: Q2
    text: opencode alias 新增與更新目前在哪裡處理，錯誤如何回傳前端？
    type: codebase-investigation
    completed: true
    answer: |
      WebSocket handler 位於 `backend/src/handlers/opencodeSettingsHandlers.ts`。`handleOpencodeAliasesCreate` 會取得 thinking preset snapshot 後 insert，SQLite unique 衝突會轉成 `alias_duplicate`。`handleOpencodeAliasesUpdate` 允許更新 alias 與 `modelID`，並在舊 model 正被使用且沒有其他 alias 時阻擋，回傳 `alias_in_use`。目前沒有「model 已有 alias」的錯誤碼；前端 `createWebSocketRequest` 已集中處理結構化錯誤碼，可擴充新的錯誤碼與 zh-TW 文案。
  - id: Q3
    text: 前端新增 alias 的 UI 是否已有本地唯一性檢查？
    type: codebase-investigation
    completed: true
    answer: |
      `frontend/src/stores/opencodeAliasStore.ts` 目前提供 `isAliasUnique(providerID, alias, excludeId?)`，只檢查同 providerID 下 alias 名稱是否唯一。`OpencodeSettingsPanel.vue` 的新增與編輯流程會先呼叫這個 getter，避免送出重複 alias 名稱；尚未檢查同 providerID + modelID 是否已存在另一筆 alias。
  - id: Q4
    text: Toast 目前從哪裡渲染，為什麼會蓋住 Canvas 選擇？
    type: codebase-investigation
    completed: true
    answer: |
      Toast 由 `frontend/src/components/ui/toast/Toast.vue` Teleport 到 body，`.toast-container` 使用 `position: fixed; top: 20px; right: 20px; z-index: 9999`。因為 Header 位於畫面頂部，Canvas 選擇也在 Header 區域附近，toast 從 20px 開始顯示會覆蓋該區域。調整 toast container 的 top offset 到 Header 高度下方即可避免遮擋。
  - id: Q5
    text: 此需求是否需要新增或更新 API Router 文件？
    type: codebase-investigation
    completed: true
    answer: |
      不需要。opencode alias 使用既有 WebSocket event：`opencode:aliases:create`、`opencode:aliases:update` 與相關 result event，不涉及新增、更新或刪除 REST API Router；依專案規則 WebSocket 不需要更新 API 文件。
