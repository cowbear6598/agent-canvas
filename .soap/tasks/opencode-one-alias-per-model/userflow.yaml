feature: opencode-one-alias-per-model
approved: false
scenarios:
  - id: F1
    scenario: 使用者為尚未設定別稱的 opencode model 新增 alias
    given:
      - 使用者已開啟 LLM Provider 設定
      - 使用者正在管理 opencode model aliases
      - 選定的 model 尚未有 alias
    when:
      - 使用者點擊新增 model alias
      - 使用者選擇 model
      - 使用者輸入 alias
      - 使用者儲存 alias
    then:
      - 系統成功新增 alias
      - alias 清單顯示新項目
      - 使用者可在 opencode model 選項中看到該 alias

  - id: F2
    scenario: 使用者嘗試為已設定 alias 的 opencode model 再新增 alias
    given:
      - 使用者已開啟 LLM Provider 設定
      - 使用者正在管理 opencode model aliases
      - 選定的 model 已經有一筆 alias
    when:
      - 使用者點擊新增 model alias
      - 使用者選擇相同 model
      - 使用者輸入另一個 alias
      - 使用者儲存 alias
    then:
      - 系統阻擋新增 alias
      - 系統顯示 model 已有 alias 的提示
      - alias 清單維持原本項目

  - id: F3
    scenario: 使用者操作畫布時看到 toast 從 Header 下方出現
    given:
      - 使用者正在畫布頁面
      - Header 顯示 Canvas 選擇
    when:
      - 系統顯示 toast
    then:
      - toast 從 Header 下方開始顯示
      - toast 不遮住 Canvas 選擇
