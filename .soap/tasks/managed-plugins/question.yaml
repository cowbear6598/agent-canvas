    answer: |
      使用者授權我決定。決定如下：
        Icon：Lucide `Puzzle`（plugin 慣用語意，與既有 Bot / KeyRound 風格一致）
        位置：放在 MCP（Bot icon）按鈕的右側、Integrations（KeyRound icon）按鈕的左側
