questions:
  - id: Q1
    text: 目前 `backend/src/services/provider/claude/buildClaudeOptions.ts` 怎麼把 Pod 的 pluginIds 轉成 SDK 的 plugins 選項？傳給 Claude Agent SDK 的格式長什麼樣？
    type: codebase-investigation
    completed: true
    answer: |
      `buildClaudeOptions.ts` L173-190 的 `applyPlugins()` 呼叫 `pluginScanner.ts`
      的 `scanInstalledPlugins("claude")` 取得「已安裝 plugin 列表」，再用 Set 過濾
      Pod.pluginIds，最後轉成 `SdkPluginConfig[]`：
        { type: 'local', path: <installPath 絕對路徑> }
      SDK plugin path 直接取自 `~/.claude/plugins/installed_plugins.json` 中
      `PluginEntry.installPath`。pluginScanner 對 path 做 `~/.claude/plugins/`
      內的安全檢查（isPathWithinDirectory）。掃描有 30 秒 TTL 快取。
      Pattern 與 mcpServers 處理高度相似（同樣 apply* + Set 過濾 + 轉 SDK 結構）。

  - id: Q2
    text: 目前 `backend/src/handlers/pluginHandlers.ts` 提供哪些 API？讀取邏輯來源是什麼（`~/.claude/plugins/installed_plugins.json`）？前端 `pluginApi.ts` 對應呼叫哪些 WebSocket 事件？
    type: codebase-investigation
    completed: true
    answer: |
      後端 `pluginHandlers.ts` 目前只提供 `PLUGIN_LIST` 一個 action（純唯讀），
      回傳 shape：{ id, name, version, description, repo, compatibleProviders }。
      資料來源：`pluginScanner.ts` 讀 `~/.claude/plugins/installed_plugins.json`
      (Claude) 與 `~/.codex/plugins/cache/` (Codex)，30 秒 TTL 快取。
      Path 可被 env 覆蓋：`CLAUDE_PLUGINS_INSTALLED_PATH` 與
      `CLAUDE_PLUGINS_ROOT_OVERRIDE`。
      前端 `pluginApi.ts` 對應 WebSocket 事件：`PLUGIN_LIST` →
      `PLUGIN_LIST_RESULT`，亦有 30 秒前端快取。
      前端**目前沒有** plugin store（也沒有 usePluginStore），呼叫散佈在
      pluginApi 與 PluginPopover 中。

  - id: Q3
    text: 目前 `pod_plugin_ids` table 的 schema 是什麼？Pod 在 UI 哪邊選 plugin（PodSettingsModal 之類）？plugin id 在實作中是字串還是 manifest 的 name 欄位？
    type: codebase-investigation
    completed: true
    answer: |
      Schema 在 `backend/src/database/schema.ts` L75-80：
        pod_plugin_ids(pod_id TEXT, plugin_id TEXT, PK(pod_id, plugin_id),
                       FK CASCADE → pods)
      Pod entity 型別在 `backend/src/types/pod.ts` L40：`pluginIds: string[]`。
      pluginId 是字串（來自 installed_plugins.json 的 key，即 plugin 安裝 ID）。
      讀寫層在 `backend/src/services/podStore.ts`：`batchLoadRelations()`、
      `updateJoinTablesByPod()`。
      前端 UI 元件在 `frontend/src/components/pod/PluginPopover.vue`（可搜尋
      清單 + toggle）。資料源呼叫 `pluginApi.listPlugins(provider)`，更新走
      `podPluginApi.updatePodPlugins()` → `POD_SET_PLUGINS` 事件。

  - id: Q4
    text: 後端目前有沒有 git clone 相關的依賴或共用模組（例如執行 git command 的 wrapper）？sandbox / cwd 是怎麼處理 Pod 工作目錄的？
    type: codebase-investigation
    completed: true
    answer: |
      Git wrapper 已現成：`backend/src/utils/operationHelpers.ts` 的
      `gitOperation()` / `gitOperationWithPath()`，底層用 `simple-git`。
      使用點：gitService.ts、repositoryCloneHandlers.ts、backupService.ts。

      APP_DATA_DIR：`~/Documents/AgentCanvas`（`backend/src/cli.ts` L12），
      底下放 `canvas.db`、`logs/`、`config.json`。Plugin 自管目錄建議放
      `{APP_DATA_DIR}/plugins/`（目前尚無此目錄）。

      Pod workspacePath：`canvasDir/pod-{podId}`，由 `podService.createPodWithWorkspace`
      → `workspaceService.createWorkspace`（fs.mkdir recursive）建立。
      Sandbox 在 buildClaudeOptions 不設，由 `claudeService` 動態組裝；
      permissionMode 固定 `bypassPermissions`，allowedTools 含 Read/Write/Edit/
      Bash/Glob/Grep/Skill/WebSearch。
      `claudeSandboxPaths.ts` 的 `buildClaudeSandboxAllowWrite()` 含
      workspacePath + ~/Library/Application Support (macOS) + /tmp + MCP cache。

