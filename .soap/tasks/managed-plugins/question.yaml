  - id: Q15
    text: 既有 Pod 已綁定的 pluginIds（來源是舊的 `~/.claude/plugins/installed_plugins.json`）在改成自管 plugin 之後，這些舊 pluginIds 要如何處置？
    type: user-input
    completed: true
    answer: |
      全部清空（`pod_plugin_ids` 整表 truncate）。使用者切到自管後從新 UI
      自行重新勾選 plugin。

  - id: Q16
    text: 為了讓 Codex 等不支援 Claude Code Plugin 的 provider 也能取用 plugin 內容，自製 MCP server 需要暴露哪些能力？適用 provider 範圍是什麼？
    type: user-input
    completed: true
    answer: |
      使用者描述：「循序漸進 Skill 應該會去提及裡面的內容 MCP 要有辦法調用
      出來給 POD 看資訊，然後 exec scripts 也要可以」。

      判讀為：暴露範圍 = Skill 列表 + Skill 內容（SKILL.md）讀取 + plugin 內
      `scripts/` 等檔案讀取與執行（exec script）。Skill 內容當「索引」引導
      Pod 知道 plugin 還能做什麼，再由 MCP tool 取得對應檔案或觸發 script。

      不包含 commands / agents 的特殊 tool 包裝（這些是 Claude Code 私有概念，
      若 Pod 真需要可透過「讀檔案」tool 拿到 markdown 內容當 prompt 自行使用）。

      （適用 provider 範圍待 Q19 釐清。）

  - id: Q17
    text: 補充說明（Q10 後續）— Plugin manifest `.claude-plugin/plugin.json` 是 Anthropic 為 Claude Code 訂的官方 spec，欄位是固定的（name / version / description / commands / agents / skills / hooks / mcpServers 等路徑覆寫），不會「各家 AI 寫法不同」（這跟 model / SDK 無關，是 Claude Code 的 manifest 格式）。Codex 等不支援 plugin 的 provider 不需要讀這個檔（會走 Q16 的 MCP server 抽象層）。請確認 manifest 驗證策略。
    type: user-input
    completed: true
    answer: |
      使用者回應：「不止 Claude Code 啊 還有其他家」。意思未完全明確，需再
      釐清是擔心被 Claude Code spec 綁死、或只是強調多 provider 支援。
      待 Q20 確認後再敲定 manifest 驗證策略。

  - id: Q18
    text: 補充細節（Q12 後續）— Plugin 自動偵測更新的細節：(a) 是否記錄安裝時 commit SHA 以利日後重現；(b) 自動 fetch 的觸發點是後端定時 / 開啟 Plugin 管理 modal 時即時 check / 兩者都做；(c) 偵測到有更新時是自動更新還是顯示徽章等使用者手動觸發。
    type: user-input
    completed: true
    answer: |
      (a) 不記錄 commit SHA。
      (b) 觸發點：開啟 Plugin 管理 modal 時即時 check（不做後端定時 fetch）。
      (c) 偵測到有更新時：自動更新（背景拉新版）。

      組合行為：使用者打開 Plugin 管理 modal → 後端對每個 plugin 做 git fetch
      比對 → 若 default branch 有新 commit 則自動 git pull 更新，更新完成後
      將最新狀態回給前端列表顯示。

  - id: Q19
    text: 自製 MCP server 適用的 provider 範圍是什麼？(Q16 後續，使用者未明確選擇)
    type: user-input
    completed: true
    answer: |
      全部 provider 一律走 MCP（選項 Y）。

      重要影響（main agent 提醒）：
      - 放棄 Claude Agent SDK 原生的 `plugins:[{type:"local", path}]` option，
        後端 `buildClaudeOptions.ts` 內 applyPlugins() 邏輯需移除。
      - SDK 原生支援的下列行為將失去（後續 plan 階段如需可在 MCP 層模擬，
        但不會 100% 等價）：
          (1) plugin hooks 自動綁定到 SDK session lifecycle（PreToolUse 等）
          (2) plugin 內 slash commands 自動註冊
          (3) plugin 內 subagents 自動可用
          (4) plugin 內 mcpServers 自動載入
      - 收穫：所有 provider 行為一致；只有一條路徑要維護；Pod 端不需要
        知道自己連的是 Claude 還是 Codex。

  - id: Q20
    text: 「不止 Claude Code 啊 還有其他家」這句的具體意思是什麼？(Q17 後續)
    type: user-input
    completed: true
    answer: |
      使用者澄清：「你沒辦法只讀取 claude code 的 manifest 呀 codex 又跟你
      不一樣 所以會導致你很難做讀取版本 我在想有必要嗎 還是怎樣呢」。

      解析：使用者擔心其他 provider（Codex）有不同 manifest 格式，要支援會
      很麻煩，所以在問 manifest 驗證是不是真有必要。

      實情澄清（main agent 給出的建議）：
      - Codex **沒有自己的 plugin 系統**，也沒有對應 manifest 規格。Plugin
        概念目前只有 Claude Code 有定義。
      - 我們的 plugin 來源全部是 Claude Code Plugin 格式（從 GitHub 安裝的
        repo 一律要符合 `.claude-plugin/plugin.json` spec）。
      - 因 Q19 選擇「全部 provider 走 MCP」，Pod 端不直接接觸 manifest；
        manifest 只在後端用來抽 metadata（plugin name / version）給 UI 顯示，
        以及找 skills / scripts 等資源的路徑。
      - 所以 manifest 驗證最小化即可：clone 下來檢查 `.claude-plugin/plugin.json`
        存在 + 是合法 JSON + `name` 欄位有值。

      最終結論（使用者於第二輪確認後）：完全不驗證 manifest，git clone 成功
      即接受。Metadata 採 best effort 抽取，無 manifest 用 repo 名稱 fallback。
      詳細策略寫在 Q10 答案。
