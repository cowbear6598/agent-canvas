feature: connection-line-thinking-level
approved: true
scenarios:
  - id: F1
    scenario: 使用者建立 connection 後沿用來源 Pod 的 thinking level
    given:
      - 使用者在畫布上已有來源 Pod
      - 來源 Pod 已選擇 thinking level
    when:
      - 使用者從來源 Pod 建立一條 connection 到目標 Pod
      - 使用者開啟該 connection 的設定選單
    then:
      - 使用者看到 summary thinking level 已帶入來源 Pod 的選擇
      - 使用者看到 branch thinking level 已帶入來源 Pod 的選擇

  - id: F2
    scenario: 使用者調整 summary thinking level
    given:
      - 使用者已建立一條 connection
      - 使用者已開啟該 connection 的設定選單
    when:
      - 使用者打開 summary thinking level 選項
      - 使用者選擇另一個 thinking level
    then:
      - connection 顯示新的 summary thinking level
      - 之後該 connection 產生 summary 時使用新的 summary thinking level

  - id: F3
    scenario: 使用者調整 branch thinking level
    given:
      - 使用者已將 connection 設為 branch 模式
      - 使用者已開啟該 connection 的設定選單
    when:
      - 使用者打開 branch thinking level 選項
      - 使用者選擇另一個 thinking level
    then:
      - connection 顯示新的 branch thinking level
      - 之後該 branch group 進行分支判斷時使用新的 branch thinking level

  - id: F4
    scenario: 使用者在不支援 thinking 的模型上查看設定
    given:
      - 使用者已建立一條 connection
      - connection 的 summary 或 branch 模型不支援 thinking
    when:
      - 使用者開啟該 connection 的設定選單
    then:
      - 使用者看不到可選的 thinking level
      - connection 仍可維持原本的 summary 或 branch 設定
