          - id: P1.B.t3
            text: 在 `connectionStore.update()` 支援更新 `summaryThinkingLevel` 與 `branchThinkingLevel`；切離 branch 模式時同步清空 branch provider、branch model、branch thinking level 與 branch label/description
            completed: true
            last_files_changed:
              - backend/src/services/connectionStore.ts

          - id: P1.B.t4
            text: 更新 `connectionStore.updateBranchSiblingSettings()`，當 branch provider、branch model 或 branch thinking level 變更時，在同一 source Pod 的 branch group 內同步 `branchThinkingLevel`
            completed: true
            last_files_changed:
              - backend/src/services/connectionStore.ts

