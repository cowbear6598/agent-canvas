            text: 在 `backend/src/database/schema.ts` 的 `connections` table 新增 `summary_thinking_level TEXT` 與 `branch_thinking_level TEXT`，並補上既有 DB 啟動時的欄位補齊流程，讓舊資料庫也能取得新欄位
            completed: true
            last_files_changed:
              - backend/src/database/schema.ts

          - id: P1.A.t3
            text: 更新 `backend/src/database/statements.ts` 的 connection insert、update、updateReturning SQL，完整讀寫 `summary_thinking_level` 與 `branch_thinking_level`
            completed: true
            last_files_changed:
              - backend/src/database/statements.ts

