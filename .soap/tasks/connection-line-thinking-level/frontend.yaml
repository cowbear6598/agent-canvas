feature: connection-line-thinking-level
side: frontend
approved: true
phases:
  - id: P1
    title: Connection thinking level 前端資料契約
    parallel: false
    verification:
      - bun run style
    done: true
    items:
      - id: P1.A
        title: 型別與 payload mapper
        tasks:
          - id: P1.A.t1
            text: 在 `frontend/src/types/connection.ts` 的 `Connection` 加入 `summaryThinkingLevel?: string | null` 與 `branchThinkingLevel?: string | null`
            completed: true
            last_files_changed:
              - frontend/src/types/connection.ts

          - id: P1.A.t2
            text: 在 `frontend/src/types/websocket/requests.ts` 的 connection create / update payload 加入 `summaryThinkingLevel?: string | null` 與 `branchThinkingLevel?: string | null`
            completed: true
            last_files_changed:
              - frontend/src/types/websocket/requests.ts

          - id: P1.A.t3
            text: 在 `frontend/src/types/websocket/responses.ts` 的 `ConnectionPayloadItem` 加入 `summaryThinkingLevel?: string | null` 與 `branchThinkingLevel?: string | null`
            completed: true
            last_files_changed:
              - frontend/src/types/websocket/responses.ts

          - id: P1.A.t4
            text: 更新 `frontend/src/stores/connectionPayloadMappers.ts`，讓 list、created event、updated event 都能保留 summary 與 branch thinking level 欄位
            completed: true
            last_files_changed:
              - frontend/src/stores/connectionPayloadMappers.ts

      - id: P1.B
        title: ConnectionStore 更新方法
        tasks:
          - id: P1.B.t1
            text: 更新 `frontend/src/stores/connectionStore.ts` 的 `createConnection()`，建立 connection payload 時把 source Pod 的 `providerConfig.thinkingLevel` 帶入 `summaryThinkingLevel` 與 `branchThinkingLevel`
            completed: true
            last_files_changed:
              - frontend/src/stores/connectionStore.ts

          - id: P1.B.t2
            text: 更新 `executeConnectionUpdate()` 的允許欄位，支援送出 `summaryThinkingLevel` 與 `branchThinkingLevel`
            completed: true
            last_files_changed:
              - frontend/src/stores/connectionStore.ts

          - id: P1.B.t3
            text: 新增 `updateConnectionSummaryThinkingLevel(connectionId, summaryThinkingLevel)` 與 `updateConnectionBranchThinkingLevel(connectionId, branchThinkingLevel)`，分別送出 summary 與 branch thinking level 更新
            completed: true
            last_files_changed:
              - frontend/src/stores/connectionStore.ts

          - id: P1.B.t4
            text: 更新 `updateConnectionSummaryProvider()`、`updateConnectionSummaryModel()`、`updateConnectionBranchProvider()` 與 `updateConnectionBranchModel()`，讓 provider/model 切換時可一併送出對應的 default thinking level 或 null
            completed: true
            last_files_changed:
              - frontend/src/stores/connectionStore.ts

  - id: P2
    title: Connection 選單 UI
    parallel: false
    verification:
      - bun run style
    done: true
    items:
      - id: P2.A
        title: Thinking level 選項元件
        tasks:
          - id: P2.A.t1
            text: 在 `frontend/src/components/canvas/connectionMenu/` 建立可重用的 thinking level submenu 元件，輸入 provider、model、目前 level、label 與更新 callback，使用 `providerCapabilityStore.getSupportedThinkingLevels()` 與 label metadata 產生文字選項
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/connectionMenu/ThinkingLevelSubmenu.vue
              - frontend/src/locales/zh-TW.json
              - frontend/src/locales/en.json
              - frontend/src/locales/ja.json

          - id: P2.A.t2
            text: 讓 thinking level submenu 在指定 provider/model 不支援 thinking 時不顯示可選 level，符合不支援 thinking 的 user flow
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/connectionMenu/ThinkingLevelSubmenu.vue

      - id: P2.B
        title: Summary 選單整合
        tasks:
          - id: P2.B.t1
            text: 更新 `SummarySection.vue`，在 summary provider/model 選單旁加入 summary thinking level 子選單，使用目前 connection 的 `summaryThinkingLevel`
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/connectionMenu/SummarySection.vue

          - id: P2.B.t2
            text: 更新 `SummarySection.vue` 的 provider 或 model 切換流程，切換後同步選用新 provider/model 的 default thinking level；若新模型不支援 thinking，送出 null
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/connectionMenu/SummarySection.vue
              - frontend/src/stores/connectionStore.ts

      - id: P2.C
        title: Branch 選單整合
        tasks:
          - id: P2.C.t1
            text: 更新 `BranchSettingsPanel.vue`，在 branch provider/model 選單旁加入 branch thinking level 子選單，使用目前 connection 的 `branchThinkingLevel`
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/connectionMenu/BranchSettingsPanel.vue

          - id: P2.C.t2
            text: 更新 `BranchSettingsPanel.vue` 的 provider 或 model 切換流程，切換後同步選用新 provider/model 的 default thinking level；若新模型不支援 thinking，送出 null
            completed: true
            last_files_changed:
              - frontend/src/components/canvas/connectionMenu/BranchSettingsPanel.vue
              - frontend/src/stores/connectionStore.ts

  - id: P3
    title: 前端測試覆蓋
    parallel: false
    verification:
      - bun run style
      - bun run test:run
    done: true
    items:
      - id: P3.A
        title: Store 與 mapper 測試
        tasks:
          - id: P3.A.t1
            text: 更新 `frontend/tests/business-logic/stores/connectionPayloadMappers.test.ts`，覆蓋 connection payload normalize 與 update event 會保留 summary / branch thinking level
            completed: true
            last_files_changed:
              - frontend/tests/business-logic/stores/connectionPayloadMappers.test.ts

          - id: P3.A.t2
            text: 更新 connection store 相關測試，覆蓋建立 connection 時 payload 會帶入 source Pod 的 thinking level 作為 summary 與 branch 預設值
            completed: true
            last_files_changed:
              - frontend/tests/business-logic/stores/connectionStore.test.ts

      - id: P3.B
        title: User flow 測試
        tasks:
          - id: P3.B.t1
            text: 新增或更新 connection 選單 user flow 測試，覆蓋使用者能在 summary 區塊選擇 summary thinking level
            completed: true
            last_files_changed:
              - frontend/tests/userflows/canvas/connectionThinkingLevelMenuFlow.test.ts

          - id: P3.B.t2
            text: 新增或更新 connection 選單 user flow 測試，覆蓋使用者能在 branch 模式選擇 branch thinking level
            completed: true
            last_files_changed:
              - frontend/tests/userflows/canvas/connectionThinkingLevelMenuFlow.test.ts

          - id: P3.B.t3
            text: 新增或更新 connection 選單 user flow 測試，覆蓋不支援 thinking 的模型不顯示 thinking level 選項
            completed: true
            last_files_changed:
              - frontend/tests/userflows/canvas/connectionThinkingLevelMenuFlow.test.ts
