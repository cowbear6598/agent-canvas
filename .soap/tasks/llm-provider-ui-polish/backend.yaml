feature: llm-provider-ui-polish
side: backend
approved: true

phases:
  - id: P1
    title: 基礎建設（opencode server restart 函式 + WebSocket message type）
    parallel: true
    verification:
      - cd backend && bun run test
      - cd backend && bun run style
    done: true
    items:
      - id: P1.A
        title: 新增 restartOpencodeServer service 函式
        tasks:
          - id: P1.A.t1
            text: |
              在 `backend/src/services/provider/opencodeServer.ts` 新增 export 的
              async 函式 `restartOpencodeServer(): Promise<void>`，放在
              `stopOpencodeServer` 之後。函式內部流程為先呼叫 `stopOpencodeServer()`
              （同步、會關閉子程序並將 state 重置為 idle），緊接著 `await
              startOpencodeServer()`（async、重新 spawn 子程序，會把 state 由
              idle → starting → ready 或 failed）。函式本身不額外加 try-catch，
              讓 `startOpencodeServer()` 既有的失敗處理（將 state 設為 "failed"、
              寫入 `failureReason`、不 rethrow）維持原契約。註解請說明此函式是
              「重新啟動 opencode 子程序」的 wrapper，呼叫端透過
              `getOpencodeServerState()` 判斷重啟結果。
            completed: true
            last_files_changed:
              - backend/src/services/provider/opencodeServer.ts

      - id: P1.B
        title: 新增 WebSocket message types 與 zod schema
        tasks:
          - id: P1.B.t1
            text: |
              在 `backend/src/schemas/events.ts` 的 `WebSocketRequestEvents` enum
              （現有最後一筆為 `OPENCODE_ALIASES_REORDER`）下新增
              `OPENCODE_SERVER_RESTART = "opencode:server:restart"`；於
              `WebSocketResponseEvents` enum（現有最後一筆為
              `OPENCODE_ALIASES_UPDATED`）下新增
              `OPENCODE_SERVER_RESTART_RESULT = "opencode:server:restart:result"`。
            completed: true
            last_files_changed:
              - backend/src/schemas/events.ts
          - id: P1.B.t2
            text: |
              在 `backend/src/schemas/opencodeSettingsSchemas.ts` 仿
              `opencodeProviderListSchema` 的形式新增
              `opencodeServerRestartSchema = z.object({ requestId: requestIdSchema })`
              及對應 `OpencodeServerRestartPayload` 型別。再新增
              `OpencodeServerRestartResultPayload` discriminated union：
              `{ requestId: string; ok: true }` 與
              `{ requestId: string; ok: false; error: { code: string; message: string } }`，
              與其他 opencode 設定 result payload 形狀一致。
            completed: true
            last_files_changed:
              - backend/src/schemas/opencodeSettingsSchemas.ts

  - id: P2
    title: Handler 實作與 dispatch 註冊
    parallel: false
    verification:
      - cd backend && bun run test
      - cd backend && bun run style
    done: true
    items:
      - id: P2.A
        title: 實作 handleOpencodeServerRestart handler
        tasks:
          - id: P2.A.t1
            text: |
              在 `backend/src/handlers/opencodeSettingsHandlers.ts` 新增 export
              的 async 函式 `handleOpencodeServerRestart(connectionId, payload,
              requestId)`，命名與簽章對齊現有 `handleOpencodeProviderList`
              （L34-85）。從 `../services/provider/opencodeServer.js` import
              新增的 `restartOpencodeServer` 與既有 `getOpencodeServerState`。
              函式流程：先呼叫 `await restartOpencodeServer()`；接著讀取
              `getOpencodeServerState()`，若 `state.status === "ready"` 則回傳
              `{ requestId, ok: true }`；否則（status 為 "failed" 或其他非 ready
              值）回傳 `{ requestId, ok: false, error: { code:
              "opencode_restart_failed", message: state.failureReason ?? "opencode
              重新啟動失敗" } }`。回應走 `socketService.emitToConnection`，event
              為 `WebSocketResponseEvents.OPENCODE_SERVER_RESTART_RESULT`。
              註：state.failureReason 的 fallback 文字是「業務契約 message 不能空」
              的 envelope 必填欄位填寫，不算 silent fallback。
            completed: true
            last_files_changed:
              - backend/src/handlers/opencodeSettingsHandlers.ts

      - id: P2.B
        title: 在 opencodeSettingsHandlerGroup 註冊 dispatch
        tasks:
          - id: P2.B.t1
            text: |
              於 `backend/src/handlers/groups/opencodeSettingsHandlerGroup.ts`
              的 handlers 陣列末尾追加一筆登錄：event =
              `WebSocketRequestEvents.OPENCODE_SERVER_RESTART`、handler =
              `handleOpencodeServerRestart`、schema = `opencodeServerRestartSchema`、
              responseEvent = `WebSocketResponseEvents.OPENCODE_SERVER_RESTART_RESULT`。
              import 區塊同步補上新 handler 與新 schema 的引用。`backend/src/handlers/
              index.ts` 已透過 `registry.registerGroup(opencodeSettingsHandlerGroup)`
              注入此 group，**不需**改動 index.ts。
            completed: true
            last_files_changed:
              - backend/src/handlers/groups/opencodeSettingsHandlerGroup.ts

  - id: P3
    title: 測試（service 整合測試 + handler envelope 契約測試）
    parallel: true
    verification:
      - cd backend && bun run test
      - cd backend && bun run style
    done: true
    items:
      - id: P3.A
        title: opencodeServer service 整合測試
        tasks:
          - id: P3.A.t1
            text: |
              在 `backend/tests/services/` 新增（或就近放於現有 service test
              位置）`opencodeServer.test.ts`，使用既有的
              `setOpencodeServerLauncher` / `resetOpencodeServerLauncher`
              注入點（這是專案自己包的 wrapper，**非** mock 第三方 SDK）。
              撰寫兩個 case：
                (1) happy path：呼叫 `startOpencodeServer()` 成功後再呼叫
                    `restartOpencodeServer()`，斷言：第二次 launcher 被呼叫
                    （代表確實重 spawn）、最終 `getOpencodeServerState().status
                    === "ready"`、且第一次回傳的 server instance 的 `close()`
                    在 restart 過程中有被觸發（驗證 stop → start 的順序契約）。
                (2) sad path：先讓 launcher 第一次成功、第二次拋錯，呼叫
                    `restartOpencodeServer()` 後斷言 `state.status === "failed"`、
                    `state.failureReason` 包含 launcher 拋出的訊息、
                    `state.server === null`、`state.baseUrl === null`。
              注意：所有 mock 僅作用於 `OpencodeServerLauncher` 這個專案自定型別，
              **不得**直接 mock `@opencode-ai/sdk` 的 `createOpencodeServer`。
              測試後在 `afterEach` 呼叫 `resetOpencodeServerLauncher()` 並另外
              呼叫 `stopOpencodeServer()` 重置 singleton state，避免測試彼此污染。
            completed: true
            last_files_changed:
              - backend/tests/services/opencodeServer.test.ts

      - id: P3.B
        title: handleOpencodeServerRestart envelope 契約測試
        tasks:
          - id: P3.B.t1
            text: |
              在 `backend/tests/handlers/opencodeSettingsHandlers.test.ts`
              的 `describe("handleOpencodeServerRestart", ...)` 區塊新增測試，
              仿現有 `handleOpencodeProviderList` 測試的 mock 結構：mock
              `socketService.emitToConnection` 與
              `services/provider/opencodeServer.js`（mock 對象包括
              `restartOpencodeServer` 與 `getOpencodeServerState`，
              兩者皆為專案自己 export 的函式）。
              撰寫三個 case：
                (1) A1（wire-up smoke）：透過 `opencodeSettingsHandlerGroup`
                    找到 OPENCODE_SERVER_RESTART 的 definition，用
                    `createValidatedHandler` 走真實 zod parse pipeline，傳入合法
                    UUID requestId，斷言 `emitToConnection` 被呼叫一次且 event
                    為 `OPENCODE_SERVER_RESTART_RESULT`、`payload.ok === true`。
                (2) B1（happy path）：mock `restartOpencodeServer` resolve、
                    `getOpencodeServerState` 回傳 status="ready"，直接呼叫
                    `handleOpencodeServerRestart`，斷言 emitToConnection
                    payload 形狀為 `{ requestId, ok: true }`（不額外有 error
                    欄位）。
                (3) B2（sad path）：mock `restartOpencodeServer` resolve、
                    `getOpencodeServerState` 回傳 status="failed" 並含
                    `failureReason: "opencode binary 不存在"`，斷言
                    emitToConnection payload 形狀為 `{ requestId, ok: false,
                    error: { code: "opencode_restart_failed", message:
                    "opencode binary 不存在" } }`。
              測試只驗證 envelope 形狀；**不**寫 `expect(spy).toHaveBeenCalled()`
              這種純驗證 spy 被呼叫的測試。
            completed: true
            last_files_changed:
              - backend/tests/handlers/opencodeSettingsHandlers.test.ts
