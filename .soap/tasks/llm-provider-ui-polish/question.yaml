feature: llm-provider-ui-polish
created: "2026-05-21"
approved: true

questions:
  - id: Q1
    text: 現有 LLM Provider 設定畫面（LlmProviderModal + OpencodeSettingsPanel）目前的版面結構為何？返回按鈕、Model 對應表、Provider 清單分別位於哪裡？
    type: codebase-investigation
    completed: true
    answer: |
      LlmProviderModal.vue：DialogHeader 內僅有 DialogTitle（i18n key `llmProvider.modal.title`），
      無返回按鈕；step="opencode" 時，內容區頂端有一顆 ghost Button（ArrowLeft + 文字
      「llmProvider.modal.backButton」），按下後 step.value = "home"。
      OpencodeSettingsPanel.vue 結構：
        - 上半 (L276-401)「Model 對應表」(connectedProviders.value 為主)：以 v-for 渲染每個
          connected provider 一個區塊，標題列為 provider name + Button「llmProvider.opencode.aliases.addButton」
          （outline，h-7 px-2 text-xs，h-7 px-2 文字）；下方為 draft row（v-if draftRows[provider.id]）
          與 OpencodeAliasRow 列表。
        - 下半 (L404-490)「Provider 清單」(全部 providers)：標題列 + 重新整理 Button + 搜尋 Input；
          列表以 filteredProviders 做 v-for，未連線者整列 opacity-50，連線者顯示
          「llmProvider.opencode.providerList.connected」徽章。

  - id: Q2
    text: 現有 Model 對應表的拖曳排序如何實作？與 Goal 的 vue-draggable-plus 有何差異？
    type: codebase-investigation
    completed: true
    answer: |
      現有 alias 拖曳：原生 HTML5 DragEvent。OpencodeSettingsPanel.vue
        - handleAliasDragStart：記錄 draggingAliasId、設 dataTransfer
        - handleAliasDrop：直接呼叫 store.reorder()
        - handleAliasDragEnd：清狀態
      OpencodeAliasRow 透過 @dragstart/@dragover/@drop/@dragend emit 上送，全 row draggable。
      無任何拖曳預覽樣式（沒有 ghost / chosen class，被拖曳的元素位置不會即時可視化）。

      Goal 的 GoalEditorModal.vue：
        - 使用 `vue-draggable-plus` 的 <VueDraggable v-model="todos" handle=".goal-card__handle"
          :animation="180" ghost-class="sortable-ghost" chosen-class="sortable-chosen" />
        - handle 為 GripVertical icon 按鈕（goal-card__handle）
        - 樣式：.sortable-ghost { opacity: 0.4; background: var(--doodle-sand); }
                .sortable-chosen { box-shadow: 2px 3px 0 0 var(--doodle-ink); }

  - id: Q3
    text: Provider 清單目前的排序邏輯與資料來源為何？是否區分已登入 / 未登入？
    type: codebase-investigation
    completed: true
    answer: |
      providers 來源：opencodeApi.listOpencodeProviders() 回傳 { all, connected }。
      filteredProviders computed：僅做 case-insensitive 的 name/id 搜尋過濾，不做任何排序，
      順序維持 providers.value 的原順序（後端回傳順序）。
      已登入判斷：connected.value.includes(provider.id)，連線者顯示綠色徽章，未連線者
      整列加 opacity-50；但兩者交錯在同一個 v-for，沒有依連線狀態分組或排序。

  - id: Q4
    text: 已有 vue-draggable-plus 套件嗎？要直接複用 Goal 的拖曳樣式（sortable-ghost / sortable-chosen）來做 Model 對應表的拖曳預覽嗎？
    type: codebase-investigation
    completed: true
    answer: |
      `vue-draggable-plus` 已是專案 dependency（Goal 已使用）。複用其 VueDraggable 元件
      與 ghost-class/chosen-class 約定即可，不需另裝套件。視覺上可沿用 Goal 的兩條
      class 規則（透明度 0.4 + box-shadow），但 alias row 目前是 shadcn 風格（rounded-md
      border-border），未必要套 doodle 風格；實際樣式由使用者決定。

  - id: Q5
    text: 返回按鈕從「內容區頂端、附帶『返回』文字」改為「DialogHeader 標題左側、純 ArrowLeft 圖示」，確認原本內容區的整顆 Button（含文字）要整個移除？
    type: user-input
    completed: true
    answer: |
      完全移除原按鈕。新版返回鈕為 DialogHeader 內標題左側的 ArrowLeft icon
      button（純 icon，無文字），內容區頂端原本那顆 ghost Button + 文字
      「llmProvider.modal.backButton」整個拿掉。

  - id: Q6
    text: Card Expand/Collapsed 的預設狀態要怎麼設？(A) 全部展開 (B) 全部收合 (C) 第一個展開、其他收合 (D) 記憶上次狀態（localStorage）
    type: user-input
    completed: true
    answer: |
      全部收合。首次進入 opencode 設定畫面（或重整後）所有 connected provider
      Card 預設為 collapsed 狀態，使用者需手動展開。狀態僅存於 component
      ref（不做 localStorage 持久化）。

  - id: Q7
    text: 「+」按鈕（取代原「新增 model」文字按鈕）要放在哪？(A) Card 標題列右側、與 chevron 並排（collapsed 狀態也可見） (B) Card 展開後內容區最下方（收合狀態看不到）
    type: user-input
    completed: true
    answer: |
      Card 標題列右側。「+」icon button 與展開 chevron 並排於 Card 標題列右側，
      collapsed 狀態也可見並可點。

  - id: Q8
    text: 在 Card collapsed 狀態下按「+」按鈕的行為？(A) 自動展開 Card 並顯示 draft row (B) 只顯示 draft row 但 Card 維持收合 (C) collapsed 時 + 不可點（disabled）
    type: user-input
    completed: true
    answer: |
      自動展開並顯示 draft row。collapsed 狀態下按「+」會先把該 Card 展開，
      接著建立並顯示 draft row（沿用現行 handleAddClick 的 draft row 機制）。

  - id: Q9
    text: Card 收合動畫偏好？(A) 純 v-if / v-show 切換無動畫 (B) max-height + opacity transition 簡單滑動 (C) 引入 shadcn-vue Collapsible 元件（需新增 ui/collapsible）
    type: user-input
    completed: true
    answer: |
      引入 shadcn-vue Collapsible 元件。新增 `frontend/src/components/ui/collapsible/`
      目錄（基於 radix-vue / reka-ui，與專案其他 ui 元件一致）；含 Collapsible /
      CollapsibleTrigger / CollapsibleContent 三個 wrapper 與 index.ts。

  - id: Q10
    text: 拖曳時的視覺化要採用哪個版本？(A) 完全複用 Goal 樣式（sortable-ghost opacity 0.4 + chosen box-shadow + GripVertical 把手） (B) 沿用拖曳行為（vue-draggable-plus）但保留 alias row 現行 shadcn 風格、僅加 ghost 半透明預覽
    type: user-input
    completed: true
    answer: |
      完全複用 Goal 樣式。Model 對應表的拖曳改為 vue-draggable-plus 的
      <VueDraggable> 元件，套用：
        - handle: GripVertical icon 按鈕（取代現行整列 draggable）
        - ghost-class: sortable-ghost（opacity 0.4 + doodle-sand 背景）
        - chosen-class: sortable-chosen（box-shadow 2px 3px 0 0 doodle-ink）
        - :animation="180"
      Alias row 視覺整體改為 doodle 風格（border 2px doodle-ink、bg card、
      font-mono），與 Goal 一致；現行 shadcn rounded-md border-border 風格
      會被取代。
      註：本改動會讓 alias 區塊與 Provider 清單區塊風格不一致（後者仍 shadcn）；
      此差異在過審時請使用者最後確認。

  - id: Q11
    text: Provider 清單套用「已登入在上、未登入在下」後，群組內部要怎麼排？(A) 維持後端回傳原順序 (B) 字母 a→z (C) 已登入按連線時間 / id、未登入按字母
    type: user-input
    completed: true
    answer: |
      維持後端原順序。Provider 清單分為兩群顯示：上半為已連線（connected
      includes provider.id 為 true），下半為未連線；兩群內部都維持
      providers.value（後端 listOpencodeProviders 回傳）的原順序。

  - id: Q12
    text: 搜尋過濾時（providerSearch 有值），「已登入在上、未登入在下」的分組排序是否仍套用？
    type: user-input
    completed: true
    answer: |
      仍套用分組排序。搜尋過濾後（filteredProviders）依然套「已登入在上、
      未登入在下」的分組規則，群組內部維持後端原順序，與無搜尋狀態行為一致。

  - id: Q13
    text: 「重新啟動 OpenCode」涉及的後端架構與檔案位置為何？是否已有現成的 restart 函式可重用？
    type: codebase-investigation
    completed: true
    answer: |
      後端 opencode server 子程序由 backend/src/services/provider/opencodeServer.ts
      管理：
        - L42-47 模組層級 singleton state（baseUrl / status / failureReason / server instance）
        - L87-116 `startOpencodeServer()` async：state 由 idle → starting → ready/failed
        - L129-142 `stopOpencodeServer()` 同步：呼叫 server.close() 並重置 state 為 idle
        - **無現成的 restart 函式**，需新增 `restartOpencodeServer()` 包裝 stop + start
      Handler 層 backend/src/handlers/opencodeSettingsHandlers.ts：命名約定 handle<Action>，
      回傳 envelope `{requestId, ok, error?: {code, message}, ...result}`。
      需新增 `handleOpencodeServerRestart()`。
      WebSocket message types：
        - 後端 backend/src/schemas/events.ts L74-79 (REQUEST) / L191-197 (RESPONSE)
        - 前端 frontend/src/types/websocket/events.ts L81-91 / L217-229
        - 兩處皆新增 OPENCODE_SERVER_RESTART (request) 與 OPENCODE_SERVER_RESTART_RESULT (response)
      啟動點：backend/src/index.ts L75 啟動時呼叫 startOpencodeServer()，L254 shutdown
      呼叫 stopOpencodeServer()。restart 只影響 opencode 子程序，不影響整個 canvas 後端應用。
      前端 service：frontend/src/services/opencodeApi.ts L90-118 listOpencodeProviders 的
      createWebSocketRequest pattern 可直接複用。
      i18n：frontend/src/locales/zh-TW.json 現有 `llmProvider.opencode.providerList.refresh`
      L432「重新整理」，三語檔（zh-TW / en / ja）同位置需新增 restart 系列 key。
      UI pattern：現行 Loader2 spinner + outline Button + useToast（toast({title, variant:
      'destructive'}) 或 showSuccessToast / showErrorToast helper）。

  - id: Q14
    text: 原「重新整理」按鈕（OpencodeSettingsPanel.vue L410-422）的替換策略？
    type: user-input
    completed: true
    answer: |
      完全取代為「重新啟動」。原 refresh 按鈕拿掉，同一位置改為「重新啟動 OpenCode」
      按鈕；不保留「只重新讀取」選項。restart 成功後自動執行 loadFromBackend()
      重新拉 provider 清單。

  - id: Q15
    text: restart 期間的 UI 行為（loading / disable 範圍 / 成功提示）要怎麼設？
    type: user-input
    completed: true
    answer: |
      只 disable 按鈕並跑 loading + 成功 toast。
        - 按下後該按鈕 disabled、顯示 Loader2 spinner 與 restarting 文案
        - 其他 panel 區塊（aliases CRUD、provider 清單）不額外 disable
        - restart 成功 → success toast（i18n `llmProvider.opencode.serverRestartSuccess`）
          + 自動 loadFromBackend()
        - restart 失敗 → destructive toast（沿用現行 useToast pattern，含後端
          回傳的 error.message）

  - id: Q16
    text: 按下「重新啟動 OpenCode」是否需要二次確認 Dialog？
    type: user-input
    completed: true
    answer: |
      不需要、直接觸發。restart 在使用者認知上是「重讀 auth」的等價動作，
      不需 AlertDialog 攔截；單次點擊即觸發 stop + start + reload 流程。
