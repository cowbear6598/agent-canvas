feature: history-retention-sqlite-cleanup
approved: true
scenarios:
  - id: F1
    scenario: 使用者完成新的執行後歷程只保留最近 30 筆已完成紀錄
    given:
      - 使用者正在查看某個畫布的執行歷程
      - 該畫布已經有 30 筆已完成的歷程
    when:
      - 使用者再次觸發一次執行
      - 該執行順利完成
    then:
      - 歷程中保留最新的 30 筆已完成紀錄
      - 最舊的超額已完成紀錄會自動消失

  - id: F2
    scenario: 使用者在歷程超額時仍可看到尚未結束的執行
    given:
      - 使用者正在查看某個畫布的執行歷程
      - 該畫布的歷程總數已經超過 30 筆
      - 其中有一筆執行仍在進行中
    when:
      - 使用者持續查看這筆尚未結束的執行
    then:
      - 這筆執行在完成前不會被自動刪除
      - 使用者仍可看到這筆執行的狀態更新

  - id: F3
    scenario: 使用者看到落在 30 筆外的執行在終止後自動清除
    given:
      - 使用者正在查看某個畫布的執行歷程
      - 該畫布的歷程總數已經超過 30 筆
      - 其中有一筆執行尚未結束
      - 這筆執行結束後會落在最近 30 筆之外
    when:
      - 這筆執行以完成或終止狀態結束
    then:
      - 這筆執行會在結束後自動從歷程移除
      - 使用者不會看到超過 30 筆的保留歷程
