feature: history-retention-sqlite-cleanup
created: "2026-06-22"
approved: true
frontend:
  required: false
  reason: 這次需求只調整 run 歷程的保留與 SQLite 清理規則，不需要新增或修改前端顯示行為。
  evidence:
    - question.yaml Q1 確認最大筆數限制與 SQLite 刪除流程都在後端 `runExecutionService` 與 `runStore`。
    - question.yaml impact classification 將 frontend 判定為 unlikely，且 evidence 指出前端只做顯示層裁切。
    - userflow.yaml F1 到 F3 都描述歷程保留規則，未出現新的前端操作、文案或介面需求。
backend:
  required: true
  reason: 需要修改 workflow run 在完成或終止後的自動清理條件，並確保 SQLite 只保留最近 30 筆符合規則的歷程。
  evidence:
    - question.yaml Q1 確認目前 overflow 清理只挑 `status = 'completed'`，且用背景非同步執行，會造成 SQLite 留下超額紀錄。
    - question.yaml Q2 明確要求 run 必須完成或終止後才能刪除，且落在 30 筆外時要自動清除。
    - userflow.yaml F2 與 F3 要求進行中的 run 不可提前消失，但結束後若落在 30 筆外必須自動移除。
