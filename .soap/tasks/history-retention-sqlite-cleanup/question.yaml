feature: history-retention-sqlite-cleanup
created: "2026-06-22"
approved: true
impact_classification:
  frontend:
    status: unlikely
    evidence:
      - 使用者描述聚焦在歷程超出最大筆數後，SQLite 紀錄沒有同步刪除，未提到畫面、互動、文案或路由調整。
      - codebase 查證顯示前端只做顯示層裁切；實際的上限判斷與 SQLite 刪除流程都在後端。
  backend:
    status: required
    evidence:
      - 使用者明確指出「超出最大比數後沒有順便砍掉 SQLite 的紀錄」，屬於後端 run 歷程持久化與清理邏輯。
      - codebase 查證顯示最大筆數常數、overflow 清理、`workflow_runs` 刪除與關聯表 cascade 都由後端負責。
      - 使用者明確要求只有 completed / 終止後的 workflow run 才能被刪除，且超過 30 筆時需自動清理。
questions:
  - id: Q1
    text: 目前 run 歷程超過最大筆數時，後端限制與 SQLite 刪除流程實際怎麼運作？為什麼會出現超出上限但 DB 仍留資料的情況？
    type: codebase-investigation
    completed: true
    answer: |
      後端上限是 `backend/src/services/workflow/runExecutionService.ts` 的
      `MAX_RUNS_PER_CANVAS = 30`。每次 `createRun()` 建立新 run 後，會呼叫
      `enforceRunLimit(canvasId)`；這裡先用 `runStore.countRunsByCanvasId(canvasId)`
      計算 `workflow_runs` 總數，再用
      `runStore.getOldestCompletedRunIds(canvasId, overflow)` 只挑
      `status = 'completed'` 的最舊 run 進行清理。

      真正刪 DB 的流程在同檔 `deleteRun(runId)`：它最後會呼叫
      `runStore.deleteRun(runId)`，而 `backend/src/services/runStore.ts` 對應的 SQL 是
      `DELETE FROM workflow_runs WHERE id = ?`。SQLite schema
      `backend/src/database/schema.ts` 裡的 `run_pod_instances`、`run_messages`、
      `run_goal_round_dividers` 都對 `workflow_runs(id)` 設了 `ON DELETE CASCADE`，
      所以只要有進到 `deleteRun()`，run 主表與關聯表資料都會一起刪掉。

      目前程式碼可確認有兩個會讓「超過上限但 SQLite 仍留資料」發生的條件：
      第一，`enforceRunLimit()` 是 `void this.cleanupOverflowRuns(oldestIds)` 背景執行，
      `createRun()` 不會等待刪除完成；若在 cleanup 尚未跑完時觀察 DB，會暫時看到超過 30 筆。
      第二，overflow 計算看的是全部 `workflow_runs`，但候選刪除只挑
      `status = 'completed'`；如果超出的那些歷程主要是 `error`、`blocked`、
      `cancelled` 或仍在 `running`，`oldestIds` 可能不足甚至為空，SQLite 就會持續保留超額資料。

      前端 `frontend/src/stores/run/runHistoryNormalizer.ts` 與
      `frontend/src/stores/run/runStore.ts` 也各自用 `MAX_RUNS_PER_CANVAS = 30`
      做顯示層裁切，所以 UI 可能已只顯示 30 筆，但 DB 實際仍保有更多 `workflow_runs`。
  - id: Q2
    text: 超過 30 筆時，使用者期望的 workflow run 清理規則是什麼？
    type: user-input
    completed: true
    answer: |
      使用者要求兩條規則：
      1. workflow run 必須等到完成或終止後才能被刪除；若該 run 在總數已經落在 30 筆之外，
         則在它結束當下自動清除。
      2. 已完成的 run 只要超過 30 筆，就要自動刪除最舊的超額紀錄。
