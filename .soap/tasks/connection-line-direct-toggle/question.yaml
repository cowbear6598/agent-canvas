feature: connection-line-direct-toggle
created: "2026-06-03"
approved: true
impact_classification:
  frontend:
    status: required
    evidence:
      - 需求明確要求將 connection line 的 direct 從選項改成 toggle，屬於使用者可見的互動調整。
      - 需求明確要求真正可選類別改為 Auto / Branch，會影響前端選單與文案呈現。
  backend:
    status: required
    evidence:
      - 使用者明確指定未來不會再有 direct connection，而是 Auto / Branch 都可套用 direct toggle。
      - 現有前後端型別、WebSocket schema、workflow 與資料庫更新流程都把 direct 當成 triggerMode 的正式枚舉值，沒有獨立 toggle 欄位。
      - 使用者要求 branch 情境下設定 direct 時同 source 的 branch connections 要一起設定，現有後端 sibling 同步僅涵蓋 branch AI 設定，未涵蓋 direct。
      - 使用者明確要求既然 model settings 已統一，這次應一併清掉或整併舊的 branch-specific model 設定與同步邏輯。
questions:
  - id: Q1
    text: 現有 codebase 如何表示 connection 的 trigger mode，direct 是否為第一級資料模式而非純 UI 狀態？
    type: codebase-investigation
    completed: true
    answer: |
      是。前後端型別都將 triggerMode 定義為 `auto | branch | direct`
      （例如 `frontend/src/types/connection.ts`、`backend/src/types/connection.ts`）。
      WebSocket update schema 也直接接受 `triggerMode: "auto" | "branch" | "direct"`
      （`backend/src/schemas/connectionSchemas.ts`）。前端右鍵選單目前也把 direct
      當成獨立選項送出 `connection:update`（`frontend/src/components/canvas/ConnectionContextMenu.vue`），
      ConnectionLine 顯示則以 `triggerMode === "direct"` 畫出 `D` 標記
      （`frontend/src/components/canvas/ConnectionLine.vue`）。後端 workflow/status
      流程同樣把 direct 視為獨立路徑，而非 auto/branch 的附加旗標
      （例如 `backend/src/services/workflow/workflowStateService.ts`）。
  - id: Q2
    text: 現有 codebase 是否已支援 branch 相關設定的同 source sibling 同步？這份同步目前涵蓋哪些欄位？
    type: codebase-investigation
    completed: true
    answer: |
      已有部分支援，但內容需要分開看。後端
      `connectionStore.updateBranchSiblingSettings()` 仍存在，且只會在目標模式仍為
      `branch`、更新內容包含 `branchProvider` / `branchModel` / `branchThinkingLevel`
      時，同步同一 sourcePod 下的 branch siblings
      （`backend/src/services/connectionStore.ts`）。

      但目前 branch 決策實際執行時，`branchDecisionService` 讀的是全域
      `configStore.getConnectionLineModelConfig()`，也就是
      `connectionLineProvider` / `connectionLineModel` /
      `connectionLineThinkingLevel`，不是從 connection 本身的
      `branchProvider` / `branchModel` / `branchThinkingLevel` 取值
      （`backend/src/services/workflow/branchDecisionService.ts`）。

      前端也仍保留 branch-specific 欄位在 request/response 型別、copy/paste 與
      store helper 中，但目前沒有看到對應的可見 UI 入口在調整這些欄位；
      `BranchEditModal` 現在只編輯 label / description
      （`frontend/src/components/canvas/BranchEditModal.vue`）。

      結論：branch sibling 同步機制還在，但它同步的是 branch-specific model 欄位；
      而真正執行 branch 決策的模型設定目前已集中到全域 connection line model
      settings。至於 direct 需求本身，現況仍沒有同等級的 direct toggle 同步機制。
  - id: Q3
    text: 當一條原本來自 branch 的 connection 被切到 direct 後，若之後把 direct toggle 關掉，應該回到 branch，還是一律回到 auto？
    type: user-input
    completed: true
    answer: |
      使用者澄清前提不成立：未來不應再存在 `triggerMode = direct` 的 connection。
      direct 會改成可附加在 `auto` 與 `branch` 上的 toggle，因此資料模型必須能同時表示
      「基底模式（auto / branch）」與「是否 direct」。
  - id: Q4
    text: 現有 codebase 是否已存在可獨立承載 direct toggle 的 connection 欄位或 API payload？
    type: codebase-investigation
    completed: true
    answer: |
      未發現。connection 相關前後端型別、WebSocket request/response schema、
      store mapper、repository 與 workflow 流程，都是以 `triggerMode` 單一欄位承載
      `auto | branch | direct`。沒有獨立的 `directEnabled`、`isDirect` 或同等欄位可沿用
      （例如 `frontend/src/types/connection.ts`、`frontend/src/types/websocket/requests.ts`、
      `backend/src/schemas/connectionSchemas.ts`、`backend/src/services/connectionRepository.ts`、
      `backend/src/services/workflow/workflowExecutionService.ts`）。
  - id: Q5
    text: 既然 branch 決策已統一使用全域 model settings，這次是否要一併清理舊的 branch-specific model 欄位與同步邏輯？
    type: user-input
    completed: true
    answer: |
      要。使用者明確要求這次應順便處理這些 legacy 結構，不要只在 Discover 註記現況；
      若確認已由統一 model settings 取代，就應納入本次規劃一起清掉或整併。
