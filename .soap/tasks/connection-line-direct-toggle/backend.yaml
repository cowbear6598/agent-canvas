feature: connection-line-direct-toggle
side: backend
approved: true
phases:
  - id: P1
    title: Connection 資料模型重構
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P1.A
        title: Schema 與 repository 契約調整
        tasks:
          - id: P1.A.t1
            text: 調整 `backend/src/types/connection.ts`、`backend/src/schemas/connectionSchemas.ts`、`backend/src/schemas/pasteSchemas.ts` 與 `backend/src/schemas/serverEventManifest.ts`，讓 connection 契約只保留 Auto / Branch 基底模式，新增 direct toggle 對應欄位
            completed: true
            last_files_changed:
              - backend/src/schemas/connectionSchemas.ts
              - backend/src/schemas/pasteSchemas.ts
              - backend/src/schemas/serverEventManifest.ts
              - backend/src/types/connection.ts
              - backend/src/types/index.ts
          - id: P1.A.t2
            text: 更新 `backend/src/database/schema.ts`、`backend/src/database/statements.ts`、`backend/src/services/connection/connectionRepository.ts` 與 `backend/src/services/connection/connectionRowMapper.ts`，為 connection 儲存新的 direct 欄位，並移除 branch_provider、branch_model、branch_thinking_level 的讀寫與 fallback 映射
            completed: true
            last_files_changed:
              - backend/src/database/schema.ts
              - backend/src/database/statements.ts
              - backend/src/services/connection/connectionRepository.ts
              - backend/src/services/connection/connectionRowMapper.ts
          - id: P1.A.t3
            text: 在資料升級流程中將既有 `trigger_mode = direct` 的 rows 正規化為新的 direct 表示方式，並統一以可保留現行 no-wait 行為的基底模式落盤，避免資料庫再留下 direct 第三模式
            completed: true
            last_files_changed:
              - backend/src/database/schema.ts
              - backend/src/services/connection/connectionRowMapper.ts
              - backend/tests/database/schema.test.ts

  - id: P2
    title: 連線更新與執行語意收斂
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P2.A
        title: Command 與 branch 群組同步流程
        tasks:
          - id: P2.A.t1
            text: 調整 `backend/src/services/commands/connectionCommandService.ts` 與 `backend/src/services/connectionStore.ts`，讓單條 connection 的基底模式更新與 direct toggle 更新分開處理
            completed: true
            last_files_changed:
              - backend/src/services/commands/connectionCommandService.ts
              - backend/src/services/connectionStore.ts
          - id: P2.A.t2
            text: 以同一個 transaction 實作同 source Pod 的 Branch connections direct toggle 同步，並刪除只服務 legacy branch model 欄位的 sibling 同步路徑
            completed: true
            last_files_changed:
              - backend/src/services/connection/connectionRepository.ts
              - backend/src/services/connectionStore.ts
      - id: P2.B
        title: Workflow no-wait 語意保留
        tasks:
          - id: P2.B.t1
            text: 更新 `backend/src/services/workflow/workflowHelpers.ts`、`backend/src/services/workflow/workflowStateService.ts` 與 `backend/src/services/workflow/workflowExecutionService.ts`，讓 Auto 與 Branch connection 在 direct 開啟時仍跑各自基底邏輯，但不再進入需要等待其他來源的 multi-input gating
            completed: true
            last_files_changed:
              - backend/src/services/workflow/workflowAutoTriggerService.ts
              - backend/src/services/workflow/workflowBranchTriggerService.ts
              - backend/src/services/workflow/workflowExecutionService.ts
              - backend/src/services/workflow/workflowHelpers.ts
              - backend/src/services/workflow/workflowStateService.ts
          - id: P2.B.t2
            text: 調整 `backend/src/services/workflow/workflowPipeline.ts`、`backend/src/services/workflow/runExecutionService.ts` 與相關 event payload，讓 direct 路徑只代表 no-wait pathway，而不是第三種 connection 類別
            completed: true
            last_files_changed:
              - backend/src/services/workflow/runExecutionService.ts
              - backend/src/services/workflow/workflowPipeline.ts

  - id: P3
    title: Legacy 清理與回歸測試
    parallel: false
    verification:
      - cd backend && bun run style
      - cd backend && bun run test
    done: true
    items:
      - id: P3.A
        title: 移除 branch-specific model 殘留流程
        tasks:
          - id: P3.A.t1
            text: 清理 `backend/src/services/provider/opencodeAliasService.ts`、paste handler 與其他仍依賴 branch_provider、branch_model、branch_thinking_level 的分支，改以統一的 connection line model settings 作為 branch 決策來源
            completed: true
            last_files_changed:
              - backend/tests/business-logic/connectionStatusPersistence.test.ts
              - backend/tests/business-logic/opencodeAliasesHandlers.test.ts
      - id: P3.B
        title: 測試更新
        tasks:
          - id: P3.B.t1
            text: 更新 `backend/tests/business-logic/connectionStoreBranchUpdate.test.ts`、`backend/tests/userflows/connection.test.ts` 與相關 schema 測試，驗證 connection update API 改以新 direct 欄位承載狀態
            completed: true
            last_files_changed:
              - backend/tests/business-logic/connectionStoreBranchUpdate.test.ts
              - backend/tests/database/schema.test.ts
              - backend/tests/userflows/connection.test.ts
          - id: P3.B.t2
            text: 更新 `backend/tests/business-logic/workflowStateService.test.ts`、`backend/tests/business-logic/workflowExecutionService.test.ts` 與 direct 流程測試，驗證 Auto / Branch 在 direct 開啟時保留基底邏輯且不等待其他來源
            completed: true
            last_files_changed:
              - backend/tests/business-logic/runExecutionHelpers.test.ts
              - backend/tests/business-logic/workflowStateService.test.ts
          - id: P3.B.t3
            text: 更新 `backend/tests/business-logic/branchDecisionService.test.ts`、`backend/tests/business-logic/workflowPipeline.test.ts` 與 `backend/tests/integration/config-ws.test.ts`，確認 branch 決策只依賴統一 model settings，legacy branch model 欄位移除後仍能正常運作
            completed: true
            last_files_changed:
              - backend/src/services/workflow/workflowPipeline.ts
              - backend/tests/business-logic/connectionStatusPersistence.test.ts
              - backend/tests/business-logic/opencodeAliasesHandlers.test.ts
