feature: connection-line-direct-toggle
approved: true
scenarios:
  - id: F1
    scenario: 使用者在 connection 選單中切換連線類別
    given:
      - 使用者已在畫布上建立 connection
      - 使用者已開啟該 connection 的選單
    when:
      - 查看可選的連線類別
      - 在 Auto 與 Branch 之間切換
    then:
      - 選單中只有 Auto 與 Branch 兩種可選類別
      - Direct 以獨立 toggle 呈現
      - 連線切換後維持既有的運行結果

  - id: F2
    scenario: 使用者為 Auto connection 開關 direct 效果
    given:
      - 使用者已在畫布上建立 Auto connection
      - 使用者已開啟該 connection 的選單
    when:
      - 開啟 direct toggle
      - 關閉 direct toggle
    then:
      - connection 維持 Auto connection 的基底邏輯
      - 開啟後 connection 可以不等待其他來源而先觸發
      - connection 的顯示維持既有呈現方式
      - 關閉後 connection 回到一般 Auto 狀態

  - id: F3
    scenario: 使用者為 branch 群組同步開關 direct 效果
    given:
      - 同一個來源 Pod 有多條 Branch connection
      - 使用者已開啟其中一條 Branch connection 的選單
    when:
      - 切換 direct toggle
    then:
      - 同一個來源 Pod 底下的 Branch connections 會一起套用相同的 direct 狀態
      - 這些 Branch connections 維持各自原本的 Branch 判斷邏輯
      - 開啟後這些 Branch connections 可以不等待其他來源而先觸發
      - 這些 Branch connections 維持既有的顯示方式
